<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#07080b" />
<title>Flappy Phage v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #07080b; --p0: #0b0d12; --p1: #11141c; --line: #2a3142; --text: #e8eef5; --muted: #8a97a8; --acc: #5ab4e0; --gold: #ffd166; --red: #ff6b6b; --green: #7cf29a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.3 "Pixelify Sans", monospace; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
#ov { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: none; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 12px; z-index: 5; pointer-events: none; }
#ov.show { display: flex; }
.btn { pointer-events: auto; font: 12px "Silkscreen", monospace; color: var(--text); background: #1a1f2b; border: 0; box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 #05060a; padding: 9px 13px; cursor: pointer; }
.btn:hover { box-shadow: inset 0 0 0 2px var(--acc), 0 3px 0 #05060a; color: #fff; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--acc), 0 1px 0 #05060a; }
.btn.pri { background: #1f6f8f; box-shadow: inset 0 0 0 2px #5ab4e0, 0 3px 0 #05060a; }
#top { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; gap: 6px; z-index: 5; }
#top .btn { padding: 6px 9px; font-size: 11px; }
#chip { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; z-index: 5; font: 10px "Silkscreen", monospace; color: var(--muted); background: rgba(11,13,18,.8); box-shadow: inset 0 0 0 2px var(--line); padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
#chip b { color: var(--gold); font-weight: normal; }
#toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font: 12px "Silkscreen", monospace; background: #1f6f8f; color: #fff; box-shadow: inset 0 0 0 2px #5ab4e0, 0 4px 0 #05060a; padding: 10px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; text-align: center; max-width: 92vw; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="chip"><span>FLAPPY PHAGE <b>v1</b></span><span id="chipmode"></span></div>
<div id="top"><button class="btn" id="bsnd" title="Sound">SOUND ON</button></div>
<div id="ov">
  <button class="btn" id="bskin">SKIN: PHAGE</button>
  <button class="btn" id="bmode">MODE: CLASSIC</button>
  <button class="btn pri" id="bcopy">COPY SCORE</button>
</div>
<div id="toast"></div>
<script>
/* =====================================================================
   FLAPPY PHAGE — one button, zero mercy.
   A bacteriophage pulses through a microfluidic channel full of pipette
   tips. Pass a tip: +1. Infect a bacterium sitting in the gap: +3.
   Die: the game tells you what it thinks of you.
   ===================================================================== */
"use strict";
const $ = (id) => document.getElementById(id);
const DEBUG = /[?&]debug\b/.test(location.search);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dstr = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => dstr(new Date());

/* ---------- persistence ---------- */
const KEY = "flappyPhage";
let M = { best: 0, attempts: 0, infections: 0, streak: 0, lastDay: "", skin: "phage", skins: ["phage"], lastTaunt: -1, dailyBest: {}, mode: "classic", sound: 1, totalScore: 0, bestCombo: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && typeof s === "object") M = Object.assign(M, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(M)); } catch (e) {} };
(function streak() {
  const t = today();
  if (M.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  M.streak = M.lastDay === dstr(y) ? M.streak + 1 : 1;
  M.lastDay = t; save();
})();

/* ---------- skins: unlocked by the classic best score ---------- */
const SKINS = [
  { id: "phage", n: "Phage", need: 0, note: "Bacteriophage T4. Head, tail, fibres. Classic." },
  { id: "ecoli", n: "E. coli", need: 10, note: "Escherichia coli. Flagella optional, enthusiasm mandatory." },
  { id: "tardi", n: "Tardigrade", need: 25, note: "Survives vacuum, radiation, your lab's freezer. Not pipette tips." },
  { id: "mouse", n: "Lab mouse", need: 50, note: "Model organism. Model behaviour not included." },
  { id: "tip", n: "Pipette tip", need: 100, note: "You have become the obstacle." }
];

/* ---------- daily mutation: one per calendar day, from the date ---------- */
const MUTS = [
  { id: "invert", n: "Inverted gravity", d: "Up is down. The channel is upside down today." },
  { id: "tiny", n: "Tiny gaps", d: "Narrow gaps, slower flow. Precision day." },
  { id: "night", n: "Night mode", d: "Someone turned the lights off. You see only what is near you." },
  { id: "heavy", n: "Heavy buffer", d: "Thicker medium: you fall faster and pulse harder." },
  { id: "hyper", n: "Hyperflow", d: "The pump is set too high. Wide gaps, no time." },
  { id: "swarm", n: "Swarm", d: "Every gap has a bacterium in it. Infect everything." }
];
const dayHash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; };
const dailyMut = () => MUTS[dayHash(today()) % MUTS.length];

/* ---------- taunts: by score tier; a new best gets a slightly nicer one ---------- */
const TAUNTS = {
  t0: [ // 0–2
    "Reviewer 2: \"The authors did not even attempt to fly.\"",
    "Your PI saw that. They are drafting an email.",
    "Score: a negative control. Congratulations.",
    "That was the practice run, right? Right?",
    "The plasmid you forgot in the fridge has lasted longer.",
    "A pipette tip. You died to a pipette tip.",
    "Statistically indistinguishable from not playing.",
    "n = 1, p = 0.99. Conclusion: skill issue.",
    "Your labmate just asked if you need the protocol.",
    "Flap. It is one button. One.",
    "Reviewer 2: \"Reject. Do not resubmit.\"",
    "The undergrad on the next bench got further. Blindfolded.",
    "That run was shorter than a 30-second spin.",
    "Methods section: 'we tapped once and hoped'.",
    "Even the autoclave did not take that long to kill you.",
    "You were out-competed by a stationary pipette tip.",
    "Your PI: \"Is this the preliminary data you mentioned?\"",
    "Lysed before the first tip. Textbook.",
    "A phage with no host, no plan, no survival.",
    "That is not a learning curve. That is a flat line."
  ],
  t1: [ // 3–9
    "Promising preliminary data. Not publishable.",
    "Reviewer 2: \"Minor revisions: everything.\"",
    "Your contamination lasted longer than that run.",
    "That is a poster, not a paper.",
    "Nice. Now do it again with three biological replicates.",
    "Your PI nodded. Then went back to their phone.",
    "A decent pilot. Shame about the ending.",
    "The error bars on that performance are enormous.",
    "Reviewer 2: \"The trend is suggestive but not significant.\"",
    "You passed some tips. The tips remain undefeated.",
    "A single colony on the plate. Pick it and move on.",
    "Mid. Respectably mid.",
    "That is one figure. A paper needs five.",
    "Your labmate: \"Oh, you are still playing that?\"",
    "Good control. Now show me the experiment.",
    "Your PI has seen worse. Barely."
  ],
  t2: [ // 10–24
    "Reviewer 2: \"Interesting, but what does it mean?\"",
    "A solid supplementary figure.",
    "Your PI: \"Good. Why did you stop?\"",
    "Acceptable. Not for Nature, but acceptable.",
    "Reviewer 2 requests one more replicate. Of the whole run.",
    "That was almost competent. Almost.",
    "Your labmate is pretending not to be impressed.",
    "The data are robust. The pilot is not.",
    "Nearly a full lane on the gel. Nearly.",
    "Your PI mentioned you in group meeting. Briefly.",
    "A clean run until the moment it was not.",
    "Reviewer 2: \"Figure 3 is fine. The rest, less so.\"",
    "Competent flapping. Faint praise, still praise.",
    "Not bad. Say that to yourself, nobody else will."
  ],
  t3: [ // 25+
    "Fine. You can fly. Can you write a thesis?",
    "Reviewer 2 has accepted. Reviewer 3 has entered the chat.",
    "Your PI: \"Great. Do it again, we lost the file.\"",
    "Impressive. The tips are taking it personally.",
    "That run was longer than most postdoc contracts.",
    "Reviewer 2: \"I have no further comments.\" (Suspicious.)",
    "Your labmate has quietly started a rival project.",
    "The ethics board would like a word about those bacteria.",
    "Nearly a lab legend. Then, a tip.",
    "Cite yourself. Nobody else will.",
    "Your PI is updating the grant. You are 'preliminary data'.",
    "That deserves a lab-meeting cake. Not a big one."
  ],
  best: [
    "New record. Your PI will still ask about the controls.",
    "Personal best. Figure 1 material.",
    "Reviewer 2 is... quiet. Suspicious, but take it.",
    "A new best. Write it in the notebook before you forget.",
    "Record run. Reproduce it or it did not happen.",
    "Best yet. Your labmate says it was luck. Your labmate is jealous.",
    "New high score. Somewhere, a pipette tip weeps.",
    "Personal best. Save the raw data this time."
  ]
};

/* ---------- audio: everything synthesized ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f0, f1, dur, type, vol, delay) {
  const a = AC; if (!a || !M.sound) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol) {
  const a = AC; if (!a || !M.sound) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900; s.buffer = b; g.gain.value = vol || .2;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const SFX = {
  flap: () => tone(380, 640, .08, "square", .05),
  score: () => { tone(880, 880, .06, "square", .06); tone(1320, 1320, .08, "square", .05, .06); },
  close: () => tone(1500, 2200, .05, "triangle", .05),
  infect: () => { [660, 880, 1100, 1480].forEach((f, i) => tone(f, f, .07, "square", .06, i * .05)); },
  die: () => { noise(.35, .25); tone(300, 60, .4, "sawtooth", .12); },
  best: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, .12, "square", .07, i * .09)); },
  unlock: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, f * 1.01, .1, "triangle", .07, i * .08)); },
  tap: () => tone(500, 500, .04, "square", .04)
};

/* ---------- pixel sprites ---------- */
const PAL = { X: "#0b0d12", B: "#5ab4e0", L: "#c6ecff", D: "#2f6f8f", W: "#f4f8ff", G: "#7cf29a", g: "#2e8a4a", Y: "#ffd166", O: "#d9955a", o: "#8c5a2e", P: "#f3a7c4", R: "#ff6b6b", M: "#c9d2dc", m: "#8a97a8", C: "#bfe6f5", c: "#6fb9d6", K: "#1a1f2b" };
const SPR = {
  phage: [
    ".....XXX.....",
    "....XLBBX....",
    "...XLBBBBX...",
    "...XBBBBBX...",
    "...XBBBBBX...",
    "....XBBBX....",
    ".....XXX.....",
    ".....XDX.....",
    ".....XDX.....",
    ".....XDX.....",
    ".....XDX.....",
    "....XXDXX....",
    "...XD.D.DX...",
    "..XD..D..DX..",
    ".XD...X...DX.",
    ".X.........X."
  ],
  ecoli: [
    "......XXXXXXXXX..",
    "..X..XGGGGGGGGGX.",
    "...X.XGggGGGGGGXX",
    "....XXGGGGGGLGGGX",
    "..X..XGGGGGGGGGXX",
    "...X.XGGGGGGGGGX.",
    "....XXGGggGGGGGX.",
    ".....XGGGGGGGGGX.",
    "......XXXXXXXXX.."
  ],
  tardi: [
    ".....XXXXXXXXX...",
    "...XXOOOOOOOOOXX.",
    "..XOOOOOOOOOOOOX.",
    "..XOOXOOOOOOOXOOX",
    "..XOOOOOOOOOOOOOX",
    "..XOOoOOoOOoOOOX.",
    "...XOOOOOOOOOOXX.",
    "....XXoXXoXXoXX..",
    ".....XX.XX.XX...."
  ],
  mouse: [
    "......XXX.XXX....",
    ".....XPPXXPPX....",
    "....XWWWWWWWWX...",
    "XX.XWWWWWWWWWWX..",
    "..XWWWWWWWWWWXWX.",
    "...XWWWWWWWWWWXX.",
    "....XWWXWWWWXWWX.",
    ".....XXX.XXX.XXX."
  ],
  tip: [
    "XXXXXXXXXXX",
    "XCCCCCCCCCX",
    "XCCCCLCCCCX",
    ".XCCCLCCCX.",
    ".XCCCLCCCX.",
    "..XCCLCCX..",
    "..XCCLCCX..",
    "...XCLCX...",
    "...XCLCX...",
    "....XLX....",
    "....XLX....",
    ".....X....."
  ],
  bact: [
    "..XXXXX..",
    ".XGGGGGXX",
    "XGGLGGGGX",
    ".XGGGGGXX",
    "..XXXXX.."
  ]
};
const BAKED = {};
function bake(name, rows) {
  const w = rows[0].length, h = rows.length, c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  rows.forEach((r, y) => { for (let x = 0; x < w; x++) { const ch = r[x]; if (ch !== ".") { g.fillStyle = PAL[ch] || "#f0f"; g.fillRect(x, y, 1, 1); } } });
  return (BAKED[name] = c);
}
Object.keys(SPR).forEach((k) => bake(k, SPR[k]));

/* ---------- canvas: low-res buffer scaled up with hard pixels ---------- */
const cv = $("cv"), X = cv.getContext("2d");
const buf = document.createElement("canvas"), B = buf.getContext("2d");
const LH = 256; let LW = 320, SC = 1, DPR = 1, VW = 320, VH = 256;
function resize() {
  VW = Math.max(1, window.innerWidth); VH = Math.max(1, window.innerHeight); DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  LW = clamp(Math.round(LH * VW / VH), 144, 480); buf.width = LW; buf.height = LH;
  SC = VH / LH; B.imageSmoothingEnabled = false; X.imageSmoothingEnabled = false;
  if (G) G.x = Math.min(LW * 0.3, 110);
}
window.addEventListener("resize", resize);

/* ---------- game state ---------- */
let G = null;
const R = 5; // phage collision radius
function mut() { return G && G.mode === "daily" ? dailyMut() : null; }
const is = (id) => { const m = mut(); return !!m && m.id === id; };
const gravSign = () => (is("invert") ? -1 : 1);

function newGame() {
  G = {
    st: "title", t: 0, x: Math.min(LW * 0.3, 110), y: LH / 2, vy: 0, score: 0, obs: [], parts: [], texts: [], combo: 0,
    shake: 0, flash: 0, stretch: 0, trail: [], dist: 0, nextX: LW + 40, deadT: 0, taunt: "", newBest: false, mode: M.mode || "classic",
    bg: { cells: [], bubbles: [], gx: 0 }, bestAt: 0, infected: 0, lastGap: LH / 2, runBestCombo: 0, unlockQ: []
  };
  for (let i = 0; i < 14; i++) G.bg.cells.push({ x: rnd(0, 480), y: rnd(0, LH), r: rnd(3, 9), s: rnd(.15, .4), ph: rnd(0, 6.3) });
  for (let i = 0; i < 12; i++) G.bg.bubbles.push({ x: rnd(0, 480), y: rnd(0, LH), r: rnd(1, 2.5), s: rnd(8, 20) });
  return G;
}

function start() {
  const keepBg = G.bg;
  newGame(); G.bg = keepBg; G.st = "play"; G.y = LH / 2; G.vy = 0;
  M.attempts++; save();
  flap();
  $("ov").classList.remove("show");
}

/* ---------- difficulty curve ---------- */
function diff(s) {
  const m = mut();
  let speed = 85 + Math.min(s, 60) * 0.9, gap = Math.max(52, 80 - s * 0.55), spacing = Math.max(92, 118 - s * 0.45);
  if (m) {
    if (m.id === "tiny") { gap *= 0.78; speed *= 0.82; spacing *= 0.95; }
    if (m.id === "hyper") { speed *= 1.35; gap *= 1.22; }
    if (m.id === "swarm") { gap += 4; }
  }
  return { speed, gap, spacing };
}
function phys() {
  const m = mut(); let grav = 720, fl = 215;
  if (m && m.id === "heavy") { grav *= 1.3; fl *= 1.12; }
  if (m && m.id === "tiny") { grav *= 0.9; fl *= 0.95; }
  return { grav, fl };
}

/* ---------- obstacles ---------- */
function spawnOb() {
  const s = G.score, d = diff(s), m = mut();
  const w = 22, margin = 24;
  const gy = clamp(G.lastGap + rnd(-70, 70), margin + d.gap / 2, LH - margin - d.gap / 2);
  G.lastGap = gy;
  const ob = { x: G.nextX, w, gapY: gy, gap: d.gap, kind: s >= 5 && Math.random() < 0.3 ? "agar" : "tip", wig: s >= 8 && Math.random() < 0.35, ph: rnd(0, 6.3), move: 0, dir: 1, cloud: null, bact: null, passed: false, id: Math.random() };
  if (s >= 18 && Math.random() < 0.3) { ob.move = rnd(14, 26); ob.dir = Math.random() < .5 ? 1 : -1; ob.wig = false; }
  const wantBact = (m && m.id === "swarm") || (s >= 3 && Math.random() < 0.3);
  if (wantBact) ob.bact = { alive: true, ph: rnd(0, 6.3) };
  else if (s >= 12 && Math.random() < 0.25) ob.cloud = Math.random() < .5 ? "top" : "bot";
  G.obs.push(ob);
  G.nextX += d.spacing;
}
function gapCentre(ob) {
  let gy = ob.gapY;
  if (ob.wig) gy += Math.sin(G.t * 2.2 + ob.ph) * 9;
  return gy;
}
const CLOUD = 0.38; // fraction of the gap an antibiotic cloud blocks

/* ---------- actions ---------- */
function flap() {
  if (!G || G.st !== "play") return;
  G.vy = -phys().fl * gravSign(); G.stretch = 1; SFX.flap();
  for (let i = 0; i < 3; i++) G.parts.push({ x: G.x - 4, y: G.y + 4 * gravSign(), vx: rnd(-40, -10), vy: rnd(10, 40) * gravSign(), life: rnd(.2, .4), col: "#5ab4e0", sz: 1 });
}
function addText(s, x, y, col, big) { G.texts.push({ s, x, y, col: col || "#fff", life: 1, big: !!big, vy: -22 }); }
function burst(x, y, col, n, spd) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.283), v = rnd(20, spd || 90); G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.3, .8), col, sz: Math.random() < .3 ? 2 : 1, grav: 1 }); } }
function toast(s) { const t = $("toast"); t.textContent = s; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }

function die(why) {
  if (G.st !== "play") return;
  G.st = "dead"; G.deadT = 0; G.shake = 1; G.flash = 1; G.why = why;
  SFX.die(); burst(G.x, G.y, "#5ab4e0", 22, 140); burst(G.x, G.y, "#ffffff", 8, 60);
  M.totalScore += G.score; M.infections += G.infected; M.bestCombo = Math.max(M.bestCombo, G.runBestCombo);
  const d = today();
  if (G.mode === "daily") {
    const cur = (M.dailyBest[d] || 0);
    if (G.score > cur) { M.dailyBest[d] = G.score; G.newBest = cur > 0 || G.score >= 3; }
    Object.keys(M.dailyBest).forEach((k) => { if (k !== d) delete M.dailyBest[k]; });
  } else if (G.score > M.best) { G.newBest = M.best > 0 || G.score >= 3; M.best = G.score; }
  // skins unlocked by the classic best
  SKINS.forEach((sk) => { if (M.best >= sk.need && !M.skins.includes(sk.id)) { M.skins.push(sk.id); G.unlockQ.push(sk); } });
  G.taunt = pickTaunt(G.score, G.newBest);
  save();
  if (G.newBest) setTimeout(SFX.best, 350);
  G.unlockQ.forEach((sk, i) => setTimeout(() => { toast("UNLOCKED: " + sk.n.toUpperCase() + " · " + sk.note); SFX.unlock(); refreshButtons(); }, 900 + i * 2800));
  G.unlockQ = [];
}
function pickTaunt(score, best) {
  const pool = best ? TAUNTS.best : score < 3 ? TAUNTS.t0 : score < 10 ? TAUNTS.t1 : score < 25 ? TAUNTS.t2 : TAUNTS.t3;
  const all = [].concat(TAUNTS.t0, TAUNTS.t1, TAUNTS.t2, TAUNTS.t3, TAUNTS.best);
  let s, tries = 0;
  do { s = pick(pool); tries++; } while (all.indexOf(s) === M.lastTaunt && tries < 10);
  M.lastTaunt = all.indexOf(s);
  return s;
}

/* ---------- update (fixed timestep) ---------- */
const DT = 1 / 120;
function step(dt) {
  G.t += dt;
  const d = diff(G.score), p = phys(), gs = gravSign();
  // background
  G.bg.gx = (G.bg.gx + d.speed * 0.2 * dt) % 16;
  G.bg.cells.forEach((c) => { c.x -= d.speed * c.s * dt; if (c.x < -12) { c.x = LW + 12; c.y = rnd(0, LH); } });
  G.bg.bubbles.forEach((b) => { b.y -= b.s * dt; b.x -= d.speed * 0.5 * dt; if (b.y < -3 || b.x < -3) { b.y = LH + 3; b.x = rnd(0, LW); } });

  acc += dt;
  while (acc >= DT) { step(DT); acc -= DT; }

}

function onTap() {

  if (G.st === "pause") { G.st = "play"; return; }

  try { await navigator.clipboard.writeText(s); toast("COPIED. Go bother a labmate."); }
  catch (err) { toast("Clipboard blocked. Screenshot it like it's 2009."); }
});
