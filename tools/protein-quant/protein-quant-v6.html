function heroCard(){const a=S.mode==='a280';return `<section class="hero-card card"><div class="hero-txt"><h2>${a?'How much protein is in your tube?':'Read your samples against a standard curve'}</h2>
  <p>${a?'Give each protein its ε (or paste its sequence) and type your A280 readings. Add the volumes to see how much your culture made, and watch it grow in the dish.':'Type the standards (usually BSA), then one card per sample. The curve and every concentration update as you type.'}</p>
  <div class="hero-btns"><button class="btn" data-act="example">Load a worked example</button><button class="btn" data-act="importBox">Paste from Excel…</button></div></div>${HERO}</section>`}
function renderMain(){const m=$('#main'),a=S.mode==='a280',list=listOf();
  let h='';if(!list.some(p=>p.name||repsOf(p).length)) h+=heroCard();
  if(!a) h+=stdBlock();
  h+=`<div class="sec-h big"><span class="n">${a?'01':'02'}</span>${a?'Proteins':'Your samples'}<span class="sub">${list.length} ${a?'protein':'sample'}${list.length===1?'':'s'} · one card each</span></div><div id="cards">${list.map((p,i)=>card(p,i)).join('')}</div>
    <button class="addcard" data-act="add"><span>+</span> Add ${a?'another protein':'another sample'}</button>
    <p class="hint tips"><b>Quick keys:</b> <kbd>Enter</kbd> in a reading adds the next one · paste a column of readings from Excel into any reading box · paste a whole table (or FASTA) into a name box to make one card per row · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes anything</p>${HELP}`;
  m.innerHTML=h}
function field(p,k,label,inner,opt2={}){return `<label class="fld${opt2.cls?' '+opt2.cls:''}"><span class="fl">${label}${opt2.all?`<button class="all" data-all="${k}" title="Use this for every ${S.mode==='a280'?'protein':'sample'}" tabindex="-1">→ all</button>`:''}</span>${inner}</label>`}
const inp=(p,k,ph,cls='')=>`<input class="in ${cls}" data-f="${k}" value="${escH(p[k])}" placeholder="${escH(ph||'')}" autocomplete="off" spellcheck="false" inputmode="${['name','seq'].includes(k)?'text':'decimal'}">`;
const sel=(p,k,list,blank)=>`<select class="in" data-f="${k}">${blank?`<option value="">${escH(blank)}</option>`:''}${opt(list,p[k])}</select>`;
function readsInner(p,lab){return p.r.map((v,i)=>`<div class="rd"><span class="ri">${i+1}</span><input class="in" data-r="${i}" value="${escH(v)}" placeholder="${lab}" inputmode="decimal" autocomplete="off" aria-label="Reading ${i+1}"><button class="rx" data-rdel="${i}" tabindex="-1" title="Remove this reading" aria-label="Remove reading ${i+1}">×</button></div>`).join('')}
function readingsHTML(p,lab){return `<div class="reads" data-reads>${readsInner(p,lab)}</div><button class="lnk addrd" data-act="addRead" tabindex="-1">+ Add a reading</button>`}
function card(p,i){const a=S.mode==='a280',set=a?S.a:S.c,col=COLORS[i%COLORS.length],noun=a?'Protein':'Sample';
  const head=`<div class="ch"><span class="swatch" style="background:${col}"></span><input class="in name" data-f="name" value="${escH(p.name)}" placeholder="${noun} ${i+1}: type a name" autocomplete="off" spellcheck="false" aria-label="${noun} name">
    <span class="sum" data-sum></span><span class="ch-b"><button class="ib" data-act="dup" title="Duplicate this card (same settings, empty readings)" aria-label="Duplicate">⧉</button><button class="ib" data-act="fold" title="${p.open?'Fold':'Unfold'}" aria-label="Fold or unfold">${p.open?'▾':'▸'}</button><button class="ib del" data-act="del" title="Remove this ${noun.toLowerCase()} (Undo brings it back)" aria-label="Remove">🗑</button></span></div>`;
  if(!p.open) return `<article class="pcard folded" data-id="${p.id}" style="--pc:${col}">${head}</article>`;
  const prot=a?`<div class="grp"><div class="gt"><span>1</span>The protein</div>
      ${field(p,'mw','MW (Da)',inp(p,'mw','e.g. 27900'))}
      ${field(p,'eps','ε at 280 nm',`<div class="two e">${inp(p,'eps','e.g. 0.79')}${sel(p,'epsType',EPSO).replace('<select','<select title="A0.1% = absorbance of a 1 mg/mL solution (Benchling, ProtParam “Abs 0.1%”) · Molar ε in M⁻¹cm⁻¹ (needs the MW) · E1% = absorbance of a 1% (10 mg/mL) solution, ten times A0.1%"')}</div>`)}
      <div class="seqrow">${p.seqOpen||p.seq?`<span class="fl">Sequence <small>MW and ε fill in by themselves</small></span><textarea class="in seq" data-f="seq" rows="3" placeholder="Paste the protein sequence, or FASTA (several sequences make several cards)" spellcheck="false">${escH(p.seq)}</textarea>`:`<button class="lnk" data-act="seqOpen">+ Or paste the sequence: MW and ε fill in by themselves</button>`}<div class="seqinfo" data-seq></div></div></div>`
    :`<div class="grp"><div class="gt"><span>1</span>About it <small>optional</small></div>${field(p,'mw','MW (Da)',inp(p,'mw','only for µM and nM'))}<p class="hint">Everything else comes from the standard curve above.</p></div>`;
  const reads=`<div class="grp"><div class="gt"><span>2</span>${a?'A280 readings':'Absorbance readings'}<small data-n></small></div>${readingsHTML(p,a?'A280':'Abs')}
      ${field(p,'dil','Dilution (×)',inp(p,'dil','none'),{all:true,cls:'mt'})}</div>`;
  const vols=`<div class="grp"><div class="gt"><span>3</span>For the yield <small>optional</small></div>
      ${field(p,'vol','Final volume',`<div class="two u">${inp(p,'vol','the tube you read')}${sel(p,'volU',VOLO)}</div>`,{all:true})}
      ${field(p,'cult','Culture volume',`<div class="two u">${inp(p,'cult','what you grew')}${sel(p,'cultU',VOLO)}</div>`,{all:true})}
      ${field(p,'host','Expression host',sel(p,'host',HOSTO(),HOSTS[set.host].label+' (default)'),{all:true})}
      ${field(p,'start','Start amount (mg)',inp(p,'start','optional, for % recovery'))}</div>`;
  return `<article class="pcard" data-id="${p.id}" style="--pc:${col}">${head}<div class="cb"><div class="grps">${prot}${reads}${vols}</div>
    <div class="res"><div class="res-n" data-res></div><div class="dish"><div class="culture" data-dish="${p.id}" role="img" aria-label="Protein grinder: decorative"></div><div class="dish-t">protein grinder</div></div></div></div></article>`}
/* standards: rows of concentration + readings, plus the curve */
function stdBlock(){const c=S.c,u=c.unit==='ugml'?'µg/mL':'mg/mL';
  return `<div class="sec-h big"><span class="n">01</span>Standards<span class="sub">usually a BSA dilution series</span></div>
  <div class="stdwrap"><section class="card stdcard"><div class="stds"><div class="std-h"><span>#</span><span>Conc. (${u})</span><span>Readings</span><span>Mean</span><span>Back-calc.</span><span></span></div>
    <div id="stdRows">${c.stds.map((s,i)=>stdRow(s,i)).join('')}</div>
    <div class="std-f"><button class="btn small" data-act="addStd">+ Add a standard</button><button class="btn small" data-act="bsa" title="Fills the concentrations of the usual BSA kit series">Use the BSA kit series</button></div>
    <p class="hint"><kbd>Enter</kbd> goes down to the next standard · paste a block from Excel (concentrations and readings) into any box</p></div>
    <div class="curve" id="curveBox"></div></section></div>`}
function stdRow(s,i){return `<div class="std" data-sid="${s.id}"><span class="ri">${i+1}</span><input class="in" data-sf="conc" value="${escH(s.conc)}" placeholder="${i===0?'0':''}" inputmode="decimal" autocomplete="off" aria-label="Concentration of standard ${i+1}">
  <div class="sreads">${s.r.map((v,j)=>`<input class="in" data-sr="${j}" value="${escH(v)}" placeholder="Abs" inputmode="decimal" autocomplete="off" aria-label="Standard ${i+1} reading ${j+1}">`).join('')}<button class="ib sm" data-act="stdAddRead" tabindex="-1" title="Add a reading to this standard" aria-label="Add a reading">+</button></div>
  <span class="sm-v" data-sm></span><span class="sm-v" data-sb></span><button class="ib sm del" data-act="stdDel" tabindex="-1" title="Remove this standard" aria-label="Remove standard ${i+1}">×</button></div>`}

/* ---------------- live results: only the result parts redraw, so typing never loses its place ---------------- */
const flagList=f=>{f=(f||[]).filter(x=>x.t!=='info');return f.length?`<ul class="flags">${f.map(x=>`<li class="${x.t}">${escH(x.m)}</li>`).join('')}</ul>`:''};
function resHTML(p,R){const a=S.mode==='a280',uk=a?S.a.unit:S.c.out,u=UNIT_LABEL[uk];
  if(!R.ok){const why=(R.flags||[]).find(f=>f.t==='info');return `<div class="r-wait">${R.empty?(a?'Type the ε and the A280 readings, and the concentration appears here.':'Type the readings, and the concentration appears here.'):escH(why?why.m:'Check the numbers on the left.')}</div>${flagList(R.flags)}`}
  const alt=[];if(R.mgml!=null&&uk!=='mgml') alt.push(fmtN(R.mgml,4)+' mg/mL');if(R.molar!=null&&uk!=='uM') alt.push(fmtN(R.molar*1e6,4)+' µM');
  let h=`<div class="r-big"><b>${R.conc!=null?fmtN(R.conc,4):'—'}</b> <span>${escH(u)}</span></div>${alt.length?`<div class="r-alt">${alt.join(' · ')}</div>`:''}
    <div class="r-line">mean ${fmtN(a?R.mean:R.corr,3)}${R.sd!=null?` ± ${fmtN(R.sd,2)}`:''} <small>(n = ${R.vals.length}${R.cv!=null?`, CV ${fmtN(R.cv,2)}%`:''})</small>${numv(p.dil)>1?` · × ${escH(p.dil)}`:''}${!a?`<br><small>${fmtN(R.inAssay,4)} ${S.c.unit==='ugml'?'µg/mL':'mg/mL'} in the assay</small>`:''}</div>`;
  if(R.totalMg!=null) h+=`<div class="r-y"><div><small>Total</small><b>${fmtN(R.totalMg,3)} mg</b></div>${R.yieldMgL!=null?`<div><small>Yield</small><b>${fmtN(R.yieldMgL,3)} mg/L</b></div>`:''}${R.recovery!=null?`<div><small>Recovery</small><b>${fmtN(R.recovery,3)}%</b></div>`:''}</div>`;
  else h+=`<div class="r-hint">Add the final volume and culture volume to see the yield.</div>`;
  if(R.verdict) h+=`<div class="r-v"><span class="pill t-${R.verdict.tier}">${escH(R.verdict.label)}</span> <span>${escH(R.verdict.note)}</span></div>`;
  return h+flagList(R.flags)}
function sumHTML(R){if(!R.ok) return '';const u=UNIT_LABEL[S.mode==='a280'?S.a.unit:S.c.out];return `<b>${fmtN(R.conc,4)}</b> ${escH(u)}${R.yieldMgL!=null?` · ${fmtN(R.yieldMgL,3)} mg/L`:''}`}
function refreshCard(p){const el=document.querySelector(`.pcard[data-id="${p.id}"]`);if(!el) return;const R=calcOf(p),a=S.mode==='a280';

/* a table from Excel: column titles are matched (Name, MW, ε, A280, Dilution, Volume…); without titles the first column is the name and numbers are readings */

function importRows(txt,at){const m=mapImport(txt);if(!m||!m.rows.length){toast('Nothing to add');return}snap();EDIT=null;const L=listOf();let i=at?L.indexOf(at):L.length-1;

  switch(a.dataset.act){
    case 'menu':menu.hidden=!menu.hidden;$('#moreBtn').setAttribute('aria-expanded',String(!menu.hidden));break;
    case 'mode':if(S.mode!==a.dataset.arg){S.mode=a.dataset.arg;save();renderAll()}break;
    case 'undo':undo();break;case 'redo':redo();break;
    case 'add':{snap();const L=listOf(),last=L[L.length-1],base=last?{volU:last.volU,cultU:last.cultU,host:last.host,r:Array(Math.max(3,last.r.length)).fill('')}:{},q=S.mode==='a280'?newA(Object.assign(base,last?{epsType:last.epsType}:{})):newSmp(base);
      L.push(q);save();renderAll();const c=document.querySelector(`.pcard[data-id="${q.id}"]`);c.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});focusAt($('.name',c));break}
    case 'dup':{if(!p) break;snap();const L=listOf(),q=JSON.parse(JSON.stringify(p));q.id=uid();q.name=p.name?p.name+' (copy)':'';q.r=Array(p.r.length).fill('');L.splice(L.indexOf(p)+1,0,q);save();renderAll();focusAt($(`.pcard[data-id="${q.id}"] [data-r="0"]`));toast('Copied the settings into a new card; type its readings',{undo:true});break}
    case 'fold':if(!p) break;p.open=!p.open;save();renderAll();break;
    case 'del':{if(!p) break;snap();const L=listOf();L.splice(L.indexOf(p),1);if(!L.length) L.push(S.mode==='a280'?newA():newSmp());save();renderAll();toast(`Removed “${escH(p.name||'card')}”`,{undo:true});break}
    case 'addRead':{if(!p) break;snap();p.r.push('');save();redrawReads(p,p.r.length-1);break}
    case 'seqOpen':{if(!p) break;p.seqOpen=true;save();renderAll();focusAt($(`.pcard[data-id="${p.id}"] [data-f="seq"]`));break}
    case 'addStd':{snap();const last=S.c.stds[S.c.stds.length-1],s=newStd({r:Array(last?last.r.length:2).fill('')});S.c.stds.push(s);save();redrawStds(`.std[data-sid="${s.id}"] [data-sf="conc"]`);break}
    case 'stdAddRead':{const s=findStd(a);if(!s) break;snap();s.r.push('');save();redrawStds(`.std[data-sid="${s.id}"] [data-sr="${s.r.length-1}"]`);break}
    case 'stdDel':{const s=findStd(a);if(!s) break;snap();S.c.stds.splice(S.c.stds.indexOf(s),1);save();redrawStds();toast('Standard removed',{undo:true});break}
    case 'bsa':{snap();const V=['0','25','125','250','500','750','1000','1500','2000'].map(v=>S.c.unit==='mgml'?String(+v/1000):v),n=S.c.stds[0]?S.c.stds[0].r.length:2;
      V.forEach((v,i)=>{if(!S.c.stds[i]) S.c.stds.push(newStd({r:Array(n).fill('')}));S.c.stds[i].conc=v});save();redrawStds(`.std[data-sid="${S.c.stds[0].id}"] [data-sr="0"]`);toast('Filled the usual kit series: 0, 25, 125, 250, 500, 750, 1000, 1500 and 2000 µg/mL. Now type the readings.',{undo:true});break}
    case 'save':{flush();download(`protein-quant-${today()}.json`,JSON.stringify(S,null,1),'application/json');toast('Saved to your downloads. Open it again from More → Open a saved file.');break}
    case 'open':openFile();break;
    case 'xlsx':exportXLSX();break;
    case 'toLE':LPInbox.sendDialog(lpItem);break;
    case 'csv':{const t=tableText().split('\n').map(l=>l.split('\t').map(v=>/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v).join(',')).join('\n');download(`protein-quant-${S.mode}-${today()}.csv`,t,'text/csv');break}
    case 'copyTable':copyText(tableText()).then(ok=>toast(ok?'Copied as a table with titles. Paste it into Excel.':'Copy did not work in this browser'));break;
    case 'importBox':importDialog();break;
    case 'example':loadExample();break;
    case 'clear':modal({title:'Start over?',danger:true,ok:'Start over',body:`<p>This empties both pages: ${S.a.rows.length} protein${S.a.rows.length===1?'':'s'}, ${S.c.stds.length} standard${S.c.stds.length===1?'':'s'} and ${S.c.rows.length} sample${S.c.rows.length===1?'':'s'}. Your settings stay. You can undo it straight after.</p>`,
      onOk(){snap();S.a.rows=[newA()];S.c.stds=[];S.c.rows=[newSmp()];save();renderAll();toast('Both pages are empty',{undo:true})}});break;
  }});
document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey,inText=e.target.closest&&e.target.closest('input,textarea');
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();$('[data-act="save"]').click();return}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();if(inText) e.target.blur();undo();return}
  if(mod&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo()}});
/* resizable panel, remembered */
(function(){const sp=$('#split'),app=$('#app');let w=0;try{w=+localStorage.getItem(KEY+'-pw')||0}catch(e){}if(w) app.style.setProperty('--pw',w+'px');
  sp.addEventListener('mousedown',e=>{e.preventDefault();sp.classList.add('drag');const mv=ev=>{const x=Math.max(280,Math.min(window.innerWidth-560,window.innerWidth-ev.clientX));app.style.setProperty('--pw',x+'px');w=x},
    up=()=>{sp.classList.remove('drag');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);try{localStorage.setItem(KEY+'-pw',w)}catch(e){}};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
  sp.addEventListener('dblclick',()=>{app.style.removeProperty('--pw');try{localStorage.removeItem(KEY+'-pw')}catch(e){}})})();
renderAll();undoUI();
/* ---------------- table view: the same proteins (or samples) as rows of a spreadsheet ----------------
   Every box of a card is a cell here. Enter moves down, Tab right, arrows move between cells, and a block copied from
   Excel pastes across and down (new rows are made as needed). The grey columns are worked out, as in the cards. */
const SHEET_COLS=a=>[['name','Name','t',104],...(a?[['mw','MW (Da)','n',54],['eps','ε · type','p',82,'epsType',[['mass01','A0.1%'],['molar','molar'],['e1pct','E1%']]]]:[['mw','MW (Da)','n',58]]),['R','Readings','r'],['dil','Dil.','n',42],['vol','Final vol','p',78,'volU',VOLO],['cult','Culture','p',78,'cultU',VOLO],['host','Host','s',54,HOSTO().map(([k,l])=>[k,HOSTS[k].short||l])]];
function sheetHTML(){const a=S.mode==='a280',list=listOf(),cols=SHEET_COLS(a),nR=Math.max(3,...list.map(p=>(p.r||[]).length)),u=UNIT_LABEL[a?S.a.unit:S.c.out];
  const sel=(p,k,opts,ri,dflt)=>`<select class="sc u" data-sc="${ri}:${k}">${dflt?`<option value="">default</option>`:''}${opts.map(([v,l])=>`<option value="${v}"${(p[k]||'')===v?' selected':''}>${escH(l)}</option>`).join('')}</select>`;
  const colg=`<colgroup><col style="width:26px"><col style="width:104px">${cols.slice(1).map(c=>c[0]==='R'?Array.from({length:nR},()=>'<col style="width:44px">').join('')+'<col style="width:24px">':`<col style="width:${c[3]}px">`).join('')}<col style="width:56px"><col style="width:64px"><col style="width:20px"></colgroup>`;
  const head=cols.map(c=>c[0]==='R'?Array.from({length:nR},(_,k)=>`<th class="num">${a?'A':'Abs '}${k+1}</th>`).join('')+`<th class="addc"><button class="sv-addr" data-sv="addR" title="Add a reading column">+</button></th>`:`<th${c[2]==='n'?' class="num"':''}>${c[1]}</th>`).join('');
  const cell=(p,c,ri)=>{if(c[0]==='R') return Array.from({length:nR},(_,k)=>`<td><input class="sc num" data-sc="${ri}:r${k}" value="${escH((p.r||[])[k]||'')}" inputmode="decimal"></td>`).join('')+'<td></td>';
    if(c[2]==='s') return `<td>${sel(p,c[0],c[4],ri,true)}</td>`;
    if(c[2]==='p') return `<td><div class="pair"><input class="sc num" data-sc="${ri}:${c[0]}" value="${escH(p[c[0]]||'')}" inputmode="decimal">${sel(p,c[4],c[5],ri,false)}</div></td>`;
    return `<td><input class="sc${c[2]==='n'?' num':''}" data-sc="${ri}:${c[0]}" value="${escH(p[c[0]]||'')}"${c[2]==='n'?' inputmode="decimal"':''}${c[0]==='name'?` placeholder="${a?'Protein':'Sample'} ${ri+1}"`:''}></td>`};
  return `<div class="sheet-wrap"><table class="sheet">${colg}<thead><tr><th class="rn"></th>${head}<th class="out">${escH(u)}</th><th class="out">mg/L</th><th></th></tr></thead><tbody>${list.map((p,ri)=>`<tr data-id="${p.id}"><td class="rn"><i style="background:${colorOf(p)}"></i>${ri+1}</td>${cols.map(c=>cell(p,c,ri)).join('')}${sheetOut(p)}<td><button class="sv-del" data-sv="del" data-i="${ri}" title="Remove this row">×</button></td></tr>`).join('')}</tbody></table></div>`}
function sheetOut(p){const R=calcOf(p),f=v=>v==null?'—':fmtN(v,4),bad=(R.flags||[]).find(x=>x.t==='err'),tier=R.verdict&&R.verdict.tier,dot=tier?`<i class="vd v-${tier}" title="${escH(R.verdict.label)}"></i>`:'';
  const tip=escH([(R.totalMg!=null?'Total '+(R.totalMg<1?fmtN(R.totalMg*1000,3)+' µg':fmtN(R.totalMg,3)+' mg'):''),R.verdict?R.verdict.label:'',...(R.flags||[]).map(x=>x.m)].filter(Boolean).join(' · '));
  return `<td class="out${bad?' bad':''}" data-o="conc" title="${tip}">${bad?'⚠':R.ok&&R.conc!=null?f(R.conc):'—'}</td><td class="out" data-o="yl" title="${tip}">${R.yieldMgL!=null?dot+f(R.yieldMgL):'—'}</td>`}
function sheetRefreshRow(p){const tr=document.querySelector(`.sheet tr[data-id="${p.id}"]`);if(!tr) return;const t=document.createElement('tbody');t.innerHTML=`<tr>${sheetOut(p)}</tr>`;
  [...t.firstChild.children].forEach(td=>{const o=tr.querySelector(`[data-o="${td.dataset.o}"]`);if(o) o.outerHTML=td.outerHTML})}
function sheetSet(el){const [ri,k]=el.dataset.sc.split(':'),p=listOf()[+ri];if(!p) return null;if(k[0]==='r'&&/^r\d+$/.test(k)){const i=+k.slice(1);p.r=p.r||[];while(p.r.length<=i) p.r.push('');p.r[i]=el.value}else p[k]=el.value;return p}
document.addEventListener('input',e=>{const el=e.target.closest&&e.target.closest('.sheet .sc');if(!el) return;e.stopImmediatePropagation();begin(el);const p=sheetSet(el);if(!p) return;save();sheetRefreshRow(p);renderPanel()},true);
document.addEventListener('change',e=>{const el=e.target.closest&&e.target.closest('.sheet select.sc');if(!el) return;e.stopImmediatePropagation();snap();const p=sheetSet(el);if(p){save();sheetRefreshRow(p);renderPanel()}},true);
function sheetCell(ri,ci){const tr=document.querySelectorAll('.sheet tbody tr')[ri];if(!tr) return null;return tr.querySelectorAll('.sc')[ci]||null}
function sheetPos(el){const tr=el.closest('tr'),rows=[...document.querySelectorAll('.sheet tbody tr')];return [rows.indexOf(tr),[...tr.querySelectorAll('.sc')].indexOf(el)]}
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('.sheet .sc');if(!el) return;const [ri,ci]=sheetPos(el);let t=null;
  if(e.key==='Enter'||(e.key==='ArrowDown'&&el.tagName!=='SELECT')){e.preventDefault();t=sheetCell(ri+1,ci);if(!t&&e.key==='Enter'){snap();listOf().push((S.mode==='a280'?newA:newSmp)());save();renderMain();renderPanel();t=sheetCell(ri+1,ci)}}
  else if(e.key==='ArrowUp'&&el.tagName!=='SELECT'){e.preventDefault();t=sheetCell(ri-1,ci)}
  else if(e.key==='ArrowRight'&&el.tagName==='INPUT'&&el.selectionStart===el.value.length){t=sheetCell(ri,ci+1)}
  else if(e.key==='ArrowLeft'&&el.tagName==='INPUT'&&el.selectionStart===0){t=sheetCell(ri,ci-1)}
  if(t){if(e.key.startsWith('Arrow')) e.preventDefault();t.focus();if(t.select) t.select()}},true);
document.addEventListener('paste',e=>{const el=e.target.closest&&e.target.closest('.sheet .sc');if(!el) return;const txt=(e.clipboardData||window.clipboardData).getData('text');
  const rows=txt.replace(/\r/g,'').split('\n').filter((l,i,a)=>l!==''||i<a.length-1).map(l=>l.split('\t'));if(rows.length<2&&rows[0].length<2) return;e.preventDefault();e.stopImmediatePropagation();snap();
  const [ri,ci]=sheetPos(el),list=listOf();
  rows.forEach((cells,dr)=>{while(list.length<=ri+dr) list.push((S.mode==='a280'?newA:newSmp)());});
  save();renderMain();
  rows.forEach((cells,dr)=>cells.forEach((v,dc)=>{const t=sheetCell(ri+dr,ci+dc);if(!t) return;if(t.tagName==='SELECT'){const o=[...t.options].find(o=>o.value===v.trim()||o.text===v.trim());if(o) t.value=o.value}else t.value=v.trim();sheetSet(t)}));
  save();renderMain();renderPanel();toast(`Pasted ${rows.length} row${rows.length===1?'':'s'} × ${Math.max(...rows.map(r=>r.length))} column${rows[0].length===1?'':'s'}`)},true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-sv]');if(!b) return;const v=b.dataset.sv;
  if(v==='cards'||v==='table'){S.view=v;save();renderMain();return}
  if(v==='addR'){snap();listOf().forEach(p=>{p.r=p.r||[];const n=Math.max(3,...listOf().map(q=>(q.r||[]).length));while(p.r.length<n+1) p.r.push('')});save();renderMain();return}
  if(v==='del'){const list=listOf();if(list.length<2){toast('One row stays; clear its boxes instead');return}snap();list.splice(+b.dataset.i,1);save();renderMain();renderPanel();toast('Row removed',{undo:true})}});
const _renderMain=renderMain;renderMain=function(){_renderMain.apply(this,arguments);const tbl=S.view==='table',h=document.querySelector('#main .sec-h.big:last-of-type')||[...document.querySelectorAll('#main .sec-h.big')].pop();
  if(h&&!h.querySelector('.viewseg')) h.insertAdjacentHTML('beforeend',`<span class="viewseg" role="group" aria-label="View"><button data-sv="cards" class="${tbl?'':'on'}">Cards</button><button data-sv="table" class="${tbl?'on':''}">Table</button></span>`);
  if(tbl){const c=$('#cards');if(c){c.innerHTML=sheetHTML();c.classList.add('as-sheet')}const s=h&&h.querySelector('.sub');if(s) s.textContent=listOf().length+' rows · Enter for the next row, paste a block from Excel';}
  if(typeof Culture!=='undefined') Culture.sync()};

if(/[?&]debug\b/.test(location.search)) window.PQ={lpItem,LPInbox,get S(){return S},calcA,calcC,calcFit,loadExample,exportXLSX,tableText,Culture,mapImport,makeXLSX};
