<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culture Clash v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--p0:#0b0d12;--p1:#11141c;--p2:#182030;--line:#2a3142;--text:#e8eef5;--muted:#8a97a8;--faint:#4a5568;--acc:#5ab4e0;--gold:#ffd166;--red:#ff6b6b;--green:#7cf29a;--pur:#b59cff;--pink:#ff8ad0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#030405;color:var(--text);font:15px/1.3 "Pixelify Sans",monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.pf{font-family:"Silkscreen",monospace}
h1{font:44px/1 "Silkscreen",monospace;margin:0;color:#e8eef5;text-shadow:4px 4px 0 #1f6f8f}
h2{font:22px/1.1 "Silkscreen",monospace;margin:0 0 6px}
h3{font:12px "Silkscreen",monospace;color:var(--muted);margin:16px 0 8px;border-bottom:2px solid var(--line);padding-bottom:4px}
.lbl{font:11px "Silkscreen",monospace;color:var(--muted);letter-spacing:.04em}
.muted{color:var(--muted)}.gold{color:var(--gold)}.acc{color:var(--acc)}.red{color:var(--red)}.green{color:var(--green)}
.btn{font:13px "Silkscreen",monospace;color:var(--text);background:#1a1f2b;border:0;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #05060a;padding:10px 18px;cursor:pointer}
.btn:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--acc),0 4px 0 #05060a;color:#fff}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--acc),0 2px 0 #05060a}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:#1f6f8f;box-shadow:inset 0 0 0 2px #5ab4e0,0 4px 0 #05060a}
.btn.off{color:var(--faint)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scr{position:absolute;inset:0;padding:30px 40px;overflow-y:auto}
.center{text-align:center}
.panel{background:var(--p1);box-shadow:inset 0 0 0 2px var(--line);padding:14px}
.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
/* ---------- cards ---------- */
.card{position:relative;width:124px;height:176px;background:#161b26;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #05060a;color:var(--text);font-size:11px;line-height:1.15;padding:6px 6px 4px;cursor:pointer;flex:none}
.card.spell{background:#1a1828}
.card .cost{position:absolute;left:-6px;top:-6px;width:26px;height:26px;background:#1f6f8f;box-shadow:inset 0 0 0 2px #5ab4e0;display:grid;place-items:center;font:13px "Silkscreen",monospace;color:#fff;z-index:2}
.card .art{height:46px;display:grid;place-items:center;background:#0b0d12;margin:8px 0 4px}
.card .art svg{width:60px;height:44px}
.card .nm{font:9px "Silkscreen",monospace;line-height:1.1;height:22px;overflow:hidden;color:#fff}
.card .tx{font-size:11px;color:#c9d2dc;height:64px;overflow:hidden}
.card .tx b{color:var(--gold)}
.card .tr{position:absolute;left:6px;bottom:4px;font-size:9px;color:var(--muted)}
.card .at,.card .hp{position:absolute;bottom:-6px;width:26px;height:24px;display:grid;place-items:center;font:13px "Silkscreen",monospace;color:#fff}
.card .at{left:-6px;background:#8f3a1f;box-shadow:inset 0 0 0 2px #ffb070}
.card .hp{right:-6px;background:#8f1f2e;box-shadow:inset 0 0 0 2px #ff7a8a}
.card.can{box-shadow:inset 0 0 0 2px var(--green),0 0 14px rgba(124,242,154,.5),0 4px 0 #05060a}
.card.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 16px rgba(255,209,102,.6),0 4px 0 #05060a;transform:translateY(-12px)}
.card.rar2 .nm{color:#8fe3ff}.card.rar3 .nm{color:var(--pur)}
.card.pick{width:170px;height:240px;font-size:13px}.card.pick .art{height:70px}.card.pick .art svg{width:90px;height:64px}.card.pick .nm{font-size:11px;height:28px}.card.pick .tx{font-size:13px;height:92px}.card.pick .cost,.card.pick .at,.card.pick .hp{width:30px;height:28px;font-size:14px}
.card.pick:hover{box-shadow:inset 0 0 0 2px var(--acc),0 0 16px rgba(90,180,224,.5),0 4px 0 #05060a}
.card.dim{opacity:.35}
/* ---------- minions ---------- */
.min{position:relative;width:98px;height:132px;background:#141924;box-shadow:inset 0 0 0 2px var(--line);font-size:10px;padding:5px;cursor:pointer;flex:none;transition:transform .12s}
.min .art{height:50px;display:grid;place-items:center;background:#0b0d12}
.min .art svg{width:64px;height:46px}
.min .nm{font:8px "Silkscreen",monospace;line-height:1.1;height:20px;margin-top:3px;color:#fff;overflow:hidden}
.min .kws{display:flex;gap:2px;flex-wrap:wrap;height:26px;overflow:hidden}
.min .kws i{font:8px "Silkscreen",monospace;font-style:normal;background:#2a3142;color:#dfe7f0;padding:1px 3px}
.min .at,.min .hp{position:absolute;bottom:-6px;width:24px;height:22px;display:grid;place-items:center;font:12px "Silkscreen",monospace;color:#fff}
.min .at{left:-6px;background:#8f3a1f;box-shadow:inset 0 0 0 2px #ffb070}
.min .hp{right:-6px;background:#8f1f2e;box-shadow:inset 0 0 0 2px #ff7a8a}
.min .hp.hurt{color:#ffb3b3}.min .at.buff{color:#9cffb0}
.min.can{box-shadow:inset 0 0 0 2px var(--green),0 0 12px rgba(124,242,154,.5)}
.min.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 16px rgba(255,209,102,.7);transform:translateY(-6px)}
.min.biofilm{box-shadow:inset 0 0 0 3px #7f8a6a}
.min.biofilm.can{box-shadow:inset 0 0 0 3px #7f8a6a,0 0 12px rgba(124,242,154,.5)}
.min.frozen{filter:saturate(.3) brightness(1.3);outline:2px solid #9ad0ff}
.min.sick:not(.can){opacity:.78}
.min.ops::after{content:"Y";position:absolute;right:3px;top:2px;font:10px "Silkscreen",monospace;color:var(--gold)}
.min.stealth{opacity:.6;outline:2px dashed #6c7a90}
.min.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.min.shake,.hero.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.tgt{outline:3px solid var(--red)!important;cursor:crosshair}
.tgt::before{content:"";position:absolute;inset:0;background:rgba(255,107,107,.18);pointer-events:none}
/* ---------- board ---------- */
.hero{position:absolute;width:250px;background:var(--p1);box-shadow:inset 0 0 0 2px var(--line);padding:10px 12px;cursor:pointer}
.hero .nm{font:12px "Silkscreen",monospace;color:#fff}
.hero .hpbig{font:30px "Silkscreen",monospace;color:#ff7a8a}
.hero .sub{font-size:12px;color:var(--muted)}
.hero.active{box-shadow:inset 0 0 0 2px var(--acc)}
#ehero{left:20px;top:14px}#phero{left:20px;top:520px;height:182px}
.brow{position:absolute;left:290px;width:700px;height:150px;display:flex;gap:10px;justify-content:center;align-items:center}
#eboard{top:120px}#pboard{top:300px}
.divider{position:absolute;left:290px;top:283px;width:700px;height:2px;background:var(--line)}
#hand{position:absolute;left:290px;top:525px;width:700px;height:190px;display:flex;align-items:flex-start;justify-content:center}
#hand .card{margin-right:var(--ov,0px)}
#side{position:absolute;left:1010px;top:14px;width:250px;bottom:14px}
.mana{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}
.mana i{width:16px;height:16px;background:#1f6f8f;box-shadow:inset 0 0 0 2px #5ab4e0;display:block}
.mana i.used{background:#141924;box-shadow:inset 0 0 0 2px #2a3142}
#endturn{width:100%;font-size:15px;padding:16px 10px}
#endturn.wait{background:#141924;color:var(--faint)}
.power{background:#1a1f2b;box-shadow:inset 0 0 0 2px var(--gold);padding:8px 10px;margin-top:10px;cursor:pointer;font-size:12px}
.power.used,.power.no{opacity:.4;cursor:not-allowed}
.power.sel{box-shadow:inset 0 0 0 2px #fff,0 0 12px var(--gold)}
.power b{font:11px "Silkscreen",monospace;color:var(--gold)}
#log{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:var(--muted);line-height:1.25;max-height:150px;overflow:hidden}
#log div:last-child{color:#dfe7f0}
.passive{font-size:12px;color:#ffd166;margin-top:4px}
.turnbanner{position:absolute;left:290px;top:250px;width:700px;text-align:center;font:26px "Silkscreen",monospace;color:#fff;text-shadow:3px 3px 0 #1f6f8f;pointer-events:none;animation:fadeb 1.4s forwards}
@keyframes fadeb{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.fx{position:absolute;font:22px "Silkscreen",monospace;color:#ff7a8a;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:50;animation:fxup .9s ease-out forwards;white-space:nowrap}
.fx.heal{color:#9cffb0}.fx.info{color:#ffd166;font-size:13px}
@keyframes fxup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
#note{position:absolute;left:290px;bottom:200px;width:700px;background:#0b0d12;box-shadow:inset 0 0 0 2px var(--gold);padding:10px 14px;font-size:14px;color:#ffe9b0;z-index:60;display:none}
#note b{font:11px "Silkscreen",monospace;color:var(--gold);display:block;margin-bottom:4px}
#tip{position:absolute;width:260px;background:#0b0d12;box-shadow:inset 0 0 0 2px var(--acc);padding:10px 12px;font-size:13px;z-index:70;pointer-events:none;display:none;line-height:1.3}
#tip .nm{font:12px "Silkscreen",monospace;color:#fff;margin-bottom:4px}
#tip .tx b{color:var(--gold)}
#tip .fact{margin-top:8px;color:#9ad0ff;border-top:1px solid var(--line);padding-top:6px;font-size:12px}
#tip .kw{color:var(--muted);font-size:11px;margin-top:4px}
.modal{position:absolute;inset:0;background:rgba(3,4,6,.88);z-index:80;padding:30px 40px;overflow-y:auto}
.spec{background:var(--p1);box-shadow:inset 0 0 0 2px var(--line);padding:16px;cursor:pointer;text-align:left}
.spec:hover{box-shadow:inset 0 0 0 2px var(--acc)}
.spec h2{font-size:18px}
.spec .pw{color:var(--gold);font-size:13px;margin:8px 0}
.gcard{display:grid;grid-template-columns:60px 1fr;gap:10px;background:var(--p1);box-shadow:inset 0 0 0 2px var(--line);padding:8px;font-size:12px}
.gcard.unseen{opacity:.35}
.gcard svg{width:56px;height:42px}
.gcard b{font:10px "Silkscreen",monospace;color:#fff}
.gcard .fact{color:#9ad0ff;font-size:11px;margin-top:3px}
.stat{background:var(--p1);box-shadow:inset 0 0 0 2px var(--line);padding:10px;text-align:center}
.stat b{display:block;font:22px "Silkscreen",monospace;color:var(--gold)}
.stat span{font-size:11px;color:var(--muted)}
.tabs button{font:11px "Silkscreen",monospace;background:#141924;border:0;color:var(--muted);padding:6px 10px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.tabs button.on{color:#fff;box-shadow:inset 0 0 0 2px var(--acc)}
.ent{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.ent b{color:var(--gold);font-size:12px}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script>
"use strict";
/* =====================================================================
   CULTURE CLASH v1 — a biology card battler.
   Hearthstone-style board combat against eight lab bosses; choose a
   specialty after the third and draft cards whose interactions are
   narrower but stronger. Every card carries a true fact; notable
   interactions explain their biology the first time they fire.
   ===================================================================== */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)], shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEBUG=/[?&]debug\b/.test(location.search);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const META=Object.assign({runs:0,wins:{micro:0,immuno:0,mol:0},best:0,seen:[],notes:[],kills:0},store.get('cc_meta',{}));
const PREFS=Object.assign({sfx:true,fast:false},store.get('cc_prefs',{}));
const saveMeta=()=>store.set('cc_meta',META), savePrefs=()=>store.set('cc_prefs',PREFS);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ---------- sound: everything synthesised ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.08,type='square',v=.12,slide=0){if(!PREFS.sfx)return;const c=ac();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),c.currentTime+d);g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
const SFX={play:()=>{tone(520,.07);setTimeout(()=>tone(780,.08),60)},hit:()=>tone(170,.12,'sawtooth',.16,-90),die:()=>tone(220,.22,'sawtooth',.12,-160),draw:()=>tone(900,.04,'triangle',.06),turn:()=>{tone(440,.06);setTimeout(()=>tone(660,.08),70)},win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.1),i*120)),lose:()=>[400,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sawtooth',.1),i*160)),err:()=>tone(120,.15,'square',.1),heal:()=>tone(700,.1,'sine',.08,300),note:()=>{tone(880,.08,'triangle',.07);setTimeout(()=>tone(1320,.12,'triangle',.07),90)},sel:()=>tone(600,.03,'triangle',.05),power:()=>tone(300,.1,'square',.08,200)};

/* ---------- keywords (Hearthstone mechanics with their biology names) ---------- */
const KW={
 biofilm:{n:'Biofilm',d:'Enemies must attack this minion first.'},
 motile:{n:'Motile',d:'Can attack the turn it is played.'},
 capsule:{n:'Capsule',d:'The first time it would take damage, it takes none.'},
 toxin:{n:'Toxin',d:'Destroys any minion it damages.'},
 phagocytic:{n:'Phagocytic',d:'Damage it deals also heals your hero. Double damage to Opsonized targets.'},
 intracellular:{n:'Intracellular',d:'Cannot be attacked or targeted by the enemy until it attacks.'},
 fastrep:{n:'Fast replication',d:'Can attack twice each turn.'},
 persister:{n:'Persister',d:'Immune to antibiotic spells.'},
 memory:{n:'Memory',d:'When it dies, it returns to your hand.'},
 spore:{n:'Spore',d:'When it dies, it leaves a 1/1 Spore.'},
 ampr:{n:'ampR',d:'β-lactamase plasmid: β-lactam antibiotics (Ampicillin, Penicillium) make it +1/+1 instead of hurting it.'},
 conj:{n:'Conjugative',d:'At the end of your turn, copies its plasmid (+1/+1, ampR) to adjacent Bacteria.'},
 gfp:{n:'GFP-tagged',d:'Whenever it attacks, draw a card.'},
 nowall:{n:'Wall-less',d:'Cell-wall agents (Ampicillin, Vancomycin, Lysozyme, Penicillium) do nothing to it.'},
 lysores:{n:'Lysozyme-resistant',d:'Lysozyme only deals damage to it; it is not destroyed.'},
 nk:{n:'Missing-self',d:'Can attack Intracellular minions.'},
 elusive:{n:'Elusive',d:'Cannot be targeted by spells or hero powers.'},
 catalyst:{n:'Catalyst',d:'Your spells deal extra damage.'}
};
const GLOSS=[['On plating','Happens when you play the card from your hand (battlecry).'],['Lysis','Happens when the minion dies (deathrattle).'],['Opsonized','Marked by antibody: Phagocytic minions deal double damage to it, and some spells finish it.'],['Cold shock','Frozen: the minion skips its next attack.'],['Knockout','Silenced: loses its text, keywords and buffs.'],['Antibiotic','A spell that hits Bacteria on BOTH sides. Persisters ignore it; the right plasmid turns it into a buff.'],['Gram+ / Gram−','Purple cards are Gram-positive (thick exposed wall); pink cards are Gram-negative (outer membrane).']];

/* ---------- card art: one procedural glyph per tribe ---------- */
const TRIBE={bact:'Bacterium',phage:'Phage',virus:'Virus',immune:'Immune cell',enzyme:'Enzyme',fungus:'Fungus',parasite:'Parasite',reagent:'Reagent',instr:'Instrument',plasmid:'Plasmid',mouse:'Animal',prion:'Prion',ice:'Hazard',misc:'Misc',review:'Reviewer'};
function tribeCol(d){if(d.t==='bact')return d.g==='+'?'#b59cff':'#ff8ad0';return {phage:'#5ab4e0',virus:'#ff6b6b',immune:'#7cf29a',enzyme:'#ffd166',fungus:'#c9a27e',parasite:'#9ad0ff',reagent:'#8fe3ff',instr:'#c9d2dc',plasmid:'#ffd166',mouse:'#e8c8a0',prion:'#ff9a4d',ice:'#bfe6ff',misc:'#dfe7f0',review:'#ff8a8a'}[d.t]||'#dfe7f0'}
function glyph(d){const c=tribeCol(d),k='#05060a';let b='';
 switch(d.t){
 case 'bact': if(d.shape==='cocci') b=`<circle cx="22" cy="20" r="9" fill="${c}"/><circle cx="40" cy="18" r="9" fill="${c}"/><circle cx="31" cy="32" r="9" fill="${c}"/><circle cx="22" cy="20" r="3" fill="${k}" opacity=".4"/><circle cx="40" cy="18" r="3" fill="${k}" opacity=".4"/>`;
  else if(d.shape==='curve') b=`<path d="M12 34 Q 32 8 52 30" stroke="${c}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 30 q6 -8 8 -16" stroke="${c}" stroke-width="2" fill="none"/>`;
  else b=`<rect x="10" y="15" width="44" height="18" rx="9" fill="${c}"/><rect x="18" y="20" width="6" height="8" fill="${k}" opacity=".35"/><rect x="34" y="20" width="6" height="8" fill="${k}" opacity=".35"/>${d.flag?`<path d="M54 24 q6 -10 10 0 t-4 10" stroke="${c}" stroke-width="2" fill="none"/>`:''}`;
  break;
 case 'phage': b=`<polygon points="32,3 43,9 43,21 32,27 21,21 21,9" fill="${c}"/><rect x="29" y="27" width="6" height="12" fill="${c}"/><path d="M32 39 l-10 7 M32 39 l10 7 M32 39 l-4 8 M32 39 l4 8" stroke="${c}" stroke-width="2"/><polygon points="32,9 37,12 37,18 32,21 27,18 27,12" fill="${k}" opacity=".35"/>`;break;
 case 'virus': b=`<circle cx="32" cy="24" r="13" fill="${c}"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${32+Math.cos(r)*12}" y1="${24+Math.sin(r)*12}" x2="${32+Math.cos(r)*19}" y2="${24+Math.sin(r)*19}" stroke="${c}" stroke-width="3"/><circle cx="${32+Math.cos(r)*20}" cy="${24+Math.sin(r)*20}" r="2.5" fill="${c}"/>`}).join('')}<path d="M26 22 q6 -6 12 0 q-6 6 -12 0" fill="${k}" opacity=".35"/>`;break;
 case 'immune': b=`<circle cx="32" cy="24" r="19" fill="${c}"/><circle cx="26" cy="22" r="6" fill="${k}" opacity=".45"/><circle cx="36" cy="26" r="6" fill="${k}" opacity=".45"/><circle cx="32" cy="18" r="5" fill="${k}" opacity=".45"/>`;break;
 case 'enzyme': b=`<path d="M32 24 L50 12 A20 20 0 1 0 50 36 Z" fill="${c}"/><circle cx="26" cy="18" r="3" fill="${k}" opacity=".5"/>`;break;
 case 'fungus': b=`<circle cx="22" cy="30" r="8" fill="${c}"/><circle cx="34" cy="22" r="8" fill="${c}"/><circle cx="46" cy="16" r="6" fill="${c}"/><circle cx="42" cy="34" r="5" fill="${c}"/><path d="M8 44 q10 -10 20 -2 M30 44 q8 -6 16 -2" stroke="${c}" stroke-width="2" fill="none"/>`;break;
 case 'parasite': b=`<path d="M8 28 q8 -16 16 0 t16 0 t16 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="56" cy="28" r="5" fill="${c}"/>`;break;
 case 'reagent': b=`<path d="M26 6 h12 v12 l12 20 q2 6 -4 6 h-28 q-6 0 -4 -6 l12 -20 z" fill="${c}"/><rect x="26" y="4" width="12" height="4" fill="${c}"/><path d="M18 36 h28" stroke="${k}" stroke-width="3" opacity=".4"/>`;break;
 case 'instr': b=`<rect x="28" y="4" width="8" height="26" fill="${c}"/><rect x="24" y="2" width="16" height="6" fill="${c}"/><polygon points="26,30 38,30 33,46 31,46" fill="${c}"/><rect x="30" y="12" width="4" height="10" fill="${k}" opacity=".4"/>`;break;
 case 'plasmid': b=`<circle cx="32" cy="24" r="15" stroke="${c}" stroke-width="6" fill="none"/><rect x="40" y="8" width="8" height="8" fill="${c}"/><rect x="14" y="30" width="8" height="8" fill="${c}"/>`;break;
 case 'mouse': b=`<ellipse cx="34" cy="30" rx="18" ry="12" fill="${c}"/><circle cx="18" cy="20" r="7" fill="${c}"/><circle cx="30" cy="16" r="6" fill="${c}"/><circle cx="20" cy="22" r="2" fill="${k}"/><path d="M52 32 q10 2 8 12" stroke="${c}" stroke-width="2" fill="none"/>`;break;
 case 'prion': b=`<path d="M10 20 l8 -10 l8 12 l8 -14 l8 14 l8 -10 l6 10" stroke="${c}" stroke-width="5" fill="none"/><path d="M12 36 l10 -8 l10 8 l10 -8 l10 8" stroke="${c}" stroke-width="4" fill="none" opacity=".7"/>`;break;

/* =====================================================================
   CARDS. One table; effects are hooks the engine calls:
   play(ctx)   on plating / spell effect   ctx = {me, side, t, sp}
   death(ctx)  lysis                        start/end(ctx) turn hooks
   attack(ctx) after this minion attacks    aura(m, other) -> {atk, kw:[]}
   handMod(inst, side) cost change for cards in hand while on the board
   cost(side) dynamic cost     tgt/tf: target kind and extra filter
   s = gen | micro | immuno | mol | boss (boss cards are never drafted)
   ===================================================================== */

function C(d){d.type=d.type||(d.a!=null?'minion':'spell');d.kw=d.kw||[];d.r=d.r||1;d.s=d.s||'gen';CARDS[d.id]=d;return d}

let F=null,G=null,UID=1,AIBUSY=false,SEL=null,SCREEN='title',FXQ=[],RUN=null;
const enemy=s=>s===F.p?F.e:F.p;
const allMinions=()=>F.p.board.concat(F.e.board);
function mkCard(id){return {uid:UID++,id,cm:0}}
function mkSide(id,hero,ids,hp){return {id,isSide:true,hero,hp,max:hp,mana:0,maxMana:0,hand:[],deck:shuffle(ids.map(mkCard)),board:[],fatigue:0,powerUsed:false,discount:0,deaths:0}}
function mkMinion(side,id){const d=CARDS[id];return {uid:UID++,id,d,side,atk:d.a,hp:d.h,max:d.h,kw:new Set(d.kw),cat:d.cat||0,sick:true,att:0,frozen:false,ops:false,silenced:false,lyso:null,incl:0,plasmid:false,tmpAtk:0}}
function auraOf(m){let atk=0;const kw=new Set();for(const o of m.side.board){if(o.silenced||!o.d.aura)continue;const r=o.d.aura(o,m);if(r){atk+=r.atk||0;(r.kw||[]).forEach(k=>kw.add(k))}}return {atk,kw}}
const hasKw=(m,k)=>!!m&&!m.isSide&&(m.kw.has(k)||auraOf(m).kw.has(k));
const atkOf=m=>Math.max(0,m.atk+auraOf(m).atk);
const value=m=>atkOf(m)+m.hp+m.kw.size;
const boardValue=s=>s.board.reduce((a,m)=>a+value(m),0);
const adjacent=m=>{const b=m.side.board,i=b.indexOf(m);return [b[i-1]||null,b[i+1]||null]};
const sp=side=>side.board.reduce((a,m)=>a+(m.silenced?0:m.cat||0),0);
function log(s){F.log.push(s);if(F.log.length>60)F.log.shift()}
function fx(uid,txt){FXQ.push({uid,txt})}
function seen(id){if(META.seen.indexOf(id)<0){META.seen.push(id);saveMeta()}}
function note(k){if(!F||F.notes.has(k)||!NOTES[k])return;F.notes.add(k);if(META.notes.indexOf(k)<0){META.notes.push(k);saveMeta()}F.noteQ.push(k)}

function costOf(side,inst){const d=CARDS[inst.id];let c=d.cost?d.cost(side):d.c;c+=inst.cm||0;for(const m of side.board)if(m.d.handMod&&!m.silenced)c+=m.d.handMod(inst,side);if(side.discount)c-=side.discount;return Math.max(0,c)}
function validTargets(side,d,src){const en=enemy(side),k=d.tgt;let arr=[];if(!k)return arr;
 if(k==='enemyMinion'||k==='minion'||k==='any'||k==='enemy')arr=arr.concat(en.board.filter(m=>!hasKw(m,'intracellular')&&!hasKw(m,'elusive')));
 if(k==='friendlyMinion'||k==='minion'||k==='any')arr=arr.concat(side.board.filter(m=>m!==src));
 if(k==='any'||k==='enemy')arr.push(en);if(k==='any')arr.push(side);
 if(d.tf)arr=arr.filter(t=>d.tf(t,side));return arr}
function canPlay(side,inst){const d=CARDS[inst.id];if(F.over||costOf(side,inst)>side.mana)return false;if(d.type==='minion'&&side.board.length>=6)return false;if(d.type==='spell'&&d.tgt&&validTargets(side,d).length===0)return false;return true}
function needsTarget(side,inst){const d=CARDS[inst.id];return !!d.tgt&&validTargets(side,d).length>0}

function play(side,inst,target){const d=CARDS[inst.id];if(!canPlay(side,inst))return false;if(d.tgt&&target&&!validTargets(side,d).includes(target))target=null;if(d.type==='spell'&&d.tgt&&!target)return false;
 side.mana-=costOf(side,inst);side.discount=0;side.hand.splice(side.hand.indexOf(inst),1);SFX.play();log(`${side.hero} plays ${d.n}`);if(side===F.p)seen(inst.id);
 if(d.type==='minion'){const m=mkMinion(side,inst.id);side.board.push(m);if(hasKw(m,'motile'))m.sick=false;fx(m.uid,'pop');onSummon(m);if(d.play&&!m.silenced)d.play({me:m,side,t:target,sp:sp(side)});if(side===F.e&&F.e.boss.onPlay)F.e.boss.onPlay(m)}
 else{d.play({side,t:target,sp:sp(side),card:d});F.spells++}
 resolve();return true}
function onSummon(m){for(const o of m.side.board)if(o!==m&&o.d.onSummon&&!o.silenced)o.d.onSummon(o,m);if(m.side===F.e&&F.e.boss.onSummon)F.e.boss.onSummon(m);if(m.d.sub==='T'&&m.side.board.some(o=>o.id==='dendritic'&&o!==m))note('dendritic')}
function summon(side,id,pos){if(side.board.length>=6)return null;const m=mkMinion(side,id);if(pos==null||pos>side.board.length)pos=side.board.length;side.board.splice(pos,0,m);if(hasKw(m,'motile'))m.sick=false;fx(m.uid,'pop');onSummon(m);if(side===F.p)seen(id);return m}
function removeMinion(m){const b=m.side.board,i=b.indexOf(m);if(i>=0)b.splice(i,1);m.gone=true}
function destroy(m){if(!m||m.isSide)return;m.dead=true}
function damage(t,n,src,opts={}){n=Math.max(0,Math.floor(n));if(n<=0||!t)return 0;
 if(t.isSide){t.hp-=n;fx('hero-'+t.id,'-'+n);SFX.hit();if(src&&!src.isSide&&hasKw(src,'phagocytic'))heal(src.side,n);return n}
 if(t.gone||t.dead)return 0;
 if(src&&!src.isSide&&hasKw(src,'phagocytic')&&t.ops){n*=2;note('opson')}
 if(t.kw.has('capsule')){t.kw.delete('capsule');fx(t.uid,'capsule');return 0}
 t.hp-=n;fx(t.uid,'-'+n);SFX.hit();
 if(src&&!src.isSide){if(hasKw(src,'phagocytic'))heal(src.side,n);if(hasKw(src,'toxin'))t.dead=true}
 return n}
function heal(t,n){if(t.isSide){const b=t.hp;t.hp=Math.min(t.max,t.hp+n);if(t.hp>b){fx('hero-'+t.id,'+'+(t.hp-b));SFX.heal()}}else{const b=t.hp;t.hp=Math.min(t.max,t.hp+n);if(t.hp>b)fx(t.uid,'+'+(t.hp-b))}}
function buff(m,a,h){if(!m||m.isSide)return;m.atk+=a;m.max+=h;m.hp+=h;if(a||h)fx(m.uid,`+${a}/+${h}`)}
function attachPlasmid(m,a,h){buff(m,a,h);m.kw.add('ampr');m.plasmid=true}
function opsonize(m){if(!m||m.isSide)return;m.ops=true;fx(m.uid,'opsonized')}
function freeze(m){if(!m||m.isSide)return;m.frozen=true;fx(m.uid,'frozen');note('freeze')}
function silence(m){if(!m||m.isSide)return;m.silenced=true;m.kw.clear();m.atk=m.d.a;m.max=m.d.h;m.hp=Math.min(m.hp,m.max);m.cat=0;m.incl=0;m.lyso=null;m.plasmid=false;fx(m.uid,'knockout')}
function transformM(m,id){const d=CARDS[id];m.id=id;m.d=d;m.atk=d.a;m.hp=m.max=d.h;m.kw=new Set(d.kw);m.cat=d.cat||0;m.silenced=false;m.ops=false;m.plasmid=false;m.incl=0;m.lyso=null;fx(m.uid,'transformed')}
function draw(side,n=1){for(let i=0;i<n;i++){if(!side.deck.length){side.fatigue++;damage(side,side.fatigue);log(`${side.hero} fatigue ${side.fatigue}`);note('fatigue');continue}const c=side.deck.pop();if(side.hand.length>=10){log(`${side.hero} burns ${CARDS[c.id].n}`);continue}side.hand.push(c);if(side===F.p){seen(c.id);SFX.draw()}}}
function drawWhere(side,f){const i=side.deck.map((c,i)=>f(CARDS[c.id])?i:-1).filter(i=>i>=0);if(!i.length){draw(side,1);return}const c=side.deck.splice(pick(i),1)[0];if(side.hand.length<10){side.hand.push(c);if(side===F.p)seen(c.id)}}
function addToHand(side,id){if(side.hand.length>=10)return null;const c=mkCard(id);side.hand.push(c);if(side===F.p)seen(id);return c}
function discardRandom(side){if(!side.hand.length)return;const c=side.hand.splice(rnd(side.hand.length),1)[0];log(`${side.hero} discards ${CARDS[c.id].n}`);fx('hero-'+side.id,'discard')}
function antibiotic(ctx,filter,n,opts){for(const s of [F.p,F.e])for(const m of [...s.board]){if(!isBact(m)||!filter(m))continue;
 if(hasKw(m,'persister')){fx(m.uid,'persister');note('persister');continue}
 if(opts.wall&&hasKw(m,'nowall')){fx(m.uid,'no wall');note('nowall');continue}
 if(s===F.e&&F.e.boss.abImmune&&F.e.boss.abImmune(m)){fx(m.uid,'resistant');note('mrsa');continue}
 if(opts.res&&m.kw.has(opts.res)){buff(m,1,1);note('ampr');continue}
 damage(m,n)}}
function abScore(e,filter,n){let s=0;for(const m of F.p.board)if(isBact(m)&&filter(m)&&!hasKw(m,'persister'))s+=m.kw.has('ampr')?-3:(m.hp<=n?value(m):2);for(const m of e.board)if(isBact(m)&&filter(m)&&!hasKw(m,'persister')&&!(e.boss.abImmune&&e.boss.abImmune(m)))s-=m.kw.has('ampr')?-2:(m.hp<=n?value(m):2);return s-2}

function canAttack(m){if(F.over||m.frozen||(m.sick&&!hasKw(m,'motile'))||atkOf(m)<=0)return false;return m.att<(hasKw(m,'fastrep')?2:1)}
function attackTargets(m){const en=enemy(m.side),taunts=en.board.filter(x=>hasKw(x,'biofilm'));let list=(taunts.length?taunts:en.board).filter(x=>!hasKw(x,'intracellular')||hasKw(m,'nk'));if(!taunts.length)list=list.concat([en]);return list}
function attack(m,t){if(!canAttack(m)||!attackTargets(m).includes(t))return false;m.att++;if(m.kw.has('intracellular'))m.kw.delete('intracellular');m.sick=false;
 if(!t.isSide&&t.kw.has('intracellular')&&hasKw(m,'nk'))note('nk');
 log(`${m.d.n} attacks ${t.isSide?t.hero:t.d.n}`);fx(m.uid,'lunge');
 const a=atkOf(m);if(t.isSide)damage(t,a,m);else{const b=atkOf(t);damage(t,a,m);damage(m,b,t)}
 if(m.kw.has('gfp')&&!m.gone)draw(m.side,1);if(m.d.attack&&!m.silenced)m.d.attack({me:m,side:m.side,t});
 resolve();return true}
function resolve(){let loop=0;while(loop++<30){const dead=[];for(const s of [F.p,F.e])for(const m of s.board)if(m.hp<=0||m.dead)dead.push(m);if(!dead.length)break;
 for(const m of dead){const s=m.side,idx=s.board.indexOf(m);if(idx<0)continue;s.board.splice(idx,1);m.gone=true;s.deaths++;log(`${m.d.n} dies`);SFX.die();
  if(!m.silenced&&m.d.death)m.d.death({me:m,side:s,pos:idx,sp:sp(s)});
  if(m.kw.has('spore')){summon(s,'spore',idx);note('spore')}
  if(m.kw.has('memory')){addToHand(s,m.id);fx('hero-'+s.id,'memory')}
  if(m.lyso&&m.lyso!==s){addToHand(m.lyso,m.id);note('lysocopy')}
  if(F.e.boss.onDeath)F.e.boss.onDeath(m)}}
 checkEnd()}
function checkEnd(){if(F.over)return;if(F.p.hp<=0){F.over=true;F.won=false}else if(F.e.hp<=0){F.over=true;F.won=true}}

function usePower(side,t){const pw=side.power;if(F.over||side.powerUsed||side.mana<pw.c)return false;if(pw.tgt){const vt=validTargets(side,pw);if(!t||!vt.includes(t))return false}side.mana-=pw.c;side.powerUsed=true;SFX.power();log(`${side.hero} uses ${pw.n}`);pw.use(side,t);resolve();return true}

function startTurn(side){F.active=side;F.turn++;side.maxMana=Math.min(10,side.maxMana+1);side.mana=side.maxMana;side.powerUsed=false;side.discount=0;
 for(const m of side.board){m.sick=false;m.att=0}
 const en=enemy(side);for(const m of [...en.board])if(m.lyso===side&&side.board.length<6){removeMinion(m);m.gone=false;m.side=side;m.lyso=null;m.sick=true;m.att=0;side.board.push(m);fx(m.uid,'induced');note('lyso')}
 draw(side,1);
 for(const m of [...side.board])if(m.d.start&&!m.silenced&&!m.gone)m.d.start({me:m,side});
 if(side===F.e&&F.e.boss.onStart)F.e.boss.onStart(side);if(side===F.p&&F.e.boss.onPlayerStart)F.e.boss.onPlayerStart();
 resolve();SFX.turn();if(side===F.p)F.banner='YOUR TURN';render();if(side===F.e&&!F.over)aiTurn()}
function endTurn(){if(!F||F.over)return;const side=F.active;SEL=null;
 for(const m of [...side.board]){if(m.gone)continue;if(m.d.end&&!m.silenced)m.d.end({me:m,side,sp:sp(side)});if(m.incl>0){m.incl--;if(m.incl===0){m.dead=true;fx(m.uid,'inclusion bodies');note('incl')}}if(m.tmpAtk){m.atk-=m.tmpAtk;m.tmpAtk=0}}
 for(const m of [...side.board]){if(m.gone||!m.kw.has('conj'))continue;adjacent(m).forEach(o=>{if(o&&isBact(o)&&!o.kw.has('conj')){attachPlasmid(o,1,1);o.kw.add('conj');note('conj')}})}
 for(const m of side.board)m.frozen=false;
 for(const m of enemy(side).board)if(m.tmpPersist){m.kw.delete('persister');m.tmpPersist=0}
 if(side===F.e&&F.e.boss.onEnd)F.e.boss.onEnd(side);if(side===F.p&&F.e.boss.onPlayerEnd)F.e.boss.onPlayerEnd();
 resolve();if(F.over){render();return}startTurn(enemy(side))}

/* =====================================================================
   BOSS AI: lethal check, favourable trades, respects Biofilm, else face
   ===================================================================== */
const wait=ms=>new Promise(r=>setTimeout(r,PREFS.fast||DEBUG&&window.CC_FAST?0:ms));
function aiPickTarget(d,vt,e){if(!vt.length)return null;if(d.aiT)return d.aiT(vt,e);const k=d.tgt;
 if(k==='friendlyMinion')return vt.filter(t=>!t.isSide&&t.side===e).sort((a,b)=>value(b)-value(a))[0]||null;
 const em=vt.filter(t=>!t.isSide&&t.side===F.p);if(em.length)return em.sort((a,b)=>value(b)-value(a))[0];
 return vt.find(t=>t.isSide&&t===F.p)||null}
function aiScore(d,t,e){if(d.ai)return d.ai(e,t);if(d.type==='minion')return d.c*10+d.a+d.h;if(d.tgt==='friendlyMinion')return t?6+d.c:-1;if(d.tgt==='enemyMinion'||d.tgt==='minion'||d.tgt==='any'||d.tgt==='enemy')return t?6+d.c*2:-1;return d.c*4+2}
function aiAttackTarget(m,ts){const p=F.p,a=atkOf(m),face=ts.find(t=>t.isSide),ms=ts.filter(t=>!t.isSide);
 if(face){const total=F.e.board.filter(canAttack).reduce((s,x)=>s+atkOf(x),0);if(total>=p.hp)return face}
 const kills=ms.filter(t=>(a>=t.hp||m.kw.has('toxin'))&&!t.kw.has('capsule'));
 const safe=kills.filter(t=>atkOf(t)<m.hp&&!hasKw(t,'toxin'));if(safe.length)return safe.sort((x,y)=>value(y)-value(x))[0];
 const up=kills.filter(t=>value(t)>value(m)+2);if(up.length)return up.sort((x,y)=>value(y)-value(x))[0];
 if(face)return face;return ms.sort((x,y)=>x.hp-y.hp)[0]}
async function aiTurn(){if(AIBUSY)return;AIBUSY=true;const e=F.e;try{await wait(700);let guard=0;
 while(!F.over&&guard++<30){let best=null,bs=-1;for(const c of e.hand){if(!canPlay(e,c))continue;const d=CARDS[c.id];let t=null;if(d.tgt){t=aiPickTarget(d,validTargets(e,d),e);if(!t&&d.type==='spell')continue}const sc=aiScore(d,t,e);if(sc>bs){bs=sc;best={c,t}}}
  if(!best||bs<0)break;play(e,best.c,best.t);render();await wait(650)}
 if(!F.over&&e.power&&!e.powerUsed&&e.mana>=e.power.c&&(!e.power.ai||e.power.ai(e)>0)){let t=null;if(e.power.tgt)t=aiPickTarget(e.power,validTargets(e,e.power),e);if(!e.power.tgt||t){usePower(e,t);render();await wait(500)}}
 guard=0;while(!F.over&&guard++<20){const m=e.board.find(x=>canAttack(x));if(!m)break;const ts=attackTargets(m);if(!ts.length){m.att=9;continue}attack(m,aiAttackTarget(m,ts));render();await wait(650)}
 }catch(err){console.error(err)}AIBUSY=false;if(!F.over)endTurn();else render()}

function newRun(){G={level:1,spec:null,deck:STARTER.slice(),turns:0,kills:0,picked:[]};META.runs++;saveMeta();SCREEN='intro';render()}
function startFight(){const B=BOSSES[G.level-1];const pw=G.spec?SPECS[G.spec].power:GEN_POWER;const hero=G.spec?SPECS[G.spec].hero:'Undergrad';
 const eDeck=[];B.deck.forEach(([id,n])=>{for(let i=0;i<n;i++)eDeck.push(id)});
 F={p:mkSide('p',hero,G.deck,30),e:mkSide('e',B.n,eDeck,B.hp),turn:0,active:null,over:false,won:false,log:[],notes:new Set(),noteQ:[],spells:0,banner:''};
 F.p.power=pw;F.e.power=B.power;F.e.boss=B;F.p.boss={};
 draw(F.p,4);draw(F.e,G.level<3?3:4);if(B.onFightStart)B.onFightStart(F.e);SCREEN='fight';SEL=null;startTurn(F.p)}
function fightOver(){if(F.won){G.kills++;META.kills++;if(G.level>META.best){META.best=G.level}saveMeta();SFX.win();if(G.level===8){META.wins[G.spec]=(META.wins[G.spec]||0)+1;saveMeta();SCREEN='victory'}else if(G.level===3){SCREEN='spec'}else{makeDraft();SCREEN='draft'}}
 else{SFX.lose();SCREEN='gameover'}render()}
function draftPool(){const gen=Object.values(CARDS).filter(d=>d.s==='gen'&&STARTER.indexOf(d.id)<0||d.s==='gen'&&d.r>1);let pool=[];const w=d=>d.r===1?3:d.r===2?2:1;
 const genAll=Object.values(CARDS).filter(d=>d.s==='gen');
 if(G.spec){Object.values(CARDS).filter(d=>d.s===G.spec).forEach(d=>{for(let i=0;i<w(d)*3;i++)pool.push(d.id)});genAll.forEach(d=>{for(let i=0;i<w(d);i++)pool.push(d.id)})}
 else genAll.forEach(d=>{for(let i=0;i<w(d);i++)pool.push(d.id)});return pool}
function makeDraft(){const pool=shuffle(draftPool()),out=[];for(const id of pool){if(out.indexOf(id)<0)out.push(id);if(out.length===3)break}G.draft=out;G.cleanup=[2,4,6].indexOf(G.level)>=0}
function pickDraft(id){G.deck.push(id);G.picked.push(id);seen(id);if(G.cleanup){SCREEN='cleanup'}else{nextLevel()}render()}
function nextLevel(){G.level++;SCREEN='intro'}
function chooseSpec(k){G.spec=k;makeDraft();SCREEN='draft';render()}
function removeCard(i){if(i>=0&&i<G.deck.length)G.deck.splice(i,1);nextLevel();render()}

 return `<div class="${cls}" ${opts.attrs||''} data-card="${d.id}"><div class="cost">${cost}</div><div class="art">${glyph(d)}</div><div class="nm">${esc(d.n)}</div><div class="tx">${fmt(d.txt)}</div><div class="tr">${TRIBE[d.t]||''}${d.t==='bact'?' · Gram'+(d.g==='+'?'+':'−'):''}${d.sub==='T'?' · T cell':''}</div>${d.type==='minion'?`<div class="at">${d.a}</div><div class="hp">${d.h}</div>`:''}</div>`}

 const c=['min',cls,hasKw(m,'biofilm')?'biofilm':'',m.frozen?'frozen':'',m.sick&&!hasKw(m,'motile')?'sick':'',m.ops?'ops':'',hasKw(m,'intracellular')?'stealth':'',m.justPlayed?'pop':''].join(' ');
 return `<div class="${c}" data-uid="${m.uid}" data-card="${m.id}" data-minion="1"><div class="art">${glyph(m.d)}</div><div class="nm">${esc(m.fused?m.fused.join('+'):m.d.n)}</div><div class="kws">${m.silenced?'<i>KO</i>':kws.map(k=>`<i>${KW[k]?KW[k].n:k}</i>`).join('')}${m.cat&&!m.silenced?`<i>Catalyst +${m.cat}</i>`:''}${m.lyso?'<i>prophage</i>':''}${m.incl?'<i>IPTG '+m.incl+'</i>':''}</div><div class="at ${a>m.d.a?'buff':''}">${a}</div><div class="hp ${m.hp<m.max?'hurt':''}">${m.hp}</div></div>`}

function renderFight(){const p=F.p,e=F.e,B=e.boss,my=F.active===p&&!AIBUSY&&!F.over,tg=targetsFor();const isT=t=>tg.includes(t)?'tgt':'';
 const n=p.hand.length,ov=n>6?-(Math.ceil((n*128-700)/(n-1))):0;
 let h=`<div class="hero ${F.active===e?'active':''} ${isT(e)}" id="ehero" data-hero="e" data-uid="hero-e"><div class="nm">${esc(B.n)}</div><div class="hpbig">${e.hp}</div><div class="sub">${e.hand.length} in hand · ${e.deck.length} in deck · ${e.maxMana} mana</div><div class="passive">${esc(B.passive)}</div></div>`;
 h+=`<div class="brow" id="eboard">${e.board.map(m=>minionHTML(m,isT(m))).join('')||'<span class="muted">—</span>'}</div><div class="divider"></div>`;
 h+=`<div class="brow" id="pboard">${p.board.map(m=>minionHTML(m,[isT(m),SEL&&SEL.k==='min'&&SEL.uid===m.uid?'sel':'',my&&canAttack(m)&&!SEL?'can':''].join(' '))).join('')||'<span class="muted">your bench is empty</span>'}</div>`;
 h+=`<div class="hero ${F.active===p?'active':''} ${isT(p)}" id="phero" data-hero="p" data-uid="hero-p"><div class="nm">${esc(p.hero)} · level ${G.level}/8</div><div class="hpbig">${p.hp}</div><div class="sub">${p.deck.length} in deck</div><div class="power ${p.powerUsed?'used':p.mana<p.power.c?'no':''} ${SEL&&SEL.k==='power'?'sel':''}" data-power="1"><b>${esc(p.power.n)} (${p.power.c})</b><br>${esc(p.power.d)}</div></div>`;
 h+=`<div id="hand" style="--ov:${ov}px">${p.hand.map(c=>cardHTML(CARDS[c.id],{cost:costOf(p,c),cls:(my&&canPlay(p,c)?'can':'')+(SEL&&SEL.k==='hand'&&SEL.uid===c.uid?' sel':''),attrs:`data-hand="${c.uid}"`})).join('')}</div>`;
 h+=`<div id="side"><button class="btn pri ${my?'':'wait'}" id="endturn" ${my?'':'disabled'}>${F.over?'FIGHT OVER':my?'END TURN':'ENEMY TURN…'}</button><div class="lbl" style="margin-top:10px">MANA ${p.mana}/${p.maxMana}</div><div class="mana">${Array.from({length:p.maxMana},(_,i)=>`<i class="${i<p.mana?'':'used'}"></i>`).join('')}</div>
  <div class="lbl">TURN ${Math.ceil(F.turn/2)} · ${G.spec?SPECS[G.spec].n:'General biology'}</div><div class="row" style="margin-top:8px"><button class="btn" data-act="deck" style="padding:6px 10px;font-size:11px">Deck</button><button class="btn" data-act="help" style="padding:6px 10px;font-size:11px">?</button><button class="btn" data-act="concede" style="padding:6px 10px;font-size:11px;color:#ff8a8a">Withdraw</button></div>
  <div id="log">${F.log.slice(-9).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`;
 if(F.banner){h+=`<div class="turnbanner">${esc(F.banner)}</div>`;F.banner=''}
 h+=`<div id="note"></div><div id="tip"></div>`;

 return h}

 return `<div class="scr"><div class="row" style="justify-content:space-between"><div><div class="lbl">Field guide</div><h2>Everything you have met</h2></div><button class="btn" data-act="title">Back</button></div><div class="tabs row" style="gap:4px;margin:10px 0">${tabs.map(([k,n])=>`<button class="${GUIDE_TAB===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>${body}</div>`}
function renderIntro(){const B=BOSSES[G.level-1];return `<div class="scr center" style="padding-top:90px"><div class="lbl">LEVEL ${G.level} OF 8 · ${esc(B.sub)}</div><h1 style="font-size:36px;margin:10px 0">${esc(B.n)}</h1><div class="panel" style="max-width:640px;margin:16px auto;text-align:left"><div class="lbl">BOSS MECHANIC</div><div class="gold" style="font-size:16px;margin:4px 0 10px">${esc(B.passive)}</div><div class="lbl">HEALTH</div><div style="font-size:16px;margin-bottom:10px">${B.hp}</div><div class="lbl">WHY</div><div style="color:#9ad0ff;font-size:14px">${esc(B.fact)}</div></div><div class="muted" style="margin-bottom:14px">Your deck: ${G.deck.length} cards · ${G.spec?SPECS[G.spec].n:'General biology'}</div><button class="btn pri" data-act="fight">Plate out</button> <button class="btn" data-act="deck">View deck</button></div>`}
function renderDraft(){return `<div class="scr center" style="padding-top:60px"><div class="lbl">${esc(BOSSES[G.level-1].n)} cleared</div><h2>Add one card to your deck</h2><p class="muted">${G.spec?SPECS[G.spec].n+' cards come up three times as often now.':'General biology until you specialise after level 3.'}</p><div class="row" style="justify-content:center;gap:30px;margin-top:30px">${G.draft.map(id=>cardHTML(CARDS[id],{cls:'pick',attrs:`data-pick="${id}"`})).join('')}</div><div id="tip"></div></div>`}
function renderSpec(){return `<div class="scr center" style="padding-top:40px"><div class="lbl">MRSA cleared · year 3</div><h2>Choose your specialty</h2><p class="muted">From now on, drafts favour this field. Its interactions are narrower and stronger.</p><div class="grid g3" style="margin-top:20px;text-align:left">${Object.keys(SPECS).map(k=>{const s=SPECS[k];return `<div class="spec" data-spec="${k}"><h2 style="color:${s.col}">${s.n}</h2><div style="font-size:13px">${s.d}</div><div class="pw"><b>Hero power · ${esc(s.power.n)} (${s.power.c}):</b> ${esc(s.power.d)}</div><div class="row" style="gap:6px;justify-content:center">${s.show.map(id=>cardHTML(CARDS[id],{cls:'',attrs:'style="transform:scale(.85);margin:-8px -6px"'})).join('')}</div></div>`}).join('')}</div><div id="tip"></div></div>`}
function renderCleanup(){return `<div class="scr"><div class="row" style="justify-content:space-between"><div><div class="lbl">Lab cleanup</div><h2>Remove one card from your deck (optional)</h2><p class="muted">A thinner deck draws its best cards more often.</p></div><button class="btn" data-act="skipclean">Keep everything</button></div><div class="row" style="gap:14px;margin-top:10px">${G.deck.map((id,i)=>cardHTML(CARDS[id],{attrs:`data-remove="${i}"`})).join('')}</div><div id="tip"></div></div>`}
function renderDeck(){const counts={};G.deck.forEach(id=>counts[id]=(counts[id]||0)+1);const ids=Object.keys(counts).sort((a,b)=>CARDS[a].c-CARDS[b].c||CARDS[a].n.localeCompare(CARDS[b].n));
 return `<div class="modal"><div class="row" style="justify-content:space-between"><h2>Your deck · ${G.deck.length} cards${F&&SCREEN==='fight'?' · '+F.p.deck.length+' still to draw':''}</h2><button class="btn" data-act="closedeck">Close</button></div><div class="grid g4" style="margin-top:10px">${ids.map(id=>{const d=CARDS[id];return `<div class="gcard" data-card="${id}"><div>${glyph(d)}</div><div><b>${esc(d.n)}</b> <span class="muted">(${d.c})${d.type==='minion'?' '+d.a+'/'+d.h:''} ×${counts[id]}</span><div>${fmt(d.txt)}</div></div></div>`}).join('')}</div><div id="tip"></div></div>`}
function renderEnd(won){const s=G.spec?SPECS[G.spec].n:'General biology';
 return `<div class="scr center" style="padding-top:60px"><div class="lbl">${won?'RUN COMPLETE':'RUN OVER'}</div><h1 style="font-size:40px;margin:8px 0">${won?'Tenure':'Contaminated'}</h1><p class="muted" style="font-size:15px">${won?'The freezer is back at −80 °C. '+s+' did it.':'Stopped by '+esc(BOSSES[G.level-1].n)+' at level '+G.level+'.'}</p>
 <div class="grid g4" style="max-width:700px;margin:16px auto">${[['LEVEL',G.level+'/8'],['BOSSES',G.kills],['DECK',G.deck.length],['NOTES',F?F.notes.size:0]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div>
 ${G.picked.length?`<h3 style="max-width:700px;margin:16px auto 8px">Drafted this run</h3><div class="row" style="justify-content:center;gap:6px;max-width:900px;margin:auto">${G.picked.map(id=>`<span style="width:44px" title="${esc(CARDS[id].n)}">${glyph(CARDS[id])}</span>`).join('')}</div>`:''}
 <div class="row" style="justify-content:center;margin-top:24px"><button class="btn pri" data-act="new">Again</button><button class="btn" data-act="guide">Field guide</button><button class="btn" data-act="title">Title</button></div></div>`}

let DECKOPEN=false;
function render(){const st=stage();let h='';
 switch(SCREEN){case 'title':h=renderTitle();break;case 'help':h=renderHelp();break;case 'guide':h=renderGuide();break;case 'intro':h=renderIntro();break;case 'fight':h=renderFight();break;case 'draft':h=renderDraft();break;case 'spec':h=renderSpec();break;case 'cleanup':h=renderCleanup();break;case 'gameover':h=renderEnd(false);break;case 'victory':h=renderEnd(true);break}
 if(DECKOPEN&&G)h+=renderDeck();st.innerHTML=h;flushFx();flushNotes()}
function flushFx(){const st=stage();const q=FXQ;FXQ=[];for(const f of q){const el=st.querySelector(`[data-uid="${f.uid}"]`);if(!el)continue;if(f.txt==='pop'){el.classList.add('pop');continue}if(f.txt==='lunge'){el.style.transform='translateY(-10px)';setTimeout(()=>{el.style.transform=''},150);continue}
  const d=document.createElement('div');d.className='fx'+(f.txt[0]==='+'?' heal':/^-\d/.test(f.txt)?'':' info');d.textContent=f.txt;d.style.left=(el.offsetLeft+el.offsetWidth/2-20+rnd(20)-10)+'px';d.style.top=(el.offsetTop+20)+'px';(el.offsetParent||st).appendChild(d);if(/^-\d/.test(f.txt))el.classList.add('shake');setTimeout(()=>d.remove(),900)}}
let NOTE_T0=null;
function flushNotes(){if(!F||!F.noteQ.length)return;const el=$('#note');if(!el)return;if(NOTE_T0)clearTimeout(NOTE_T0);const k=F.noteQ.shift();el.innerHTML=`<b>LAB NOTE · ${NOTE_T[k]}</b>${esc(NOTES[k])}`;el.style.display='block';SFX.note();NOTE_T0=setTimeout(()=>{const e2=$('#note');if(e2)e2.style.display='none';NOTE_T0=null;if(F&&F.noteQ.length)flushNotes()},F.noteQ.length?3200:5200)}
function showTip(el){const id=el.dataset.card,d=CARDS[id];if(!d)return;const tip=el.closest('#stage, .modal, .scr')?.querySelector('#tip')||$('#tip');if(!tip)return;
 const uid=el.dataset.uid;let m=null;if(uid&&F)m=allMinions().find(x=>String(x.uid)===uid);
 const kws=new Set(d.kw);if(m){m.kw.forEach(k=>kws.add(k));auraOf(m).kw.forEach(k=>kws.add(k))}
 tip.innerHTML=`<div class="nm">${esc(d.n)} <span class="muted">(${d.c})${d.type==='minion'?' '+d.a+'/'+d.h:''}</span></div><div class="tx">${fmt(d.txt)||'<span class="muted">No text.</span>'}</div>${m&&m.silenced?'<div class="red">Knocked out.</div>':''}${[...kws].filter(k=>KW[k]).map(k=>`<div class="kw"><b>${KW[k].n}:</b> ${KW[k].d}</div>`).join('')}${m&&m.ops?'<div class="kw"><b>Opsonized:</b> Phagocytic attackers deal double damage.</div>':''}<div class="fact">${esc(d.fact)}</div>`;
 const st=stage(),r=el.getBoundingClientRect(),sr=st.getBoundingClientRect(),sc=sr.width/1280;let x=(r.right-sr.left)/sc+8,y=(r.top-sr.top)/sc-10;if(x>1280-270)x=(r.left-sr.left)/sc-270;if(y>720-240)y=720-240;if(y<0)y=0;tip.style.left=x+'px';tip.style.top=y+'px';tip.style.display='block'}
function hideTip(){document.querySelectorAll('#tip').forEach(t=>t.style.display='none')}

/* ---------- clicks ---------- */
function onClick(e){const st=stage();hideTip();const t=e.target.closest('[data-act],[data-hand],[data-minion],[data-hero],[data-power],[data-pick],[data-spec],[data-remove],[data-tab]');if(!t){if(SEL){SEL=null;render()}return}
 const ds=t.dataset;ac();
 if(ds.act){act(ds.act);return}
 if(ds.tab){GUIDE_TAB=ds.tab;render();return}
 if(ds.pick){pickDraft(ds.pick);return}
 if(ds.spec){chooseSpec(ds.spec);return}
 if(ds.remove!=null){removeCard(+ds.remove);return}
 if(SCREEN!=='fight'||!F||F.over||F.active!==F.p||AIBUSY)return;
 const p=F.p;
 if(ds.hand){const inst=p.hand.find(c=>c.uid===+ds.hand);if(!inst)return;if(SEL&&SEL.k==='hand'&&SEL.uid===inst.uid){SEL=null;render();return}if(!canPlay(p,inst)){SFX.err();fx('hero-p',CARDS[inst.id].type==='minion'&&p.board.length>=6?'bench full':'not enough mana');render();return}
  if(needsTarget(p,inst)){SEL={k:'hand',uid:inst.uid};SFX.sel();render()}else{play(p,inst,null);SEL=null;render()}return}
 if(ds.power){if(SEL&&SEL.k==='power'){SEL=null;render();return}if(p.powerUsed||p.mana<p.power.c){SFX.err();return}if(p.power.tgt){if(!validTargets(p,p.power).length){SFX.err();return}SEL={k:'power'};SFX.sel();render()}else{usePower(p,null);render()}return}
 let target=null;if(ds.minion){target=allMinions().find(m=>String(m.uid)===ds.uid)}else if(ds.hero){target=ds.hero==='p'?p:F.e}
 if(!target)return;
 if(SEL){const tg=targetsFor();if(tg.includes(target)){if(SEL.k==='hand'){const inst=p.hand.find(c=>c.uid===SEL.uid);play(p,inst,target)}else if(SEL.k==='min'){const m=p.board.find(x=>x.uid===SEL.uid);attack(m,target)}else if(SEL.k==='power')usePower(p,target);SEL=null;render();return}
  if(!target.isSide&&target.side===p&&SEL.k==='min'&&SEL.uid!==target.uid&&canAttack(target)){SEL={k:'min',uid:target.uid};render();return}
  SEL=null;render();return}
 if(!target.isSide&&target.side===p){if(canAttack(target)){SEL={k:'min',uid:target.uid};SFX.sel();render()}else{fx(target.uid,target.frozen?'frozen':target.sick?'summoning sickness':atkOf(target)<=0?'0 attack':'already attacked');render()}return}
 if(!target.isSide&&target.side===F.e&&'ontouchstart' in window){showTip(st.querySelector(`[data-uid="${target.uid}"]`))}}
function act(a){switch(a){
 case 'new':newRun();break;case 'title':SCREEN='title';DECKOPEN=false;render();break;case 'help':SCREEN=SCREEN==='fight'?'help':'help';render();break;case 'guide':SCREEN='guide';render();break;
 case 'fight':if(SCREEN==='help'&&F&&!F.over){SCREEN='fight';render()}else startFight();break;
 case 'sfx':PREFS.sfx=!PREFS.sfx;savePrefs();render();break;case 'fast':PREFS.fast=!PREFS.fast;savePrefs();render();break;
 case 'clear':if(confirm('Clear all progress, field guide and notes?')){localStorage.removeItem('cc_meta');location.reload()}break;
 case 'deck':DECKOPEN=true;render();break;case 'closedeck':DECKOPEN=false;render();break;
 case 'concede':if(F&&!F.over&&confirm('Withdraw from this fight? The run ends.')){F.over=true;F.won=false;render()}break;
 case 'fightover':fightOver();break;case 'skipclean':nextLevel();render();break}}
function onKey(e){if(e.key==='Escape'){if(DECKOPEN){DECKOPEN=false;render();return}if(SEL){SEL=null;render()}return}if(SCREEN==='fight'&&F&&!F.over&&F.active===F.p&&!AIBUSY&&(e.key===' '||e.key==='Enter')){e.preventDefault();endTurn()}}
function fit(){const st=stage(),w=innerWidth,h=innerHeight,sc=Math.min(w/1280,h/720);st.style.transform=`translate(${Math.floor((w-1280*sc)/2)}px,${Math.floor((h-720*sc)/2)}px) scale(${sc})`}

/* ---------- init ---------- */
window.addEventListener('resize',fit);fit();
stage().addEventListener('click',e=>{if(e.target.closest('#endturn')){if(F&&!F.over&&F.active===F.p&&!AIBUSY)endTurn();return}onClick(e)});
stage().addEventListener('mouseover',e=>{const el=e.target.closest('[data-card]');if(el&&!('ontouchstart' in window))showTip(el)});
stage().addEventListener('mouseout',e=>{const el=e.target.closest('[data-card]');if(el)hideTip()});
document.addEventListener('keydown',onKey);
render();
if(DEBUG){window.CC={get F(){return F},get G(){return G},get S(){return SCREEN},CARDS,BOSSES,SPECS,KW,NOTES,play,attack,endTurn,usePower,canPlay,canAttack,validTargets,attackTargets,needsTarget,newRun,startFight,fightOver,pickDraft,chooseSpec,removeCard,render,act,
 winFight(){F.e.hp=0;checkEnd();render()},setFast(v){window.CC_FAST=v}};}
</script>
<script data-goatcounter="https://labpotato.goatcounter.com/count"
        data-goatcounter-settings='{"path":"/tools/culture-clash"}'
        async src="//gc.zgo.at/count.js"></script>
</body>
