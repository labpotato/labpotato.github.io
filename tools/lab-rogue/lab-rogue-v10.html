<!DOCTYPE html>

<title>Lab Rogue v10</title>

<style>

* { box-sizing: border-box; font-variant-ligatures: none; }

#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#game { position: relative; }
#cv { width: 100%; height: 100%; display: block; outline: 4px solid #11141c; touch-action: none; }
#ui { position: absolute; inset: 0; display: none; overflow-y: auto; padding: 20px; background: rgba(3,4,6,.9); }

img.px { image-rendering: pixelated; }
.pf { font-family: "Silkscreen", monospace; }
h1 { font: 48px/1 "Silkscreen", monospace; margin: 0; letter-spacing: .02em; color: #e8eef5; text-shadow: 4px 4px 0 #1f6f8f; }
h2 { font: 24px/1.1 "Silkscreen", monospace; margin: 0 0 6px; }
h3 { font: 13px "Silkscreen", monospace; color: var(--muted); margin: 20px 0 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.lbl { font: 12px "Silkscreen", monospace; color: var(--muted); }

.btn:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--acc), 0 4px 0 #05060a; color: #fff; }

.card.sel { box-shadow: inset 0 0 0 2px var(--gold); }
.card.lock { cursor: not-allowed; opacity: .5; }
.card b { display: block; font: 15px "Silkscreen", monospace; margin-bottom: 4px; }
.card .d { color: var(--muted); font-size: 16px; display: block; }
.card .k { position: absolute; top: 10px; right: 12px; }
.card img.port { width: 72px; height: 96px; image-rendering: pixelated; display: block; margin-bottom: 6px; }
.tag { display: inline-block; font: 11px "Silkscreen", monospace; padding: 2px 6px; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); margin: 4px 4px 0 0; }
.stat { box-shadow: inset 0 0 0 2px var(--line); padding: 8px 10px; background: var(--p0); }
.stat b { display: block; font: 18px "Silkscreen", monospace; } .stat span { font: 11px "Silkscreen", monospace; color: var(--muted); }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.ic { aspect-ratio: 1; box-shadow: inset 0 0 0 2px var(--line); background: var(--p0); display: grid; place-items: center; position: relative; }
.ic img { width: 80%; height: 80%; image-rendering: pixelated; }
.ic.unk { color: var(--faint); font: 14px "Silkscreen", monospace; }
.ic.new::after { content: "NEW"; position: absolute; top: -6px; right: -4px; font: 9px "Silkscreen", monospace; background: var(--gold); color: #000; padding: 1px 3px; }

.ent b { display: block; font: 13px "Silkscreen", monospace; } .ent span { color: var(--muted); font-size: 15px; }
.ent.syn { box-shadow: inset 0 0 0 2px #6b5a1f; background: #14110a; } .ent.syn b { color: var(--gold); }
.pair { display: flex; gap: 2px; align-items: center; color: var(--gold); }

.tabs { display: flex; gap: 6px; margin: 10px 0 14px; }
.tabs button { font: 12px "Silkscreen", monospace; background: var(--p1); color: var(--muted); border: 0; box-shadow: inset 0 0 0 2px var(--line); padding: 8px 12px; cursor: pointer; }
.tabs button.on { color: var(--text); box-shadow: inset 0 0 0 2px var(--acc); }
.hr { height: 2px; background: var(--line); margin: 16px 0; }
.card.ins { text-align: center; padding: 18px 12px 14px; box-shadow: inset 0 0 0 2px var(--c, var(--line)), 0 6px 0 #05060a; transition: transform .08s; }
.card.ins:hover { transform: translateY(-4px); }
.card.ins b { font-size: 14px; margin: 6px 0; }
.card.ins .d { font-size: 17px; color: var(--text); margin-top: 6px; }
.card.evo { --c: #ffd166; background: #1c1708; animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: inset 0 0 0 2px #ffd166, 0 0 24px rgba(255,209,102,.45), 0 6px 0 #05060a; } }
.card.evo .pair { justify-content: center; margin: 6px 0; } .card.evo .pair img { width: 44px; height: 44px; }
.ui-ic { width: 56px; height: 56px; display: block; margin: 0 auto; }
.pips { display: flex; gap: 4px; justify-content: center; margin: 6px 0 2px; } .pips i { width: 12px; height: 8px; background: #2a3142; display: block; }
.pips i.on { background: var(--c, var(--gold)); } .pips i.nx { background: #fff; animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.card.evopt { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; }
.card.evopt .key { font: 22px "Silkscreen", monospace; color: var(--gold); text-align: center; }
.big-cite { font: 34px "Silkscreen", monospace; color: var(--gold); text-shadow: 3px 3px 0 #6b5a1f; }
.bench { display: grid; grid-template-columns: 360px 1fr; gap: 18px; margin-top: 10px; }
.rack { display: grid; grid-template-columns: repeat(5, 62px); gap: 6px; padding: 12px; background: #2a1e14; box-shadow: inset 0 0 0 3px #4a3420; width: max-content; }
.slot { width: 62px; height: 62px; display: grid; place-items: center; background: #0b0d12; border: 0; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; }
.slot:hover { box-shadow: inset 0 0 0 2px var(--acc); } .slot.sel { box-shadow: inset 0 0 0 3px var(--gold); background: #1c1708; }

.tube { position: relative; display: block; width: 18px; height: 46px; background: rgba(232,238,245,.12); box-shadow: inset 0 0 0 2px #c9d2dc; border-radius: 0 0 10px 10px; }
.tube i { position: absolute; left: 3px; right: 3px; bottom: 3px; background: var(--c); border-radius: 0 0 7px 7px; height: 30%; }
.tube.t2 i { height: 60%; box-shadow: 0 0 10px var(--c); } .tube.t3 i { height: 88%; box-shadow: 0 0 18px var(--c); animation: glow3 1s infinite alternate; }

.tube b { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 10px "Silkscreen", monospace; color: var(--gold); }
.tube.empty { opacity: .15; } .rackmini { display: flex; gap: 6px; flex-wrap: wrap; } .rackmini .tube { width: 14px; height: 38px; }
.kbox { display: grid; grid-template-columns: repeat(3, 96px); gap: 8px; padding: 10px; background: #1a1e28; box-shadow: inset 0 0 0 3px #2a3142; width: max-content; }
.kcell { width: 96px; height: 96px; position: relative; display: grid; place-items: center; background: #0b0d12; border: 0; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; }
.kcell img { width: 64px; height: 64px; image-rendering: pixelated; } .kcell.nb { box-shadow: inset 0 0 0 2px #5ab4e0; background: #0f1a24; }
.kcell:hover { box-shadow: inset 0 0 0 2px var(--acc); } .kcell.sel { box-shadow: inset 0 0 0 3px var(--gold); background: #1c1708; } .kcell.pop { animation: pop .5s; }

.event-new { margin-top: 12px; padding: 12px 14px; box-shadow: inset 0 0 0 2px #6b5a1f; background: #14110a; color: #ffe8a8; font-size: 17px; }

.pocket { position: relative; background: #e8e2d4; box-shadow: inset 0 0 0 3px #b8b0a0, 0 0 0 4px #4a4436; border-radius: 4px 4px 16px 16px; }
.pocket s { position: absolute; box-shadow: inset 0 0 0 1px rgba(80, 70, 50, .25); }
.pocket s.torn { background: repeating-linear-gradient(45deg, #2a2620 0 4px, #3a352c 4px 8px); }
.pki { position: absolute; cursor: grab; touch-action: none; }
.pki i { position: absolute; display: block; border-radius: 3px; }
.pki img { position: absolute; width: 44px; height: 44px; pointer-events: none; image-rendering: pixelated; }
.pki .lv { position: absolute; right: 5px; bottom: 3px; font: 12px "Silkscreen", monospace; color: #fff; text-shadow: 2px 2px 0 #000; pointer-events: none; }
.pki .sl { position: absolute; left: 4px; top: 3px; font: 12px "Silkscreen", monospace; background: #ffe14d; color: #000; padding: 0 4px; pointer-events: none; }
.pki.sel i { outline: 2px solid #ffe14d; }
.pki.lnk i { filter: drop-shadow(0 0 6px #4ff0ff); }
.pslot { width: 64px; height: 64px; display: grid; place-items: center; background: #0b0d12; box-shadow: inset 0 0 0 2px var(--line); position: relative; }
.pslot b { position: absolute; left: 5px; top: 3px; font: 12px "Silkscreen", monospace; color: #ffe14d; }
.pslot img { width: 44px; height: 44px; image-rendering: pixelated; }
.pslot.scrap { box-shadow: inset 0 0 0 2px #6b2a2a; } .pslot.scrap b { color: #ff6b6b; }
#pkghost { position: fixed; pointer-events: none; z-index: 99; display: none; }
#pkghost i { position: absolute; display: block; outline: 2px solid #fff; }
#pkghost img { position: absolute; left: 4px; top: 4px; image-rendering: pixelated; }
.lvls div { font-size: 14px; color: var(--faint); padding: 2px 0; } .lvls div.on { color: var(--text); }
.abg { border-collapse: collapse; } .abg td, .abg th { padding: 3px 7px; border-bottom: 1px solid var(--line); font: 11px "Silkscreen", monospace; }
.dz { margin-top: 6px; font-size: 15px; color: #c9d2dc; } .dz i { font: 10px "Silkscreen", monospace; font-style: normal; color: #8fe3ff; margin: 0 4px 0 8px; }
.vol { gap: 18px; margin-top: 12px; } .vol label { font: 12px "Silkscreen", monospace; color: var(--muted); display: flex; gap: 8px; align-items: center; } .vol input { accent-color: #5ab4e0; width: 140px; }
@media (max-width: 860px) { .pocketwrap { grid-template-columns: 1fr; } }
</style>
</head>
