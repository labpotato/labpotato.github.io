<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protein Quant — Lab Potato</title>
<meta name="description" content="Protein concentration and yield from A280 or a standard curve, for several proteins at once, in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%2722 46 208 144%27%3E%3Cpath d=%27M28 118C26 88 52 64 88 56C124 48 168 52 196 70C220 86 226 112 216 136C204 164 168 182 128 184C88 186 50 172 36 148C30 138 28 128 28 118Z%27 fill=%27%23cd9050%27/%3E%3C/svg%3E">
<style>
  :root{
    /* Lab Potato homepage tokens (assets/styles.css), same as Lab Entry and Cryobox */
    --paper:#fcfbf9; --card:#fff; --ink:#16181d; --ink-2:#3d424b; --ink-3:#5d636d;
    --line:#e6e5e1; --line-2:#d6d4ce;
    --blue:#0a5fd0; --blue-d:#0850b1; --blue-l:#e8f0fc;
    --green:#0f9d76; --green-l:#e5f5f0; --green-d:#0b5c45;
    --amber:#b7791f; --amber-l:#fdf3e2; --amber-d:#6b4510;
    --red:#d1495b; --red-l:#fbeaec; --red-d:#8a1f2e;
    --violet:#7c5cd6; --violet-l:#f1edfc;
    --brand-ink:#1d2433;
    --calc:#f6f7f9; --sel:rgba(10,95,208,.10); --selb:#0a5fd0;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --sh:0 1px 2px rgba(20,24,32,.04),0 6px 18px rgba(20,24,32,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{--paper:#0f1115; --card:#181b21; --ink:#f1f2f4; --ink-2:#c3c7ce; --ink-3:#9aa0a9;
      --line:#2b3038; --line-2:#3a404a;
      --blue:#5b9dff; --blue-d:#8cbaff; --blue-l:#16233a;
      --green:#3fcf9f; --green-l:#11281f; --green-d:#7fe0bd;
      --amber:#f0b95a; --amber-l:#2a2112; --amber-d:#f5d9a6;
      --red:#f07a8a; --red-l:#2d161b; --red-d:#f7a9b3;
      --violet:#b39dff; --violet-l:#221c36;
      --brand-ink:#f1f2f4; --calc:#14171c; --sel:rgba(91,157,255,.16); --selb:#5b9dff;
      --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;display:flex;flex-direction:column;overflow:hidden}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--blue)}
  kbd{font:600 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--card);color:var(--ink-2)}

  /* ---- Lab Potato site header (same as Lab Entry and Cryobox) ---- */
  .site-header{position:relative;z-index:70;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;flex:0 0 auto;
    background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;color:inherit;text-decoration:none}
  .brand-mark{width:26px;height:26px;display:block;overflow:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .brand:hover .brand-mark{transform:rotate(-8deg) scale(1.08)}
  .brand-word{font-size:15px;font-weight:680;letter-spacing:-.035em;color:var(--brand-ink)}
  .brand-sep{color:var(--ink-3);font-weight:300}
  .brand-tool{font-size:15px;font-weight:560;letter-spacing:-.025em;white-space:nowrap}
  .ver-chip{font-size:10.5px;font-weight:640;letter-spacing:.02em;padding:2.5px 7px;border-radius:999px;background:var(--blue-l);color:var(--blue);
    border:1px solid color-mix(in srgb,var(--blue) 22%,transparent)}
  .header-spacer{flex:1}
  .all-tools{font-size:12.5px;color:var(--ink-3);text-decoration:none;white-space:nowrap}
  .all-tools:hover{color:var(--ink)}
  .status{font-size:12px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
  .status.busy::before{background:var(--amber)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:560;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,color .15s}
  .btn:hover{background:var(--paper);border-color:var(--ink-3)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:15px;height:15px;flex:0 0 auto}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
  .btn.ghost{border-color:transparent;background:none}
  .btn.ghost:hover{background:var(--line)}
  .btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
  .btn.danger:hover{background:var(--red-l)}
  .btn.small{padding:4px 9px;font-size:12.5px}
  .btn:disabled{opacity:.4;cursor:default;transform:none}
  .btn.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}

  /* method switch, like the view switches in the other tools */
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:2px;background:var(--card);gap:2px}
  .seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:560;color:var(--ink-2);white-space:nowrap}
  .seg button.on{background:var(--blue);color:#fff}
  .seg button:not(.on):hover{background:var(--paper)}

  .menu-wrap{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:90;width:330px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 14px 40px rgba(20,24,32,.2);padding:6px}
  .menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:560}
  .menu button svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--ink-3)}
  .menu button small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:450;line-height:1.35}
  .menu button:hover{background:var(--blue-l)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
  .menu .danger,.menu .danger svg{color:var(--red)}
  .menu .danger:hover{background:var(--red-l)}

  /* ---- settings bar under the header ---- */
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:48px;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
  .bar label{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .bar select,.bar input[type=text]{border:1px solid var(--line-2);border-radius:8px;background:var(--card);padding:4px 8px;font-size:13px;color:var(--ink)}
  .bar .sep{width:1px;height:22px;background:var(--line)}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .stepper button{border:0;background:var(--card);width:26px;height:26px;font-size:15px;color:var(--ink-2)}
  .stepper button:hover{background:var(--paper)}
  .stepper b{min-width:24px;text-align:center;font-size:13px;color:var(--ink)}

  /* ---- layout: sheet on the left, results panel on the right (like Cryobox) ---- */
  /* golden ratio: sheet 61.8 % · panel 38.2 % */
  .app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 6px var(--pw,clamp(300px,calc((100vw - 6px) * .27),400px))}
  .main{min-width:0;min-height:0;overflow:auto;padding:16px 18px 40px}
  .split{cursor:col-resize;background:var(--line);position:relative}
  .split:hover,.split.drag{background:var(--blue)}
  .panel{min-height:0;overflow:auto;background:var(--card);border-left:1px solid var(--line);padding:16px 18px 40px}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .sec-h .sub{font-size:12px;font-weight:450;letter-spacing:0;text-transform:none;margin-left:auto}
  .sec-h .n{font:700 11px/1 var(--mono);color:var(--blue);background:var(--blue-l);border-radius:5px;padding:3px 6px;letter-spacing:0}
  .hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
  .main > .block{margin-bottom:22px}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0}
  .tools .grow{flex:1}

  /* ---- the sheet ---- */
  .sheet{position:relative;outline:none;border:1px solid var(--line-2);border-radius:10px;overflow:auto;background:var(--card);max-height:min(62vh,760px)}
  .sheet:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
  .sheet table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%;table-layout:fixed}
  .sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:30px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:middle}
  .sheet thead th{position:sticky;top:0;z-index:3;background:var(--paper);font-size:11.5px;font-weight:650;color:var(--ink-2);height:auto;padding:5px 8px;line-height:1.25;white-space:normal;cursor:pointer;user-select:none}
  .sheet thead tr.cl th{height:20px;padding:0 8px;font:600 10.5px/20px var(--mono);color:var(--ink-3);text-align:center}
  .sheet thead tr.hd th{top:20px}
  .sheet thead th small{display:block;font-weight:450;color:var(--ink-3);font-size:10.5px}
  .sheet thead th.calc{background:color-mix(in srgb,var(--violet-l) 70%,var(--paper))}
  .sheet thead th.calc.first{border-left:2px solid var(--violet)}
  .sheet .rn{position:sticky;left:0;z-index:2;width:38px;min-width:38px;text-align:center;background:var(--paper);color:var(--ink-3);font:600 11px var(--mono);padding:0;cursor:pointer;user-select:none}
  .sheet thead .rn{z-index:4}
  .sheet td.k-name{position:sticky;left:38px;z-index:1;background:var(--card);font-weight:600;box-shadow:1px 0 0 var(--line)}
  .sheet thead th.k-name{left:38px;z-index:4}
  .sheet td{cursor:cell;user-select:none;background:var(--card)}
  .sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
  .sheet td.calc{background:var(--calc);color:var(--ink-2)}
  .sheet td.calc.first{border-left:2px solid var(--violet)}
  .sheet td.calc.big{color:var(--ink);font-weight:650}
  .sheet td.ph{color:var(--ink-3);font-style:italic}
  .sheet td.sel{background:var(--sel)}
  .sheet td.calc.sel{background:color-mix(in srgb,var(--sel) 100%,var(--calc))}
  .sheet td.act{box-shadow:inset 0 0 0 2px var(--selb)}
  .sheet tr.new td{background:color-mix(in srgb,var(--green-l) 55%,var(--card))}
  .sheet tr.new td.k-name{color:var(--ink-3);font-style:italic;font-weight:450}
  .sheet tr.new td.calc{background:color-mix(in srgb,var(--green-l) 30%,var(--calc))}
  .sheet tr.new td.sel{background:var(--sel)}
  .sheet tr.cur .rn{color:var(--blue);background:var(--blue-l)}
  .sheet tr.rsel .rn{background:var(--blue);color:#fff}
  .sheet th.csel{background:var(--blue-l);color:var(--blue)}
  .sheet .ed{position:absolute;z-index:6;border:2px solid var(--selb);border-radius:2px;padding:0 6px;background:var(--card);font-size:13px;outline:none;box-shadow:0 4px 14px rgba(20,24,32,.18)}
  .sheet select.ed{padding:0 2px}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:620;line-height:18px}
  .t-low{background:var(--amber-l);color:var(--amber-d)} .t-typical{background:var(--blue-l);color:var(--blue)}
  .t-high,.t-veryhigh{background:var(--green-l);color:var(--green-d)} .t-impressive{background:var(--violet-l);color:var(--violet)}
  .t-impossible{background:var(--red-l);color:var(--red-d)}
  .fl-err{color:var(--red)} .fl-warn{color:var(--amber)}
  td .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  td .seqchip{font:600 11px var(--mono);color:var(--violet);background:var(--violet-l);border-radius:5px;padding:2px 6px}
  .sheet .rx{display:none;position:absolute;left:2px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:0;border-radius:4px;background:none;color:var(--red);font-size:13px;line-height:16px;padding:0}
  .sheet tr:not(.new):hover .rn .rx{display:block}
  .sheet tr:not(.new):hover .rn .rnn{visibility:hidden}
  .sheet .rn{position:sticky}
  .sheet .rn > span{position:relative}

  /* ---- results panel ---- */
  .panel .card{padding:12px 14px;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
  .kv dt{color:var(--ink-3)} .kv dd{font-variant-numeric:tabular-nums}
  .big-n{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .big-n small{font-size:14px;font-weight:560;color:var(--ink-3);margin-left:4px}
  .flags{list-style:none;display:grid;gap:4px;font-size:12.5px;margin-top:8px}
  .flags li{padding:5px 8px;border-radius:7px;background:var(--paper)}
  .flags li.err{background:var(--red-l);color:var(--red-d)} .flags li.warn{background:var(--amber-l);color:var(--amber-d)}
  .chart{width:100%;height:auto;display:block}
  .chart text{font-family:var(--sans);fill:var(--ink-2)}
  .chart .ax{stroke:var(--line-2)} .chart .gl{stroke:var(--line);stroke-dasharray:2 3}
  .chart .bar{fill:var(--blue)} .chart .bar.y{fill:var(--green)} .chart .err{stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}.chart .err-h{stroke:var(--card);stroke-width:3.4;stroke-linecap:round;opacity:.9}
  .chart .bar.cur{fill:var(--violet)}
  .chart .fit{stroke:var(--blue);stroke-width:2;fill:none} .chart .std{fill:var(--blue)} .chart .smp{fill:var(--violet)} .chart .out{fill:none;stroke:var(--red);stroke-width:1.6}
  .units{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .units div{background:var(--paper);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ink-3)}
  .units b{display:block;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .empty{padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
  .eq{font:600 13px var(--mono);background:var(--paper);border-radius:8px;padding:8px 10px;margin:8px 0}

  /* ---- help ---- */
  details.help{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  details.help > summary{cursor:pointer;padding:12px 16px;font-weight:620;font-size:13.5px}
  .helpbody{padding:0 18px 16px;font-size:13px;color:var(--ink-2);max-width:86ch}
  .helpbody h4{margin:14px 0 4px;font-size:13.5px;color:var(--ink)}
  .helpbody p{margin:4px 0}
  .helpbody code{font:12px var(--mono);background:var(--paper);padding:1px 5px;border-radius:4px}
  .helpbody ul{list-style:none;margin-top:12px;font-size:12px;display:grid;gap:3px}
  .wm{margin-top:18px;font-size:11.5px;color:var(--ink-3)}

  /* ---- dialog and toast (same as the other tools) ---- */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(15,17,21,.35);display:grid;place-items:center;padding:20px}
  .dlg{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
  .dlg.wide{width:min(820px,100%)}
  .dlg-h{padding:14px 18px 6px;font-size:16px;font-weight:680}
  .dlg-b{padding:6px 18px 12px;font-size:13.5px;color:var(--ink-2)}
  .dlg-b p{margin:6px 0}
  .dlg-b textarea{width:100%;min-height:160px;border:1px solid var(--line-2);border-radius:8px;padding:8px;font:12.5px var(--mono);background:var(--paper)}
  .dlg-f{display:flex;gap:8px;align-items:center;padding:10px 18px 16px}
  .dlg-f .grow{flex:1}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:110;display:flex;align-items:center;gap:12px;background:#1d2433;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:min(720px,92vw)}
  .toast button{border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;padding:4px 10px;font-weight:600}
  .toast button:hover{background:rgba(255,255,255,.25)}

  .toast[hidden],.menu[hidden]{display:none}
  @media (max-width:1560px){.site-header .lbl,.seg .long,.all-tools span,.site-header .status{display:none}.site-header{gap:7px}}
  @media (max-width:1100px) and (min-width:901px){.app{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto;display:block;flex:1}.split{display:none}.panel{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-content:start}.panel>.sec-h{grid-column:1/-1}.panel .card{margin:0}.main{overflow:visible}}
  .bar select{max-width:100%}
  @media (max-width:900px){
    .app{display:block;flex:none;overflow:visible}
    .bar label{white-space:normal;flex-wrap:wrap;max-width:100%}
    .bar select{max-width:calc(100vw - 40px)}
    .split{display:none}
    .panel{border-left:0;border-top:1px solid var(--line)}
    body{overflow:auto} .main{overflow:visible}
    .site-header{flex-wrap:wrap;height:auto;padding:8px 12px}
  }

  /* ================= v6 cards: one per protein, room to breathe ================= */
  .main{padding:20px 24px 60px}
  .sec-h.big{font-size:12.5px;margin:6px 0 12px}
  .hero-card{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;padding:22px 26px;margin-bottom:22px}
  .hero-card h2{font-size:21px;letter-spacing:-.02em;margin-bottom:6px}
  .hero-card p{color:var(--ink-2);font-size:14px;max-width:56ch}
  .hero-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .pcard{container-type:inline-size;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:14px;box-shadow:var(--sh);margin-bottom:16px;transition:box-shadow .2s}
  .pcard:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 35%,transparent),var(--sh)}
  .pcard.flash{animation:flash 1.1s ease}
  @keyframes flash{0%,100%{box-shadow:var(--sh)}30%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 55%,transparent)}}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 14px 10px 16px;border-bottom:1px solid var(--line)}
  .pcard.folded .ch{border-bottom:0}
  .swatch{width:12px;height:12px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .in{border:1px solid var(--line-2);border-radius:9px;background:var(--card);padding:7px 10px;font-size:14px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
  .in:hover{border-color:var(--ink-3)}
  .in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
  .in::placeholder{color:color-mix(in srgb,var(--ink-3) 75%,transparent)}
  .in:disabled{opacity:.55}
  select.in{padding:7px 8px}
  .in.name{font-size:16px;font-weight:650;border-color:transparent;background:none;padding:5px 8px;flex:1}
  .in.name:hover{border-color:var(--line-2)}
  .sum{font-size:13px;color:var(--ink-2);white-space:nowrap}
  .sum b{font-size:15px;color:var(--ink)}
  .ch-b{display:flex;gap:2px}
  .ib{border:0;background:none;width:30px;height:30px;border-radius:8px;color:var(--ink-3);font-size:15px;display:grid;place-items:center}
  .ib:hover{background:var(--paper);color:var(--ink)}
  .ib.del:hover{background:var(--red-l);color:var(--red)}
  .ib.sm{width:26px;height:26px;font-size:14px}
  .cb{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
  .grps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:16px 18px 18px}

  /* ---------- live culture dish (from v5) ---------- */
  .critter-stage{position:relative;width:250px;height:150px;border-radius:14px;overflow:hidden;
    background:radial-gradient(120% 110% at 50% 100%,#eaf6f0 0%,#dbeee6 60%,#cde7dd 100%);border:2px solid #fff;box-shadow:var(--sh);transition:background .5s ease}
  .critter-stage.earth-mode{background:radial-gradient(120% 120% at 50% 45%,#17223c 0%,#0b1425 60%,#060b16 100%)}
  .critter-stage.galaxy-mode{background:radial-gradient(120% 120% at 50% 50%,#1c1131 0%,#120a22 55%,#06030d 100%)}
  .critter-bug{position:absolute;bottom:9px;left:50%;width:96px;transform:translateX(-50%);animation:rock 4.4s ease-in-out infinite;transform-origin:50% 90%;z-index:3}
  .critter-bug.centred{bottom:auto;top:50%;width:54px;transform:translate(-50%,-50%);z-index:5;animation:rockC 3.4s ease-in-out infinite}
  @keyframes rock{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg) translateY(-2px)}}
  @keyframes rockC{0%,100%{transform:translate(-50%,-50%) rotate(-6deg)}50%{transform:translate(-50%,-50%) rotate(6deg)}}
  .critter-bug svg{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 3px rgba(30,55,80,.18))}
  .critter-bug.host-yeast{width:80px} .critter-bug.host-yeast.centred{width:48px}
  .critter-bug.host-mammalian{width:88px} .critter-bug.host-mammalian.centred{width:52px}
  .critter-bug.host-plant{width:78px} .critter-bug.host-plant.centred{width:48px}
  .cpart{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .sh-circle{border-radius:50%} .sh-blob{border-radius:62% 38% 33% 67% / 60% 32% 68% 40%}
  .sh-hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)} .sh-tri{clip-path:polygon(50% 4%,4% 96%,96% 96%)} .sh-dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .cstar{position:absolute;border-radius:50%;background:#fff;pointer-events:none}
  .cearth{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 30%,#6fd6c9 0,#3fa8d9 38%,#1f6fae 68%,#12507f 100%);box-shadow:0 0 26px 4px rgba(90,180,220,.4)}
  .ccont{position:absolute;background:#4f9c6e;opacity:.8;border-radius:58% 42% 40% 60%/55% 35% 65% 45%}
  .cgal{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,240,200,.95) 0,rgba(220,160,255,.5) 18%,rgba(120,90,220,.22) 45%,transparent 72%);animation:spin 24s linear infinite}
  @keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .carm{position:absolute;left:50%;top:50%;width:100%;height:26%;margin-top:-13%;transform-origin:0 50%;border-radius:50%;background:radial-gradient(ellipse at 0 50%,rgba(190,150,255,.45) 0,rgba(120,180,255,.2) 42%,transparent 78%)}
  .ccap{position:absolute;left:5px;right:5px;top:6px;text-align:center;font-size:10px;line-height:1.25;color:#5b7f74;font-style:italic;pointer-events:none}
  .earth-mode .ccap,.galaxy-mode .ccap{color:#a8bbdd;top:auto;bottom:4px}
  @media (prefers-color-scheme: dark){.critter-stage{border-color:var(--line)}}
  @media (prefers-reduced-motion: reduce){.critter-bug,.critter-bug.centred,.cgal{animation:none}}

  /* each card picks its own layout from its own width, so nothing is squeezed */

  @media (max-width:700px){.grps,.grps .grp:last-child{grid-template-columns:1fr}.hero-card{grid-template-columns:1fr}.hero-card .pq-hero{display:none}.critter-stage{width:min(250px,80vw)}.main{padding:14px 12px 50px}.std-h,.std{grid-template-columns:18px 70px minmax(0,1fr) 26px}.std-h span:nth-child(4),.std-h span:nth-child(5),.std .sm-v{display:none}}

  /* ---- golden ratio everywhere: spacing 8 · 13 · 21 · 34, type 13 · 21 · 34, card = inputs 1.618 : result 1 ---- */
  :root{--g1:8px;--g2:13px;--g3:21px;--g4:34px}
  .main{padding:var(--g3) var(--g4) 55px}
  .panel{padding:var(--g3) var(--g3) 55px}
  .panel .card{padding:var(--g2) var(--g3);margin-bottom:var(--g2)}
  .pcard{margin-bottom:var(--g3);border-radius:13px}
  .ch{padding:var(--g2) var(--g3)}
  .in.name{font-size:21px;letter-spacing:-.02em}
  .cb{grid-template-columns:minmax(0,1.618fr) minmax(0,1fr)}
  .grps{gap:var(--g3);padding:var(--g3)}
  .grp{gap:var(--g2)}
  .res{padding:var(--g3);gap:var(--g2);border-radius:0 13px 13px 0}
  .r-big b{font-size:34px}
  .r-big span{font-size:13px}
  .hero-card{grid-template-columns:1.618fr 1fr;padding:var(--g4);gap:var(--g4);margin-bottom:var(--g3)}
  .hero-card h2{font-size:21px}
  .sec-h.big{margin:var(--g1) 0 var(--g2)}
  .stdcard{padding:var(--g3);gap:var(--g3);grid-template-columns:minmax(0,1.618fr) minmax(0,1fr)}
  .curve{max-width:none}
  /* the dish fills the result column, at the golden ratio */
  .res{min-height:100%}
  .dish{width:100%;flex:1;display:flex;flex-direction:column;gap:5px;min-height:160px}
  /* the stage is the cell itself: no box, its outline is the membrane */
  .culture{width:100%;flex:none;aspect-ratio:1.618;min-height:0;background:none;filter:drop-shadow(0 6px 10px rgba(20,24,32,.12))}
  .dish{justify-content:center}
  .culture canvas.pix{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .dish-t{font:600 11px var(--mono);letter-spacing:.02em;text-transform:none;color:var(--ink-3);text-align:center}
  @container (max-width:1070px){.grps{grid-template-columns:repeat(2,minmax(0,1fr))}.grps .grp:last-child{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--g2) var(--g3)}.grps .grp:last-child .gt{grid-column:1/-1}}
  @container (max-width:640px){.cb{grid-template-columns:1fr}.res{border-left:0;border-top:1px solid var(--line);border-radius:0 0 13px 13px}.dish{flex:none}.culture{flex:none;aspect-ratio:1.618}}
  @container (max-width:480px){.grps,.grps .grp:last-child{grid-template-columns:1fr}}
  @container (max-width:900px){.stdcard{grid-template-columns:1fr}}
  @media (max-width:700px){.main{padding:var(--g2) var(--g2) 50px}.hero-card{grid-template-columns:1fr;padding:var(--g3)}}

/* ---------- table view ---------- */
.viewseg{margin-left:auto;display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-size:12.5px}
.viewseg button{border:0;background:var(--card);padding:4px 12px;cursor:pointer;font:inherit;color:var(--ink-2)}.viewseg button.on{background:var(--blue);color:#fff}
.sheet-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:calc(100vh - 230px)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;table-layout:fixed}
.sheet th{position:sticky;top:0;z-index:1;background:var(--calc);font-size:11px;font-weight:650;color:var(--ink-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.sheet th.num{text-align:right}.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.sheet .sc{width:100%;min-width:44px;border:0;background:transparent;padding:6px 5px;font:inherit;font-size:12.5px;color:var(--ink);outline:none}.sheet .sc.num{text-align:right;font-variant-numeric:tabular-nums;min-width:48px;max-width:70px}
.sheet input.sc[data-sc$=":name"]{min-width:110px}.sheet select.sc{min-width:40px;max-width:76px;padding:5px 3px;appearance:none;-webkit-appearance:none;cursor:pointer}
.sheet td.chk{max-width:96px;overflow:hidden;text-overflow:ellipsis}
.sheet .sc:focus{background:var(--sel);box-shadow:inset 0 0 0 2px var(--selb)}
.sheet td.rn{background:var(--calc);color:var(--ink-3);font-size:10.5px;padding:0 3px;white-space:nowrap;text-align:center}.sheet td.rn i{display:block!important;margin:0 auto 2px!important}.sheet td.rn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sheet td.out,.sheet th.out{background:var(--calc);text-align:right;padding:6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}.sheet td.chk{text-align:left;font-size:12px;color:var(--ink-2)}.sheet td.chk.bad{color:var(--red)}
.sv-addr,.sv-del{border:1px solid var(--line-2);background:var(--card);border-radius:6px;cursor:pointer;font:inherit;line-height:1;padding:2px 7px;color:var(--ink-2)}.sv-del{border:0;background:none;font-size:16px;padding:2px 8px}.sv-del:hover{color:var(--red)}

.sheet .sc{min-width:0!important;max-width:none!important}.sheet .pair{display:flex}.sheet .pair .sc.num{flex:1}.sheet .pair select.sc.u{flex:0 0 38px;color:var(--ink-3);font-size:11.5px;text-align:left}
.sheet td.out.bad{color:var(--red)}.vd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--ink-3)}
.vd.v-low{background:#e0a458}.vd.v-typical{background:#60a5fa}.vd.v-high,.vd.v-veryhigh{background:#10b981}.vd.v-impressive{background:#8b5cf6}.vd.v-impossible{background:#ef4444}

.sheet th{overflow:hidden;text-overflow:ellipsis}.sheet td{overflow:hidden}

/* ---- round 5: smaller cards, and the culture flask replaces the pixel cell ---- */
:root{--g3:16px;--g4:26px}
.panel .card{padding:var(--g2) var(--g3)}
.in.name{font-size:18px}
.r-big b{font-size:28px}
.ch{padding:10px var(--g3)}
.grps{gap:var(--g2) var(--g3);padding:var(--g2) var(--g3)}
.res{padding:var(--g2) var(--g3);gap:var(--g1)}
.dish{min-height:120px;gap:3px}
.culture{aspect-ratio:1.3;filter:none;border-radius:10px;overflow:hidden}
.culture canvas{width:100%;height:100%;display:block}
.dish-t{font-size:10.5px}
.hero-card{padding:var(--g3);gap:var(--g3)}
@container (max-width:640px){.culture{aspect-ratio:1.3}}

.pq-hero{width:100%;max-width:360px;height:auto;justify-self:center;overflow:visible}
.pq-shadow{fill:var(--ink);opacity:.07}
.pq-machine{fill:var(--card);stroke:var(--line-2);stroke-width:2}
.pq-screen{fill:#16181d}
.pq-scrtxt{font:600 7px var(--mono);fill:#7dd3a8}
.pq-scrnum{font:700 11px var(--mono);fill:#a7f3d0}
.pq-slot{fill:var(--paper);stroke:var(--line-2);stroke-width:1.5}
.pq-knob{fill:var(--blue-l);stroke:var(--blue);stroke-width:1.5}
.pq-btn{fill:var(--blue-l)}
.pq-cuv{fill:rgba(255,255,255,.75);stroke:#94a3b8;stroke-width:1.5}
.pq-liquid{fill:#8b7cf6;opacity:.75}
.pq-bub{fill:#fff;opacity:0;animation:pqBub 2.6s ease-in infinite}
.pq-bub.d2{animation-delay:.9s}
.pq-bub.d3{animation-delay:1.7s}
.pq-glass{fill:rgba(255,255,255,.35);stroke:var(--ink-3);stroke-width:2.2;stroke-linejoin:round}
.pq-rim{stroke:var(--ink-3);stroke-width:3;stroke-linecap:round}
.pq-cap{fill:#e8d5b5;stroke:#b08a4e;stroke-width:1.5}
.pq-wave{fill:#8b7cf6;opacity:.55;animation:pqWave 3.6s linear infinite}
.pq-fbub{fill:#fff;opacity:0;animation:pqBub 3s ease-in infinite}
.pq-fbub.d2{animation-delay:1s}
.pq-fbub.d3{animation-delay:2s}
.pq-arc{fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-dasharray:3 5}
.pq-travel{fill:#8b7cf6}
.pq-mol{fill:#8b7cf6;opacity:.14;animation:pqDrift 9s ease-in-out infinite}
.pq-mol{transform:translate(118px,150px)}
.pq-mol.m2{animation-duration:11s;animation-delay:-4s}
.pq-mol.m3{animation-duration:13s;animation-delay:-8s}
.pq-n1{animation:pqSwapA 4s steps(1) infinite}
.pq-n2{animation:pqSwapB 4s steps(1) infinite}
.pq-spark{fill:#fbbf24;opacity:0;transform-box:fill-box;transform-origin:center;animation:pqSpark 2.8s ease-in-out infinite}
.pq-spark.d2{animation-delay:.9s}
.pq-spark.d3{animation-delay:1.8s}
.pq-beam{stroke-dasharray:5 5;animation:pqBeam .7s linear infinite}
.pq-glow{animation:pqGlow 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pq-flick{animation:pqFlick 2.4s steps(1) infinite}
.pq-fill{transform-box:fill-box;transform-origin:50% 100%;animation:pqFill .7s cubic-bezier(.3,1.4,.5,1) both}
.pq-pop{transform-box:fill-box;transform-origin:center;animation:pqPop .45s cubic-bezier(.3,1.6,.5,1) both}
.pq-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:pqDraw .9s ease-out .15s forwards}
@keyframes pqWave{to{transform:translateX(30px)}}
@keyframes pqDrift{0%{transform:translate(110px,160px) rotate(0)}50%{transform:translate(135px,60px) rotate(40deg)}100%{transform:translate(110px,160px) rotate(0)}}
@keyframes pqSwapA{0%{opacity:1}50%{opacity:0}}
@keyframes pqSwapB{0%{opacity:0}50%{opacity:1}}
@keyframes pqBub{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-28px)}}
@keyframes pqSpark{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes pqBeam{to{stroke-dashoffset:-10}}
@keyframes pqGlow{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.25);opacity:1}}
@keyframes pqFlick{0%{opacity:1}50%{opacity:.55}}
@keyframes pqFill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pqPop{from{transform:scale(0)}to{transform:scale(1)}}

<script>
"use strict";
/* ==================== PURE CORE START ==================== */
function sig(x, n){
  if (x === null || x === undefined || !isFinite(x)) return "—";
  if (x === 0) return "0";
  n = Math.max(1, Math.min(12, n|0));
  var mag = Math.floor(Math.log10(Math.abs(x)));
  var dec = n - 1 - mag;
  if (dec > 0) return x.toFixed(Math.min(dec, 15));
  var f = Math.pow(10, -dec);
  return String(Math.round(x / f) * f);
}
function toOneCm(a, lMM){ return a / (lMM / 10); }
function molarFromAbs(a1cm, eps, dilution){ return (a1cm * dilution) / eps; }
function mgmlFromMolar(molar, mw){ return molar * mw; }

function parseReadings(raw){
  var toks = String(raw || "").split(/[,;\s]+/).filter(function(t){ return t !== ""; });
  var values = [], invalid = [];
  toks.forEach(function(t){
    var v = parseFloat(t);
    if (isFinite(v) && /^-?[0-9.eE+-]+$/.test(t)) values.push(v); else invalid.push(t);
  });
  return { values: values, invalid: invalid };
}
function mean(arr){ if (!arr.length) return null; var s=0; for(var i=0;i<arr.length;i++) s+=arr[i]; return s/arr.length; }
function sampleSD(arr){
  if (arr.length < 2) return null;
  var m = mean(arr), s = 0;
  for (var i=0;i<arr.length;i++) s += (arr[i]-m)*(arr[i]-m);
  return Math.sqrt(s/(arr.length-1));
}

function molarToUnit(molar, unit, mw){
  switch(unit){
    case "M": return molar; case "mM": return molar*1e3; case "uM": return molar*1e6; case "nM": return molar*1e9;
    case "mgml": return (mw>0) ? molar*mw : null;
    case "ugml": return (mw>0) ? molar*mw*1000 : null;
    case "pct":  return (mw>0) ? (molar*mw)/10 : null;
    default: return null;
  }
}
function unitToMolar(v, unit, mw){
  switch(unit){
    case "M": return v; case "mM": return v/1e3; case "uM": return v/1e6; case "nM": return v/1e9;
    case "mgml": return (mw>0) ? v/mw : null;
    case "ugml": return (mw>0) ? (v/1000)/mw : null;
    case "pct":  return (mw>0) ? (v*10)/mw : null;
    default: return null;
  }
}
function massToMgPerMl(v, unit){
  switch(unit){ case "mgml": return v; case "ugml": return v/1000; case "pct": return v*10; default: return null; }
}
function volToL(v, unit){ return unit==="L" ? v : (unit==="mL" ? v/1e3 : v/1e6); }
function LtoUnit(L, unit){ return unit==="L" ? L : (unit==="mL" ? L*1e3 : L*1e6); }
var UNIT_LABEL = { M:"M", mM:"mM", uM:"µM", nM:"nM", mgml:"mg/mL", ugml:"µg/mL", pct:"% (w/v)" };

function stockVolumeL(cStockM, cTargetM, vTargetL){
  var out = { ok:false, flags:[] };
  if (!(cStockM > 0))  out.flags.push({t:"err", m:"Stock concentration must be greater than zero."});
  if (!(cTargetM >= 0)) out.flags.push({t:"err", m:"Target concentration cannot be negative."});
  if (!(vTargetL >= 0)) out.flags.push({t:"err", m:"Final volume cannot be negative."});
  if (out.flags.length) return out;
  if (cTargetM > cStockM){ out.flags.push({t:"err", m:"Target concentration is higher than the stock. Dilution cannot raise a concentration."}); return out; }
  var v1 = (cTargetM * vTargetL) / cStockM;
  out.ok = true; out.v1L = v1; out.remainderL = vTargetL - v1;
  if (v1 > 0 && v1 < 1e-9) out.flags.push({t:"warn", m:"Required stock volume is below 1 nL and cannot be pipetted; prepare an intermediate dilution first."});
  return out;
}

function computeRow(row, pathMM){
  var out = { ok:false, flags:[] };
  var epsType = (row.epsType === "molar" || row.epsType === "e1pct") ? row.epsType : "mass01";
  var eps = row.eps, mw = row.mw;
  var dil = (row.dil===undefined||row.dil===null||row.dil==="") ? 1 : row.dil;
  var parsed = parseReadings(row.a280raw);

  if (!(eps > 0)) out.flags.push({t:"err", m:"Extinction coefficient must be a positive number."});
  if (epsType === "molar" && !(mw > 0)) out.flags.push({t:"err", m:"MW is required when ε is entered as a molar extinction coefficient (M⁻¹cm⁻¹)."});
  if (mw !== null && mw !== undefined && !(mw > 0)) out.flags.push({t:"err", m:"MW must be a positive number if entered."});
  if (!(dil > 0)) out.flags.push({t:"err", m:"Dilution must be a positive number."});
  if (!(pathMM > 0)) out.flags.push({t:"err", m:"Path length must be a positive number."});
  if (!parsed.values.length) out.flags.push({t:"err", m:"Enter at least one A280 reading."});
  if (parsed.invalid.length) out.flags.push({t:"warn", m:"Ignored unreadable token(s): " + parsed.invalid.join(", ")});
  if (out.flags.some(function(f){return f.t==="err";})) { out.parsed = parsed; return out; }

  var m = mean(parsed.values);
  var sd = sampleSD(parsed.values);
  var a1cm = toOneCm(m, pathMM);
  if (a1cm < 0) out.flags.push({t:"err", m:"Mean A280 is negative."});
  if (out.flags.some(function(f){return f.t==="err";})) { out.parsed = parsed; return out; }

  if (m < 0.02) out.flags.push({t:"warn", m:"Mean A280 as read is " + sig(m,2) + ", below 0.02: weak signal, noise-dominated."});
  if (m > 1.5)  out.flags.push({t:"warn", m:"Mean A280 as read is " + sig(m,2) + ", above 1.5: likely outside instrument linearity."});

  var molar, mgml;
  if (epsType === "molar"){
    molar = molarFromAbs(a1cm, eps, dil);
    mgml = mgmlFromMolar(molar, mw);
  } else if (epsType === "mass01"){
    /* eps is A(0.1%): the absorbance of a 1 mg/mL (1 g/L) solution at 1 cm.
       c(mg/mL) = A1cm x dilution / A(0.1%). MW is only needed to also report molar units. */
    mgml = (a1cm * dil) / eps;
    molar = (mw > 0) ? mgml / mw : null;
    if (mw === null || mw === undefined) out.flags.push({t:"info", m:"No MW entered: mass-based units (mg/mL, µg/mL, % w/v) are available; molar units are not."});
  } else {
    /* eps is E(1%): the absorbance of a 1% w/v (10 mg/mL) solution at 1 cm.
       E(1%) = 10 x A(0.1%), so c(mg/mL) = 10 x A1cm x dilution / E(1%). */
    mgml = 10 * (a1cm * dil) / eps;
    molar = (mw > 0) ? mgml / mw : null;
    if (mw === null || mw === undefined) out.flags.push({t:"info", m:"No MW entered: mass-based units (mg/mL, µg/mL, % w/v) are available; molar units are not."});
  }

  out.ok = true;
  out.n = parsed.values.length; out.meanA280 = m; out.sdA280 = sd; out.a1cm = a1cm;
  out.molar = molar; out.mgml = mgml; out.epsType = epsType;
  out.parsed = parsed;
  return out;
}

function linreg(points){
  var out = { ok:false, flags:[] };
  var pts = (points || []).filter(function(p){ return isFinite(p.x) && isFinite(p.y); });
  if (pts.length < 2){ out.flags.push({t:"err", m:"At least two standard points with a readable concentration and absorbance are needed."}); return out; }
  var n = pts.length, sumX=0,sumY=0,sumXY=0,sumXX=0;
  pts.forEach(function(p){ sumX+=p.x; sumY+=p.y; sumXY+=p.x*p.y; sumXX+=p.x*p.x; });
  var denom = n*sumXX - sumX*sumX;
  if (Math.abs(denom) < 1e-12){ out.flags.push({t:"err", m:"Standard concentrations must not all be identical."}); return out; }
  var slope = (n*sumXY - sumX*sumY) / denom;
  var intercept = (sumY - slope*sumX) / n;
  var meanY = sumY / n, ssTot=0, ssRes=0;
  pts.forEach(function(p){ var yhat = slope*p.x + intercept; ssTot += (p.y-meanY)*(p.y-meanY); ssRes += (p.y-yhat)*(p.y-yhat); });
  var r2 = ssTot > 0 ? (1 - ssRes/ssTot) : 1;
  out.ok = true; out.slope = slope; out.intercept = intercept; out.r2 = r2; out.n = n;
  out.xMin = Math.min.apply(null, pts.map(function(p){return p.x;}));
  out.xMax = Math.max.apply(null, pts.map(function(p){return p.x;}));
  out.points = pts;
  if (Math.abs(slope) < 1e-12){ out.ok = false; out.flags.push({t:"err", m:"Fitted slope is zero; cannot invert the curve to compute concentration."}); return out; }
  if (r2 < 0.99) out.flags.push({t:"warn", m:"R² is " + sig(r2,4) + ", below the 0.99 linearity benchmark used in published assay-validation work."});
  return out;
}

function concFromCurve(fit, aMean, dil){
  var out = { ok:false, flags:[] };
  if (!fit || !fit.ok){ out.flags.push({t:"err", m:"Standard curve is not valid yet."}); return out; }
  var d = (dil===undefined||dil===null||dil==="") ? 1 : dil;
  if (!(d > 0)) { out.flags.push({t:"err", m:"Dilution must be a positive number."}); return out; }
  var c = invertCurve(fit, aMean);
  if (c === null || !isFinite(c)){ out.flags.push({t:"err", m:"This absorbance is above the top of the fitted curve, so no concentration matches it. Dilute the sample and re-read."}); return out; }
  var cActual = c * d;
  out.ok = true; out.cMeasured = c; out.cActual = cActual;
  if (c < fit.xMin || c > fit.xMax) out.flags.push({t:"warn", m:"Concentration " + sig(c,4) + " falls outside the standard range (" + sig(fit.xMin,3) + "–" + sig(fit.xMax,3) + "): this is an extrapolation."});
  if (c < 0) out.flags.push({t:"warn", m:"Computed concentration (before dilution) is negative: the sample's absorbance is below the lowest standard."});
  return out;
}
/* -------- Yield: total amount from concentration x volume, optional % recovery -------- */
function computeYield(mgPerMl, molarM, volumeL){
  var out = { ok:false, flags:[] };
  if (!(volumeL > 0)) { out.flags.push({t:"err", m:"Total volume must be greater than zero."}); return out; }
  if (mgPerMl === null && molarM === null) { out.flags.push({t:"err", m:"Selected stock has no usable concentration."}); return out; }
  out.ok = true;
  out.massMg = (mgPerMl !== null) ? mgPerMl * LtoUnit(volumeL,"mL") : null;
  out.molarMol = (molarM !== null) ? molarM * volumeL : null;
  return out;
}
function recoveryPercent(yieldMassMg, yieldMolarMol, startVal, startUnit){
  var out = { ok:false, flags:[] };
  if (!(startVal > 0)) { out.flags.push({t:"err", m:"Starting amount must be greater than zero."}); return out; }
  var pct;
  if (startUnit === "mg" || startUnit === "ug"){
    if (yieldMassMg === null) { out.flags.push({t:"err", m:"Mass-based recovery needs a mass yield for this stock."}); return out; }
    var startMg = (startUnit === "ug") ? startVal/1000 : startVal;
    pct = (yieldMassMg / startMg) * 100;
  } else {
    if (yieldMolarMol === null) { out.flags.push({t:"err", m:"Molar recovery needs a molecular weight for this stock."}); return out; }
    var startMol = (startUnit === "nmol") ? startVal*1e-9 : startVal*1e-6;
    pct = (yieldMolarMol / startMol) * 100;
  }
  out.ok = true; out.pct = pct;
  if (pct > 100) out.flags.push({t:"warn", m:"Recovery is over 100% (" + sig(pct,3) + "%): check the starting amount and units, since purification cannot increase total protein."});
  return out;
}
/* Normalise a total yield against a reference volume (e.g. starting culture volume), giving a
   production rate like "mg protein per L culture" rather than just a total amount. refVolumeL and
   the total amount must already be in compatible bases (mass in mg, or moles in mol); the division
   is dimension-preserving, so the result is amount per litre of the *reference* volume, not per litre
   of the sample itself. */
function yieldPerVolume(totalMass, totalMolar, refVolumeL){
  var out = { ok:false, flags:[] };
  if (!(refVolumeL > 0)) { out.flags.push({t:"err", m:"Reference volume must be greater than zero."}); return out; }
  if (totalMass === null && totalMolar === null) { out.flags.push({t:"err", m:"No yield available to normalise."}); return out; }
  out.ok = true;
  out.massMgPerL = (totalMass !== null) ? totalMass / refVolumeL : null;
  out.molarMolPerL = (totalMolar !== null) ? totalMolar / refVolumeL : null;
  return out;
}
/* Expression hosts, with yield benchmarks taken from the literature for each.
   A yield that is excellent in a plant cell suspension is mediocre in CHO, so the
   verdict has to be host-specific or it is simply wrong. All thresholds in mg per
   litre of culture. "ceiling" is the point above which the number is not physically
   achievable for that host and almost certainly indicates a unit error.
   Sources are listed in the Help panel. */
var HOSTS = {
  ecoli: {
    label: "E. coli", short: "E. coli",
    low:10, typical:100, high:500, veryhigh:10000, ceiling:100000,
    typicalNote:"Normal shake-flask range for a soluble cytoplasmic protein.",
    highNote:"Optimised shake flask.",
    veryNote:"Fed-batch bioreactor range (0.5-10 g/L).",
    impNote:"Above 10 g/L, at or beyond the best reported fed-batch titres.",
    ceilNote:"Above ~100 g/L exceeds total E. coli cellular protein (~55 g/L even at 100 gDCW/L, ~55% protein by dry weight)."
  },
  yeast: {
    label: "Yeast (P. pastoris)", short: "Yeast",
    low:10, typical:100, high:1000, veryhigh:15000, ceiling:150000,
    typicalNote:"Modest for a secreting yeast; routine shake-flask range.",
    highNote:"Good secreted titre (0.1-1 g/L), typical of an optimised P. pastoris clone.",
    veryNote:"High-cell-density fermentation range (1-15 g/L).",
    impNote:"Above 15 g/L, top-tier for a secreted yeast product.",
    ceilNote:"P. pastoris reaches >100-150 gDCW/L, but a single product above ~150 g/L is not achievable. Check the units."
  },
  mammalian: {
    label: "Mammalian (CHO/HEK)", short: "CHO/HEK",
    low:10, typical:100, high:1000, veryhigh:10000, ceiling:50000,
    typicalNote:"Typical transient transfection range (HEK293/CHO).",
    highNote:"Strong transient or an early stable pool (0.1-1 g/L).",
    veryNote:"Routine fed-batch mAb range (1-10 g/L); 3-6 g/L is industry standard.",
    impNote:"Above 10 g/L, near the best published CHO fed-batch titres (~12.6 g/L).",
    ceilNote:"Mammalian cultures reach far lower biomass than microbes; above ~50 g/L is not physically achievable. Check the units."
  },
  plant: {
    label: "Plant cell (BY-2)", short: "Plant cell",
    low:10, typical:100, high:500, veryhigh:1200, ceiling:20000,
    typicalNote:"Above the 10 mg/L viability threshold for further R&D.",
    highNote:"Above the ~100 mg/L benchmark generally needed to be economically interesting.",
    veryNote:"Approaching the highest titres reported for plant suspension culture.",
    impNote:"Above 1.2 g/L, beyond the highest titre ever reported for BY-2 or any plant suspension culture.",
    ceilNote:"Far beyond anything achieved in plant cell suspension; above ~20 g/L indicates a unit error."
  }
};
function classifyYield(mgPerL, hostKey){
  if (mgPerL === null || mgPerL === undefined || !isFinite(mgPerL) || mgPerL < 0) return null;
  var h = HOSTS[hostKey] || HOSTS.ecoli;
  if (mgPerL < h.low)       return { tier:"low",        label:"Low",        note:"Below the usual range for "+h.short+"." };
  if (mgPerL < h.typical)   return { tier:"typical",    label:"Typical",    note:h.typicalNote };
  if (mgPerL < h.high)      return { tier:"high",       label:"High",       note:h.highNote };

  saveT=setTimeout(()=>{saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const d=new Date();st.textContent='Saved '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');st.classList.remove('busy')},250)}
function flush(){if(saveT){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}
window.addEventListener('pagehide',flush);window.addEventListener('beforeunload',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden) flush()});

let toastT=null;
function toast(msg,opt={}){const t=$('#toast');t.innerHTML=`<span>${msg}</span>${opt.undo?'<button data-act="undo">↶ Undo</button>':''}`;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,opt.undo?6500:3400)}
function modal({title,body,ok='OK',cancel='Cancel',danger=false,wide=false,onOk,onOpen}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${escH(title)}"><div class="dlg${wide?' wide':''}"><div class="dlg-h">${escH(title)}</div><div class="dlg-b">${body}</div>
    <div class="dlg-f"><span class="grow"></span>${cancel?`<button class="btn ghost" data-m="cancel">${escH(cancel)}</button>`:''}${ok?`<button class="btn ${danger?'danger':'primary'}" data-m="ok">${escH(ok)}</button>`:''}</div></div></div>`;
  const ov=$('.overlay',root),close=()=>{root.innerHTML='';document.removeEventListener('keydown',kd,true)};
  const doOk=()=>{if(onOk&&onOk(ov)===false) return;close()};
  const kd=e=>{if(e.key==='Escape'){e.stopPropagation();close()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey||e.target.tagName!=='TEXTAREA')&&e.target.tagName!=='BUTTON'){e.preventDefault();doOk()}};
  document.addEventListener('keydown',kd,true);
  ov.addEventListener('mousedown',e=>{if(e.target===ov) close()});
  ov.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(!m) return;m.dataset.m==='ok'?doOk():close()});
  if(onOpen) onOpen(ov);else{const f=$('textarea,input,select',ov);if(f) setTimeout(()=>f.focus(),30)}
}

/* ---------------- calculations: the v5 core, one protein at a time ---------------- */
const SEQC=new Map();
function seqInfo(seq){if(!seq) return null;let st=SEQC.get(seq);if(!st){st=seqStats(seq);SEQC.set(seq,st)}return st.len?st:null}
const repsOf=p=>(p.r||[]).map(numv).filter(v=>v!==null);
function concIn(mgml,molar,u){if(['M','mM','uM','nM'].includes(u)) return molar==null?null:molarToUnit(molar,u,null);if(mgml==null) return null;return u==='mgml'?mgml:u==='ugml'?mgml*1000:u==='pct'?mgml/10:null}
const hostOf=(p,set)=>HOSTS[p.host]?p.host:set.host;
function yieldInto(o,p,set){
  const v=numv(p.vol);if(v===null||o.mgml==null) return;if(!(v>0)){o.flags.push({t:'err',m:'Final volume must be greater than zero.'});return}
  const L=volToL(v,p.volU||'mL');o.totalMg=o.mgml*L*1e3;o.totalNmol=o.molar!=null?o.molar*L*1e9:null;
  const c=numv(p.cult);if(c!==null){if(!(c>0)) o.flags.push({t:'err',m:'Culture volume must be greater than zero.'});else{o.yieldMgL=o.totalMg/volToL(c,p.cultU||'mL');o.verdict=classifyYield(o.yieldMgL,hostOf(p,set));
    if(o.verdict&&o.verdict.tier==='impossible') o.flags.push({t:'warn',m:o.verdict.note})}}
  const s=numv(p.start);if(s!==null&&s>0){o.recovery=100*o.totalMg/s;if(o.recovery>100) o.flags.push({t:'warn',m:'Recovery is over 100%: check the starting amount and units, since purification cannot increase total protein.'})}
}
/* MW and ε: typed values win; an empty box falls back to the sequence */
function effA(p){const st=seqInfo(p.seq),ok=st&&st.ok;let mw=numv(p.mw),eps=numv(p.eps),type=p.epsType||'mass01',mwFrom=false,epsFrom=false;
  if(mw===null&&ok){mw=st.mw;mwFrom=true}
  if(eps===null&&ok){eps=S.a.cys==='ox'?st.a01Oxidised:st.a01Reduced;type='mass01';epsFrom=true}
  return {mw,eps,type,mwFrom,epsFrom,st}}
function calcA(p){
  const e=effA(p),vals=repsOf(p),o={e,vals,flags:[]};
  if(e.st&&e.st.flags) o.flags.push(...e.st.flags);
  if(!vals.length&&e.eps===null){o.empty=true;return o}
  if(!vals.length){o.flags.push({t:'info',m:'Type the A280 readings.'});return o}
  if(e.eps===null){o.flags.push({t:'info',m:'Add ε (or paste the sequence) to get the concentration.'});return o}
  const r=computeRow({mw:e.mw,eps:e.eps,epsType:e.type,a280raw:vals.join(' '),dil:numv(p.dil)??1},numv(S.a.path)||10);
  o.flags.push(...r.flags.filter(f=>f.t!=='info'));if(!r.ok) return o;
  o.ok=true;o.mean=r.meanA280;o.sd=r.sdA280;o.cv=r.sdA280!=null&&r.meanA280?100*r.sdA280/r.meanA280:null;o.mgml=r.mgml;o.molar=r.molar;
  o.conc=concIn(o.mgml,o.molar,S.a.unit);o.relSD=o.sd!=null&&o.mean?o.sd/o.mean:null;
  if(o.conc==null&&['M','mM','uM','nM'].includes(S.a.unit)) o.flags.push({t:'warn',m:'Molar units need a MW (type it, or paste the sequence).'});
  if(o.cv!=null&&o.cv>10) o.flags.push({t:'warn',m:`The readings differ by ${sig(o.cv,2)}% (CV). Mix and re-read, or check for bubbles.`});
  yieldInto(o,p,S.a);return o}
function blankVal(){const c=S.c;if(c.blank==='none') return {v:0,txt:'none'};
  if(c.blank==='zero'){const z=c.stds.filter(s=>numv(s.conc)===0).flatMap(repsOf);return z.length?{v:mean(z),n:z.length,txt:'mean of the 0 standard'}:{v:0,missing:'Add a standard with concentration 0 to use it as the blank.'}}
  const r=parseReadings(c.blankRaw).values;return r.length?{v:mean(r),n:r.length,txt:'your blank readings'}:{v:0,missing:'Type the blank readings in the bar above.'}}
function calcFit(){const c=S.c,b=blankVal(),pts=[],stds=c.stds.map(s=>{const x=numv(s.conc),v=repsOf(s),m=v.length?mean(v):null,o={x,vals:v,mean:m,sd:sampleSD(v),y:m==null?null:m-b.v};if(x!==null&&o.y!=null) pts.push({x,y:o.y});return o});
  let fit={ok:false,flags:[]};if(pts.length) fit=c.fit==='quad'?quadreg(pts):Object.assign(linreg(pts),{model:'linear'});
  if(fit.ok) stds.forEach(o=>{if(o.y!=null){const cx=invertCurve(fit,o.y);o.back=cx;o.err=o.x&&cx!=null?100*(cx-o.x)/o.x:null}});
  return {fit,blank:b,stds}}
function calcC(p,F){const c=S.c,v=repsOf(p),o={vals:v,flags:[]};if(!v.length){o.empty=true;return o}
  o.mean=mean(v);o.sd=sampleSD(v);o.cv=o.sd!=null&&o.mean?100*o.sd/o.mean:null;o.relSD=o.sd!=null&&o.mean?o.sd/o.mean:null;o.corr=o.mean-F.blank.v;
  if(!F.fit.ok){o.flags.push({t:'info',m:'The standard curve is not ready yet: it needs at least '+(c.fit==='quad'?3:2)+' standards with a concentration and a reading.'});return o}
  const r=concFromCurve(F.fit,o.corr,numv(p.dil)??1);o.flags.push(...r.flags);if(!r.ok) return o;
  o.ok=true;o.inAssay=r.cMeasured;o.cAct=r.cActual;o.mgml=c.unit==='ugml'?r.cActual/1000:r.cActual;const mw=numv(p.mw);o.molar=mw>0?o.mgml/mw:null;
  o.conc=concIn(o.mgml,o.molar,c.out);if(o.conc==null&&['M','mM','uM','nM'].includes(c.out)) o.flags.push({t:'warn',m:'Molar units need the MW.'});
  if(o.cv!=null&&o.cv>10) o.flags.push({t:'warn',m:`The readings differ by ${sig(o.cv,2)}% (CV).`});
  yieldInto(o,p,c);return o}
const flagTxt=R=>(R.flags||[]).filter(f=>f.t!=='info').map(f=>f.m).join(' ');
let FIT=null;const fitNow=()=>FIT||(FIT=calcFit());
const listOf=()=>S.mode==='a280'?S.a.rows:S.c.rows;
const calcOf=p=>S.mode==='a280'?calcA(p):calcC(p,fitNow());
const colorOf=p=>COLORS[Math.max(0,listOf().indexOf(p))%COLORS.length];

/* ================= THE PROTEIN GRINDER =================
   Each protein card has a little machine: the culture slurry sits in a hopper, two toothed rollers grind it, and the
   protein bursts out of the rollers as particles that fly around a box. The box is the same size on every card:
     how many particles  <- total protein in mg (once the final volume is in), else the concentration in mg/mL, on one
                            fixed log scale (0.01 to 1000 mg, or 0.001 to 100 mg/mL), so cards compare by eye
     particle size       <- the protein's MW
     speed               <- the yield verdict for the host: calm when low, lively when very good, frantic when it is
                            more than the host can make (the grinder overheats and smokes, and a red "?!" shows)
   Beside the box the number counts up to its value. When an input changes the grinder runs again: new particles burst
   out of it (more) or fly out of the box (less), the number counts from the old value to the new one, and a chip shows
   the difference: green ▲ for more, red ▼ for less. An impressive yield throws confetti.
   Easter eggs, from the protein's name:
     GFP, mCherry and friends   the box goes dark and the particles glow in their own colour
     luciferase, NanoLuc        the glow flickers
     antibody, IgG, Fab         Y-shaped particles
     collagen, silk, elastin    long wiggling fibres
     haemoglobin, myoglobin     red beads with an iron dot
     insulin                    beads that fly in hexamers
     ubiquitin                  beads that drag a little tag
     potato                     potatoes go into the hopper and come out as little potatoes
   Purely decorative: every number it shows is the one already worked out above it. */
const Culture=(function(){
  const TICK=40,RUN=40,NMAX=150;
  const GLOW=[[/\b(e|sf|ac|mem|t|super)?gfp\b|mneon|mgreen|emerald|azami|clover|mwasabi|zsgreen/i,'#3dff7a','green'],[/yfp|venus|citrine|ypet|topaz/i,'#ffe14d','yellow'],
    [/cfp|cerulean|turquoise|mtfp|teal/i,'#4de1ff','cyan'],[/bfp|azurite|sapphire|ebfp/i,'#6e8bff','blue'],
    [/mcherry|rfp|dsred|tdtomato|mscarlet|mkate|mruby|mapple|mplum|katushka|tagrfp|irfp/i,'#ff4d6d','red'],[/mko|morange|tdorange/i,'#ff9a3d','orange']];
  const glowOf=name=>{for(const g of GLOW) if(g[0].test(name||'')) return {c:g[1],n:g[2]};return null};
  const EGGS=[['potato',/potato/i,'potatoes'],['antibody',/antibod|\big[gmae]\b|\bmab\b|\bfab\b|\bscfv\b|nanobod/i,'Y-shaped antibodies'],['fibre',/collagen|silk|elastin|fibroin|keratin/i,'fibres'],
    ['heme',/h(a)?emoglobin|myoglobin|cytochrome/i,'haem iron'],['insulin',/insulin/i,'hexamers'],['ubiquitin',/ubiquitin|\bsumo\b/i,'tags']];
  const eggOf=name=>{for(const e of EGGS) if(e[1].test(name||'')) return {k:e[0],n:e[2]};return null};
  const HOST={ecoli:{med:'#e7c977',cell:'#fbf7ee',edge:'#8a7a5c'},yeast:{med:'#d9b25f',cell:'#f7efdc',edge:'#8a6d33'},
    mammalian:{med:'#f2b4c6',cell:'#fbf3f6',edge:'#9a5c78'},plant:{med:'#dfe6c4',cell:'#f3f8ea',edge:'#5e7a4a'}};
  const SCALE={mg:{lo:.01,hi:1000,unit:'mg',what:'total protein'},mgml:{lo:.001,hi:100,unit:'mg/mL',what:'concentration'}};
  const SPEED={idle:.4,low:.55,typical:.8,happy:1,star:1.25,party:1.5,wow:2.6};
  const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
  const hex=c=>{const n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255]};
  const rgba=(c,al)=>{const [r,g,b]=hex(c);return `rgba(${r},${g},${b},${al})`};
  const shade=(c,k)=>{const [r,g,b]=hex(c),f=v=>clamp(Math.round(v*k),0,255);return `rgb(${f(r)},${f(g)},${f(b)})`};
  const cssv=(n,fb)=>{const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||fb};
  const fmt=v=>!isFinite(v)?'':v>=100?Math.round(v).toLocaleString():v>=10?v.toFixed(1):v>=1?v.toFixed(2):v>=.1?v.toFixed(3):v.toPrecision(2);
  const rr=(x,X,Y,w,h,r)=>{x.beginPath();if(x.roundRect) x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h)};
  let dishes={};
  /* the hopper and rollers on top, the box under them, the number on the right */
  function geom(W,H){const bw=W*.56,bx=6,cx=bx+bw/2,rollR=Math.max(7,Math.min(W*.035,H*.05));
    return {W,H,bx,bw,cx,by:H*.34,bh:H*.66-6,hTop:H*.03,hBot:H*.2,hTopW:bw*.26,hBotW:Math.max(5,bw*.04),rollY:H*.25,rollR,numX:W*.62}}
  const hopperHalf=(g,y)=>g.hTopW+(g.hBotW-g.hTopW)*clamp((y-g.hTop)/(g.hBot-g.hTop),0,1);
  function frac(d,v){const S=SCALE[d.unit]||SCALE.mg;if(!(v>0)) return 0;return clamp((Math.log10(v)-Math.log10(S.lo))/(Math.log10(S.hi)-Math.log10(S.lo)),0,1)}
  function verdict(o){const H=HOSTS[o.host]||HOSTS.ecoli;if(!o.ok) return 'idle';if(o.mgL!=null) return o.mgL>=H.ceiling?'wow':o.mgL>=H.veryhigh?'party':o.mgL>=H.high?'star':o.mgL>=H.typical?'happy':o.mgL>=H.low?'typical':'low';return 'typical'}
  function targets(d,o){const old=d.val,oldUnit=d.unit;
    if(o.ok&&o.totalMg>0){d.unit='mg';d.val=o.totalMg}else if(o.ok&&o.mgml>0){d.unit='mgml';d.val=o.mgml}else d.val=null;
    d.mood=verdict(o);d.tier=d.mood==='idle'?'idle':d.mood==='wow'?'wow':d.mood==='party'?'gold':'normal';
    d.glow=glowOf(o.name);d.egg=eggOf(o.name);d.luc=/lucifer|nanoluc|nluc/i.test(o.name||'');d.mgL=o.mgL;
    d.r=o.mw>150000?4.6:o.mw>80000?4:o.mw>40000?3.5:o.mw>20000?3.1:2.8;
    d.N=d.val==null?0:Math.max(3,Math.round(NMAX*frac(d,d.val)));if(d.egg&&d.egg.k==='insulin') d.N=Math.max(6,Math.round(d.N/6)*6);
    if(d.val!=null&&(old==null||oldUnit!==d.unit||Math.abs(d.val-old)>Math.abs(old)*1e-3)){
      d.from=old!=null&&oldUnit===d.unit?d.shown:0;d.run=0;d.delta=old!=null&&oldUnit===d.unit?d.val-old:null;d.deltaAge=0}
    if(d.val==null){d.run=RUN;d.delta=null}}
  /* a new particle leaves the rollers heading down into the box, then wanders off on its own */
  function spawn(d,quiet){const g=d.g,a=Math.PI/2+rnd(-.9,.9),s=rnd(2.5,4.5);
    const p={x:g.cx+rnd(-3,3),y:quiet?rnd(g.by+10,g.by+g.bh-10):g.by+4,vx:Math.cos(a)*s,vy:Math.sin(a)*s,ph:a,k:rnd(.8,1.2),out:false,trail:[],rot:rnd(0,6.28)};
    if(quiet) p.x=rnd(g.bx+10,g.bx+g.bw-10);d.ps.push(p)}
  function spawnCell(d){const g=d.g,y=rnd(g.hTop+3,g.hBot-3),hw=hopperHalf(g,y)-3;d.cells.push({x:g.cx+rnd(-hw,hw),y,a:rnd(0,6.28),s:rnd(.8,1.1)})}
  function step(d){d.t=(d.t||0)+1;const g=d.g,running=d.run<RUN;if(running) d.run++;
    const k=ease(d.run/RUN);d.shown=d.val==null?0:(running?d.from+(d.val-d.from)*k:d.val);if(d.delta!=null) d.deltaAge++;
    d.spin=running?.34:d.spin*.9;d.ang+=d.spin;
    if(running&&d.cells.length<16&&d.t%2===0) spawnCell(d);
    d.cells.forEach(c=>{c.y+=running?.7+.5*c.s:0;c.a+=running?.1:0;const hw=hopperHalf(g,c.y)-2;c.x=g.cx+clamp(c.x-g.cx,-hw,hw)});d.cells=d.cells.filter(c=>c.y<g.hBot+2);
    // particles come out of the rollers, or fly out of the box, until the count matches the amount
    const live=d.ps.filter(p=>!p.out);
    if(live.length<d.N){const n=Math.min(d.N-live.length,running?4:d.N);for(let i=0;i<n;i++) spawn(d,!running)}
    else if(live.length>d.N){const n=Math.min(live.length-d.N,running?4:live.length);const cx=g.bx+g.bw/2,cy=g.by+g.bh/2;
      for(let i=0;i<n;i++){const p=live[live.length-1-i];p.out=true;const a=Math.atan2(p.y-cy,p.x-cx);p.vx=Math.cos(a)*5;p.vy=Math.sin(a)*5}}
    // the bits that fly from the rollers to the box mouth while it runs
    if(running&&d.t%2===0) d.spray.push({x:g.cx+rnd(-2,2),y:g.rollY+g.rollR*.6,vy:rnd(1.5,3)});
    d.spray.forEach(p=>{p.vy+=.3;p.y+=p.vy});d.spray=d.spray.filter(p=>p.y<g.by+2);
    const sp=SPEED[d.mood]||1,m=d.r+3,egg=d.egg&&d.egg.k;
    // insulin flies in hexamers: every sixth particle leads, the next five follow it
    live.forEach((p,i)=>{p.lead=egg==='insulin'&&i%6?live[i-i%6]:null});
    d.ps.forEach((p,i)=>{p.trail.push([p.x,p.y]);if(p.trail.length>(egg==='fibre'?8:5)) p.trail.shift();
      if(!p.out){if(p.lead&&!p.lead.out){const j=d.ps.indexOf(p)%6,a=j*Math.PI/3+d.t*.05,tx=p.lead.x+Math.cos(a)*d.r*2.4,ty=p.lead.y+Math.sin(a)*d.r*2.4;p.vx=(tx-p.x)*.35;p.vy=(ty-p.y)*.35}
        else{p.ph+=rnd(-.35,.35);const lim=1.5*sp*p.k;p.vx+=(Math.cos(p.ph)*lim-p.vx)*.12;p.vy+=(Math.sin(p.ph)*lim-p.vy)*.12}
        p.x+=p.vx;p.y+=p.vy;p.rot+=.04*sp;
        if(p.x<g.bx+m){p.x=g.bx+m;p.vx=Math.abs(p.vx);p.ph=Math.PI-p.ph}if(p.x>g.bx+g.bw-m){p.x=g.bx+g.bw-m;p.vx=-Math.abs(p.vx);p.ph=Math.PI-p.ph}
        if(p.y<g.by+m){p.y=g.by+m;p.vy=Math.abs(p.vy);p.ph=-p.ph}if(p.y>g.by+g.bh-m){p.y=g.by+g.bh-m;p.vy=-Math.abs(p.vy);p.ph=-p.ph}}
      else{p.x+=p.vx;p.y+=p.vy;p.vx*=1.06;p.vy*=1.06}});
    d.ps=d.ps.filter(p=>!p.out||(p.x>-20&&p.x<g.W+20&&p.y>-20&&p.y<g.H+20));
    // mood effects: sparkles for very good, confetti for impressive, smoke from an overheating grinder for impossible
    if((d.mood==='star'||d.mood==='party')&&d.t%10===0) d.fx.push({k:'s',x:rnd(g.bx+10,g.bx+g.bw-10),y:rnd(g.by+10,g.by+g.bh-10),t:0});
    if(d.mood==='party'&&running&&d.t%1===0) for(let i=0;i<2;i++) d.fx.push({k:'c',x:g.cx+rnd(-8,8),y:g.rollY,vx:rnd(-2.6,2.6),vy:rnd(-3.5,-1),c:['#ff5c8a','#ffd54f','#4fc3f7','#7ee081','#b39ddb'][Math.floor(rnd(0,5))],t:0});
    if(d.mood==='wow'&&d.t%3===0) d.fx.push({k:'m',x:g.cx+rnd(-g.rollR,g.rollR),y:g.rollY-g.rollR,r:rnd(3,5),t:0});
    d.fx.forEach(f=>{f.t++;if(f.k==='c'){f.vy+=.18;f.x+=f.vx;f.y+=f.vy}else if(f.k==='m'){f.y-=.7;f.x+=Math.sin(f.t/4)*.4;f.r+=.15}});
    d.fx=d.fx.filter(f=>f.k==='s'?f.t<14:f.k==='m'?f.t<40:f.y<g.H+4)}
  function hostCell(x,d,c){const hc=HOST[d.host]||HOST.ecoli,s=Math.max(.8,d.g.W/300)*c.s;x.save();x.translate(c.x,c.y);x.rotate(c.a);x.scale(s,s);x.lineWidth=.7;
    if(d.egg&&d.egg.k==='potato'){potatoShape(x,0,0,3.2);x.restore();return}
    x.fillStyle=hc.cell;x.strokeStyle=hc.edge;x.beginPath();
    if(d.host==='ecoli'){x.moveTo(-2.6,-1.1);x.lineTo(2.6,-1.1);x.arc(2.6,0,1.1,-Math.PI/2,Math.PI/2);x.lineTo(-2.6,1.1);x.arc(-2.6,0,1.1,Math.PI/2,Math.PI*1.5)}

const HELP="<details class=\"help\" id=\"help\">\n    <summary>How every number here is worked out, with sources</summary>\n    <div class=\"helpbody\">\n      <h4>Concentration from A280</h4>\n      <p>Beer&ndash;Lambert. The extinction coefficient can be given three ways, and they are <b>not</b> interchangeable:</p>\n      <p><b>A 0.1%</b> &mdash; absorbance of a 1&nbsp;mg/mL (1&nbsp;g/L) solution in a 1&nbsp;cm cuvette. This is what Benchling and ProtParam report, and the default here. <code>c (mg/mL) = A / A<sup>0.1%</sup></code>. No MW needed.</p>\n      <p><b>E 1%</b> &mdash; absorbance of a 10&nbsp;mg/mL (1% w/v) solution. Exactly ten times A&nbsp;0.1%, so mixing them up gives a 10-fold error. <code>c (mg/mL) = 10 &times; A / E<sup>1%</sup></code>.</p>\n      <p><b>Molar &epsilon;</b> (M&#8315;&sup1;cm&#8315;&sup1;) &mdash; <code>c (M) = A / &epsilon;</code>, then <code>c (mg/mL) = c (M) &times; MW</code>. MW required.</p>\n      <p>Replicate readings are averaged (SD shown for n&nbsp;&ge;&nbsp;2). Dilution factor multiplies the result. Path length: NanoDrop's Protein A280 mode already reports a 10&nbsp;mm-equivalent number, so no correction is applied by default.</p>\n\n      <h4>Yield</h4>\n      <p>Two steps. <code>total (mg) = concentration (mg/mL) &times; volume of your prep (mL)</code>. Then <code>yield (mg/L) = total (mg) &divide; culture volume (L)</code>, assuming the whole culture went into that one purification. Eluting into a bigger volume does not change how much protein you have &mdash; it is the same material spread thinner, so multiplying back out gives the same total.</p>\n      <p><b>What counts as a good yield depends entirely on the host</b>, so pick the host in the Host column (or the default in the bar above) and the Yield check adjusts. All figures in mg per litre of culture:</p>\n      <p style=\"font-family:var(--mono);font-size:11px;line-height:1.9\">\n        <b>E. coli</b> &nbsp;&lt;10 low &middot; 10&ndash;100 typical &middot; 100&ndash;500 high &middot; 0.5&ndash;10 g/L fed-batch &middot; &gt;10 g/L impressive &middot; &gt;100 g/L impossible<br>\n        <b>Yeast (P. pastoris)</b> &nbsp;&lt;10 low &middot; 10&ndash;100 typical &middot; 0.1&ndash;1 g/L high &middot; 1&ndash;15 g/L fermenter &middot; &gt;15 g/L impressive &middot; &gt;150 g/L impossible<br>\n        <b>Mammalian (CHO/HEK)</b> &nbsp;&lt;10 low &middot; 10&ndash;100 typical transient &middot; 0.1&ndash;1 g/L high &middot; 1&ndash;10 g/L routine fed-batch &middot; &gt;10 g/L impressive &middot; &gt;50 g/L impossible<br>\n        <b>Plant cell (BY-2)</b> &nbsp;&lt;10 low &middot; 10&ndash;100 typical &middot; 100&ndash;500 high &middot; 0.5&ndash;1.2 g/L very high &middot; &gt;1.2 g/L impressive &middot; &gt;20 g/L impossible\n      </p>\n      <p>Each ceiling is a real physical limit, not a round number. <i>E. coli</i> at &gt;100 gDCW/L still holds only ~55 g/L of total cellular protein (it is 52&ndash;55% protein by dry weight), so a single product above ~100 g/L cannot exist. CHO reaches far lower biomass than microbes, hence its lower ceiling. For plant suspension culture the highest titre ever reported, for any protein in any line, is 1.1 g/L in the BY-2 clone \"Hulk\" &mdash; so anything above that is genuinely remarkable, and 20 g/L is impossible.</p>\n\n      <h4>Protein sequence &rarr; MW and &epsilon;280</h4>\n      <p>MW is the sum of average residue masses plus one water (the values ExPASy ProtParam uses). &epsilon;280 follows Pace et al. 1995: <code>&epsilon; = 5500&middot;nTrp + 1490&middot;nTyr + 125&middot;nCystine</code> M&#8315;&sup1;cm&#8315;&sup1;. Only disulfide-bonded cysteine (cystine) absorbs, so pick the redox state that matches your buffer. A 0.1% = &epsilon; / MW.</p>\n      <h4>Blank and fit</h4>\n      <p>With a blank selected, its mean absorbance is subtracted from every standard and sample before fitting. The quadratic option fits <code>A = a&#8322;C&sup2; + a&#8321;C + a&#8320;</code> by least squares and solves for C on the rising part of the curve; it warns if the curve turns over inside your standards.</p>\n      <h4>Standard curve</h4>\n      <p>Ordinary least squares through your standards: <code>A = slope &times; C + intercept</code>, inverted as <code>C = (A &minus; intercept) / slope</code>. R&sup2; below 0.99 is flagged, and a sample landing outside the concentration range you actually tested is flagged as an extrapolation. R&sup2; is a useful QC indicator, not proof by itself that a curve is valid; inspect standards, blanks, replicates and residual behaviour as appropriate for your assay.</p>\n\n      <ul>\n        <li>&middot; <a href=\"https://doi.org/10.1002/pro.5560041120\" target=\"_blank\" rel=\"noopener\">Pace et al., Protein Sci 1995 &mdash; predicting the molar absorption coefficient from sequence</a></li>\n        <li>&middot; <a href=\"https://doi.org/10.1385/1-59259-890-0:571\" target=\"_blank\" rel=\"noopener\">Gasteiger et al. 2005 &mdash; ExPASy ProtParam</a></li>\n        <li>&middot; <a href=\"https://doi.org/10.1006/abio.1996.0171\" target=\"_blank\" rel=\"noopener\">Zor &amp; Selinger, Anal Biochem 1996 &mdash; non-linearity of the Bradford assay</a></li>\n        <li>&middot; <a href=\"https://doi.org/10.1002/0471140864.ps0301s33\" target=\"_blank\" rel=\"noopener\">Grimsley &amp; Pace, Curr Protoc Protein Sci 2003 &mdash; spectrophotometric determination</a></li>\n        <li>&middot; <a href=\"https://documents.thermofisher.com/TFS-Assets/CAD/manuals/NanoDrop-2000-User-Manual-EN.pdf\" target=\"_blank\" rel=\"noopener\">NanoDrop 2000/2000c manual &mdash; path-length normalisation</a></li>\n        <li>&middot; <a href=\"https://doi.org/10.1016/0003-2697(76)90527-3\" target=\"_blank\" rel=\"noopener\">Bradford 1976 &mdash; Coomassie dye-binding assay</a></li>\n        <li>&middot; <a href=\"https://doi.org/10.1016/0003-2697(85)90442-7\" target=\"_blank\" rel=\"noopener\">Smith et al. 1985 &mdash; BCA assay</a></li>\n        <li>&middot; <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10014274/\" target=\"_blank\" rel=\"noopener\">Reilly et al. &mdash; per-litre soluble yields</a>; <a href=\"https://www.osti.gov/pages/servlets/purl/1771987\" target=\"_blank\" rel=\"noopener\">fed-batch titres to 8.1 g/L</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/1809196/\" target=\"_blank\" rel=\"noopener\">Riesenberg et al. &mdash; &gt;100 gDCW/L</a></li>\n        <li>&middot; <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10764063/\" target=\"_blank\" rel=\"noopener\">R&sup2; &gt; 0.99 linearity benchmark</a></li>\n        <li>&middot; CHO fed-batch mAb titres: <a href=\"https://www.mdpi.com/2311-5637/10/7/352\" target=\"_blank\" rel=\"noopener\">6.1&ndash;6.5 g/L, Fermentation 2024</a>; <a href=\"https://link.springer.com/article/10.1007/s10616-024-00669-4\" target=\"_blank\" rel=\"noopener\">12.6 g/L with CHO-MK, Cytotechnology 2024</a>; <a href=\"https://www.sigmaaldrich.com/US/en/technical-documents/technical-article/cell-culture-and-cell-culture-analysis/cell-culture-for-manufacturing/cho-fed-batch-system-comparison\" target=\"_blank\" rel=\"noopener\">&gt;5 g/L with commercial media</a></li>\n        <li>&middot; <i>P. pastoris</i>: <a href=\"https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2022.1059777/full\" target=\"_blank\" rel=\"noopener\">&gt;150 gDCW/L, high secreted yields</a>; <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5379694/\" target=\"_blank\" rel=\"noopener\">285 mg/L secreted GM-CSF vs 64 mg/L in <i>S. cerevisiae</i></a></li>\n        <li>&middot; Plant cell suspension: <a href=\"https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2018.00045/full\" target=\"_blank\" rel=\"noopener\">1.1 g/L in BY-2 \"Hulk\", the highest ever reported; 10 mg/L R&amp;D and 100 mg/L profitability thresholds</a>; <a href=\"https://doi.org/10.3389/fpls.2016.00297\" target=\"_blank\" rel=\"noopener\">Santos et al. 2016 review</a></li>\n      </ul>\n    </div>\n  </details>\n<p class=\"wm\">Designed and generated by Dongmin Byun &middot; bdongmin10@gmail.com &middot; Claude was utilized in the generation.</p>";
const HERO=`<svg class="pq-hero" viewBox="0 0 320 190" role="img" aria-label="A culture flask, a pipetted sample and a spectrophotometer reading it">

        <radialGradient id="pqLamp"><stop offset="0" stop-color="#f5f3ff"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
