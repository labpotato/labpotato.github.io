<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save citation · Lab Potato</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--ink2:#3d424b;--mut:#5d636d;--line:#e4e7ec;--line2:#d6d4ce;--blue:#1f66cc;--blued:#1a56ad;--bluel:#e6effb;--ok:#0f9d76}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#f1f2f4;--ink2:#c3c7ce;--mut:#9aa0a9;--line:#2b3038;--line2:#3a404a;--blue:#5b9dff;--blued:#8cbaff;--bluel:#16233a;--ok:#3fcf9f}}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:18px;max-width:560px;margin:0 auto}
  h1{font-size:17px;margin:0 0 2px;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .kind{display:inline-block;font:600 10px/1 sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--bluel);color:var(--blue);margin-bottom:8px}
  .ttl{font-size:15px;font-weight:650;line-height:1.3}
  .meta{color:var(--mut);font-size:12.5px;margin-top:3px}
  .cite{font-size:12.5px;color:var(--ink2);margin-top:9px;border-left:2px solid var(--line2);padding-left:9px;line-height:1.5;word-break:break-word}
  label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
  input{width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:7px 9px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer}
  button:hover{border-color:var(--mut)}
  button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:var(--blued);border-color:var(--blued)}
  .note{font-size:12px;color:var(--mut);margin-top:12px}
  .ok{color:var(--ok)}
  .err{color:#d1495b}
  .hd{display:flex;align-items:center;gap:8px}.hd img{width:22px;height:22px;border-radius:5px}
</style></head>
<body>
  <div class="hd"><img src="icon48.png" alt=""><div><h1>Save citation</h1></div></div>
  <p class="sub">The page's reference, ready to download or send to your Lab Entry research map.</p>
  <div class="card" id="card"><div class="meta">Reading the page…</div></div>
  <div id="editwrap" hidden>
    <label>Title</label><input id="e-title">
    <div class="row"><div style="flex:2"><label>Authors</label><input id="e-auth"></div><div style="flex:1"><label>Year</label><input id="e-year"></div></div>
    <label>DOI or URL</label><input id="e-url">
  </div>
  <div class="row" id="dls" hidden>
    <button data-dl="ris">RIS (.ris)</button>
    <button data-dl="enw">EndNote (.enw)</button>
    <button data-dl="bib">BibTeX (.bib)</button>
    <button data-dl="copy">Copy citation</button>
    <span style="flex:1"></span>
    <button class="pri" id="send">Send to Lab Entry →</button>
  </div>
  <p class="note" id="status"></p>
  <script src="cite.js"></script>
  <script src="cite-ui.js"></script>
</body></html>
