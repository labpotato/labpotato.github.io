# Once a day: read the visit statistics from GoatCounter and save them as
# assets/usage.json, which the homepage's usage section reads.
# Needs the repository secret GOATCOUNTER_TOKEN (a GoatCounter API key that
# can only read statistics). Run it by hand from the Actions tab any time.
name: Update usage numbers

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC = 10:17 in Singapore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage
  cancel-in-progress: false   # a second run waits for the first instead of stopping it

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          # GoatCounter now and then answers one request wrongly; the script retries each request,
          # and this retries the whole job after a pause
          for i in 1 2 3; do python3 tools/build_usage.py && exit 0; echo "Attempt $i failed"; sleep 90; done
          exit 1
      - name: Save if anything changed
        run: |
          git config user.name "labpotato-bot"
          git config user.email "labpotato-bot@users.noreply.github.com"
          git add assets/usage.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update usage numbers"
          # main may have moved while the job ran: put this commit on top, then push (a few tries)
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
