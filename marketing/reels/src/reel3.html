function alarmClock(x, y, s, t, ring, squash = 0) {
  const sh = ring ? Math.sin(t * 95) * 9 : 0, hop = ring ? -Math.abs(Math.sin(t * 47)) * 10 : 0;
  const sq = 1 - .5 * squash, sw = 1 + .3 * squash;
  const ham = ring ? Math.sin(t * 120) * 24 : 0;
  let v = '';
  if (ring) for (let i = 0; i < 3; i++) { const a = -2.4 + i * .5, b = -.7 + i * .5; v += `<path d="M${Math.cos(a) * 130} ${-90 + Math.sin(a) * 130}q-12 -8 -22 -20M${Math.cos(b) * 130} ${-90 + Math.sin(b) * 130}q12 -8 22 -20" stroke="#ffd36b" stroke-width="7" stroke-linecap="round" fill="none" opacity="${.6 + .4 * Math.sin(t * 40 + i)}"/>`; }

    <path d="M-55 -10l-20 14M55 -10l20 14" stroke="#33363d" stroke-width="12" stroke-linecap="round"/>

    <circle cx="0" cy="-90" r="95" fill="#e5484d"/><circle cx="-10" cy="-100" r="95" fill="#ef6a6e" opacity=".5"/>
    <circle cx="0" cy="-90" r="76" fill="#fffaf2" stroke="#b9343a" stroke-width="5"/>
    ${[...Array(12)].map((_, i) => { const a = i / 12 * Math.PI * 2; return `<circle cx="${Math.sin(a) * 62}" cy="${-90 - Math.cos(a) * 62}" r="${i % 3 ? 3 : 5}" fill="#3a3f4b"/>`; }).join('')}

}

function bolt(x, y, s, r) { return `<path transform="translate(${x},${y}) rotate(${r}) scale(${s})" d="M0 -40L-14 4H2L-8 40L18 -10H2L12 -40Z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/>`; }
function speedLines(t, n, dir, y0, y1, a = 1) {
  let s = '';
  for (let i = 0; i < n; i++) { const y = y0 + rnd(i * 3.1) * (y1 - y0), x = ((rnd(i) * 1400 - t * 3200 * dir) % 1400 + 1400) % 1400 - 160, w = 120 + rnd(i + 9) * 260; s += `<path d="M${x} ${y}h${w}" stroke="#fff" stroke-width="${6 + rnd(i + 4) * 8}" stroke-linecap="round" opacity="${.7 * a}"/>`; }

function dust(x, y, k, n = 6) {
  if (k <= 0 || k >= 1) return '';
  let s = '';
  for (let i = 0; i < n; i++) { const a = Math.PI + (i / (n - 1)) * Math.PI, r = 30 + 90 * easeOut(k); s += `<circle cx="${x + Math.cos(a) * r * 1.4}" cy="${y + Math.sin(a) * r * .5}" r="${(30 - 18 * k) * (1 + rnd(i))}" fill="#fff" opacity="${.8 * (1 - k)}"/>`; }

// lab bench scene
const SHELF = [[420, 'beaker', '#4aa8ff'], [500, 'round', '#b06cff'], [575, 'cyl', '#2fd39b'], [645, 'beaker', '#ff9f43'], [720, 'erl', '#ff5fa2']];
function glass(kind, color, s = 1) {
  if (kind === 'beaker') return `<g transform="scale(${s})"><path d="M-28 -80h56v74a6 6 0 0 1 -6 6h-44a6 6 0 0 1 -6 -6z" fill="#e8f6ff" opacity=".7" stroke="#8fb4c8" stroke-width="4"/><rect x="-24" y="-44" width="48" height="40" rx="4" fill="${color}" opacity=".85"/><path d="M-32 -80h64" stroke="#8fb4c8" stroke-width="5"/></g>`;
  if (kind === 'round') return `<g transform="scale(${s})"><rect x="-10" y="-96" width="20" height="40" fill="#e8f6ff" stroke="#8fb4c8" stroke-width="4"/><circle cx="0" cy="-34" r="34" fill="#e8f6ff" opacity=".7" stroke="#8fb4c8" stroke-width="4"/><path d="M-30 -26a30 30 0 0 0 60 0z" fill="${color}" opacity=".85"/></g>`;
  if (kind === 'cyl') return `<g transform="scale(${s})"><rect x="-14" y="-120" width="28" height="116" rx="5" fill="#e8f6ff" opacity=".7" stroke="#8fb4c8" stroke-width="4"/><rect x="-10" y="-70" width="20" height="64" fill="${color}" opacity=".85"/><rect x="-26" y="-6" width="52" height="8" rx="4" fill="#8fb4c8"/></g>`;

    const px = x + Math.cos(a) * v * kk * (i % 2 ? 1 : -1), py = y + Math.sin(a) * v * kk + 900 * kk * kk;
    s += `<path transform="translate(${px},${Math.min(py, 1452)}) rotate(${kk * 700 * (rnd(seed + i) - .5)})" d="M0 -10L9 6L-8 8Z" fill="${i % 3 ? '#dff2ff' : color}" stroke="#8fb4c8" stroke-width="2" opacity="${1 - clamp(k - .8) * 3}"/>`;
  }
  s += `<ellipse cx="${x}" cy="1452" rx="${70 * easeOut(Math.min(k * 2, 1))}" ry="12" fill="${color}" opacity=".55"/>`;
  return s;
}
function labScene(t, u, st) {

function mix(a, b, k) {

    P.red = .5; P.lid = .4; P.lidTilt = .8; P.lookX = 1; P.lookY = .6; P.mouth = 'clench'; P.frontR = true; P.armR = lerp(160, 60, easeOut(prog(u, 2.08, 2.2))); P.lenR = 50;
    const k = prog(u, 2.1, 2.4);
    if (u < 2.4) ball = [lerp(500, 955, k), lerp(1060, 1230, k) - 330 * 4 * k * (1 - k), k * 720];
    else { const b = prog(u, 2.4, 2.62); ball = [lerp(955, 1060, b), lerp(1230, 1420, b) - 120 * 4 * b * (1 - b), 720 + b * 400]; }
    if (u > 2.45) { P.lid = .55; P.lidTilt = -.6; P.mouth = 'frown'; P.red = .2; }
  }
  if (u >= 2.6 && u < 3.4) { // time-lapse: jump-cut poses, sky shifts, balls pile up
    const pose = Math.floor((u - 2.6) / .1) % 4; balls = Math.floor(prog(u, 2.6, 3.4) * 14);
    P.steam = 0; P.red = 0;
    if (pose === 0) { P.frontR = true; P.armR = 60; P.lenR = 75; P.lookY = 1; P.lid = .3; P.mouth = 'frown'; P.holdR = `<g transform="rotate(-30)"><rect x="-5" y="-50" width="10" height="56" rx="3" fill="#f5b301"/></g>`; }
    if (pose === 1) { P.frontL = P.frontR = true; P.armL = 150; P.armR = 150; P.lenL = 30; P.lenR = 30; P.lid = .7; P.mouth = 'wobble'; P.rot = -6; }
    if (pose === 2) { P.lookX = 1; P.lid = .4; P.mouth = 'flat'; P.x = 410; }
    if (pose === 3) { P.squeeze = 1; P.mouth = 'clench'; P.rot = 6; P.x = 340; }
  } else if (u >= 3.4) balls = 14;
  if (u >= 3.4 && u < 4.95) { // exhausted at night
    P.y = lerp(1330, 1395, easeInOut(prog(u, 3.4, 3.9))); P.lid = lerp(.6, .8, prog(u, 3.4, 4.3)); P.lidTilt = -.7; P.mouth = 'frown'; P.lookX = .7; P.lookY = .2;
    if (u >= 3.95 && u < 4.25) { P.frontR = true; P.armR = 75; P.lenR = lerp(50, 95, Math.sin(prog(u, 3.95, 4.25) * Math.PI)); }
    if (u >= 4.05) { kind = 'load'; mk = prog(u, 4.1, 4.9); }
    if (u >= 4.3) { P.lid = lerp(.8, .97, prog(u, 4.3, 4.6)); P.rot = 4 * easeInOut(prog(u, 4.3, 4.7)); }
  }
  if (u >= 4.95) { // DING
    kind = 'good'; mk = prog(u, 4.95, 5.4); glow = 1 - .5 * prog(u, 5.4, 6.2);
    P.y = 1395; P.rot = 4; P.lid = .97; P.lidTilt = 0; P.mouth = 'o'; P.mouthOpen = .3; P.lookX = .8;
    if (u >= 5.05) { P.lid = lerp(.97, 0, easeOut(prog(u, 5.05, 5.15))); }
    if (u >= 5.15) { P.y = lerp(1395, 1330, easeOutBack(prog(u, 5.15, 5.4))); P.rot = 0; P.sparkle = 1; P.eyeS = lerp(1, 1.75, easeOutBack(prog(u, 5.15, 5.35))); P.mouth = 'wobble'; P.tear = prog(u, 5.3, 5.6); P.blush = 1; P.lookX = .5; P.rim = '#bfe3ff'; }
    if (u >= 5.6) { const h = hop(u, 5.6, .35, 180); P.y = 1330 + h.dy; P.sx = h.sx; P.sy = h.sy; P.sparkle = 0; P.squeeze = 1; P.eyeS = 1; P.mouth = 'grin'; P.armL = 165; P.armR = 165; P.lenL = 55; P.lenR = 55; P.tear = 0; }
    if (u >= 6.0) { P.squeeze = 1; P.armL = 165; P.armR = 165; }
  }
  let s = deskScene(t, u, st);
  // paper balls on the floor and desk (behind desk front: draw desk-level ones after desk)
  s += monitor(735, 880, kind, mk, glow, wob);
  s += potato3(P);
  // desk
  s += `<rect x="0" y="1180" width="1080" height="36" fill="#a86f45"/><rect x="0" y="1216" width="1080" height="704" fill="#8f5c39"/>
    <rect x="40" y="1250" width="460" height="150" rx="14" fill="#9b6640" stroke="#7a4b2c" stroke-width="5"/><rect x="230" y="1310" width="80" height="14" rx="7" fill="#d8b07a"/>`;
  // keyboard, notepad, mug on the desk (they hop on the slam)
  const jump = u >= 1.25 && u < 1.6 ? -40 * Math.sin(prog(u, 1.25, 1.6) * Math.PI) : 0;
  s += `<g transform="translate(0,${jump})"><rect x="600" y="1150" width="290" height="34" rx="8" fill="#d5d9e3" stroke="#9aa1ad" stroke-width="4"/>
    ${[...Array(9)].map((_, i) => `<rect x="${611 + i * 30}" y="${1158 + (jump ? Math.sin(i * 2) * 10 : 0)}" width="24" height="16" rx="4" fill="#fff"/>`).join('')}</g>
    <g transform="translate(0,${jump * .7})"><rect x="430" y="1150" width="150" height="34" rx="4" fill="#fffef7" stroke="#d9d4c3" stroke-width="3"/>
    ${u >= 1.42 && u < 1.95 ? [...Array(Math.floor(prog(u, 1.42, 1.88) * 8))].map((_, i) => `<path d="M${442 + rnd(i) * 40} ${1158 + rnd(i + 3) * 18}l${40 + rnd(i + 1) * 60} ${(rnd(i + 2) - .5) * 14}" stroke="#2a2018" stroke-width="3"/>`).join('') : ''}</g>
    <g transform="translate(960,${1180 + jump * 1.3}) rotate(${jump ? 12 * Math.sin(u * 30) : 0})"><path d="M-30 -70h60v62a8 8 0 0 1 -8 8h-44a8 8 0 0 1 -8 -8z" fill="#e5484d"/><path d="M30 -56q24 0 24 22t-24 22" stroke="#e5484d" stroke-width="9" fill="none"/>${u < 3.4 ? `<rect x="-24" y="-66" width="48" height="10" rx="4" fill="#5b3418"/>` : ''}</g>`;
  // bin and balls (in front of the desk)
  s += `<path d="M900 1240h120l-14 210h-92z" fill="#9aa1ad" stroke="#6b7280" stroke-width="5"/><rect x="890" y="1232" width="140" height="16" rx="8" fill="#6b7280"/>`;
  for (let i = 0; i < balls; i++) s += paperBall(80 + rnd(i * 7) * 950, i % 3 === 0 ? 1160 : 1440 + rnd(i) * 30, .9, i * 47);
  if (ball) s += paperBall(ball[0], ball[1], .8, ball[2]);
  if (u >= 2.4 && u < 2.6) s += starsBurst(955, 1235, prog(u, 2.4, 2.6), 4, 60);
  if (u >= 1.25 && u < 1.5) s += starsBurst(600, 1180, prog(u, 1.25, 1.5), 8, 220);
  if (u >= 5.1 && u < 6.2) for (let i = 0; i < 7; i++) s += sparkle(735 + Math.cos(i + t * 2) * (260 + i * 20), 880 + Math.sin(i * 1.7 + t * 2) * 220, 16 + 10 * Math.sin(t * 9 + i), '#fff3a8', t * 90 + i * 40);
  // sleep bubble
  if (u >= 4.4 && u < 4.97) s += bubble(P.x + 20, P.y - 220, 8 + 40 * prog(u, 4.4, 4.95) + 4 * Math.sin(u * 8));
  // night grade with monitor glow
  if (night > 0) s += `<rect width="1080" height="1920" fill="#0b1030" opacity="${.62 * night}"/><ellipse cx="735" cy="900" rx="520" ry="560" fill="url(#glowG)" opacity="${.55 * night}"/>`;
  // camera
  let cam = { x: 580, y: 1010, z: 1.32 };
  if (u < .75) { const k = easeInOut(prog(u, .45, .7)); cam = { x: lerp(735, 580, k), y: lerp(880, 1010, k), z: lerp(2.3, 1.32, k) }; }
  if (u >= .75 && u < 1.25) cam.z = lerp(1.32, 1.7, easeIn(prog(u, .75, 1.25))), cam.x = 450, cam.y = 960;
  if (u >= 1.25 && u < 1.42) cam = { x: 560, y: 1010, z: 1.3 };
  if (u >= 3.4 && u < 4.95) cam = { x: lerp(580, 540, prog(u, 3.4, 4.9)), y: lerp(1010, 1040, prog(u, 3.4, 4.9)), z: lerp(1.32, 1.65, easeInOut(prog(u, 3.4, 4.9))) };
  if (u >= 4.95) cam = { x: 560, y: 1020, z: lerp(1.65, 1.3, easeOut(prog(u, 4.95, 5.3))) };
  return { svg: s, cam, shake: (u >= 1.25 && u < 1.5 ? 16 * (1 - prog(u, 1.25, 1.5)) : 0) + (u >= 4.95 && u < 5.1 ? 6 : 0) };
}

function shotF(t) { // 14.6 - 17.0 celebration
  const u = t - 14.6;
  const P = { x: 540, y: 1420, s: 2.3, t, squeeze: 1, mouth: 'grin', blush: 1 };
  const gel = `<g transform="translate(0,-60)"><rect x="-70" y="-50" width="140" height="100" rx="6" fill="#18203a" stroke="#fff" stroke-width="5"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${-58 + i * 25}" y="${-30 + (i % 2) * 14}" width="18" height="6" rx="3" fill="#e8f1ff"/><rect x="${-58 + i * 25}" y="${6 + (i % 3) * 8}" width="18" height="6" rx="3" fill="#e8f1ff"/>`).join('')}</g>`;
  if (u < .8) { const h = hops(u, [[0, .2, 90], [.27, .2, 90], [.54, .2, 90]]); P.y += h.dy; P.sx = h.sx; P.sy = h.sy; P.x = 540 + 70 * Math.sin(u * Math.PI / .27); P.rot = 10 * Math.sin(u * Math.PI / .27); P.armL = 140 + 30 * Math.sin(u * 23); P.armR = 140 - 30 * Math.sin(u * 23); }
  if (u >= .8 && u < 1.3) { P.squeeze = 0; P.sparkle = 1; P.eyeS = 1.5; P.armL = 172; P.armR = 172; P.lenL = 60; P.lenR = 60; P.frontL = P.frontR = true; P.holdR = `<g transform="translate(-55,-40)">${gel}</g>`; const w = spring(u - .8, 2, 5); P.sy = 1 + .06 * w; }
  if (u >= 1.3 && u < 1.75) { P.squeeze = 0; P.lid = 1; P.mouth = u > 1.45 ? 'pucker' : 'cat'; P.frontL = P.frontR = true; P.armL = 50; P.armR = 50; P.lenL = 46; P.lenR = 46; P.holdR = `<g transform="translate(-70,0) scale(1.1)">${gel}</g>`; P.rot = 4 * Math.sin(u * 8); P.blush = 1.2; }
  if (u >= 1.75 && u < 2.1) { const k = prog(u, 1.75, 2.1); P.flip = Math.cos(k * Math.PI * 2); P.armL = 150; P.armR = 150; const h = hop(u, 1.75, .25, 120); P.y += h.dy; }
  if (u >= 2.1) { P.armL = 172; P.armR = 172; P.lenL = 58; P.lenR = 58; P.squeeze = 1; const w = spring(u - 2.1, 2.5, 5); P.sy = 1 + .1 * w; P.sx = 1 - .08 * w; }
  let s = sunburst(t) + `<rect x="0" y="1420" width="1080" height="500" fill="#e58d3a"/><ellipse cx="540" cy="1420" rx="520" ry="40" fill="#ffd36b" opacity=".5"/>`;
  s += confetti(t, 14.6, 46);
  s += potato3(P);
  if (u >= 1.48 && u < 2.2) { const k = prog(u, 1.48, 2.2); s += heart(560 + 40 * Math.sin(k * 9), 760 - 300 * k, 2.2 * pop(u, 1.48, .3), 1 - k * .8); s += heart(420, 820 - 200 * k, 1.2 * pop(u, 1.6, .3), 1 - k); }
  if (u >= 2.1) s += starsBurst(540, 900, prog(u, 2.1, 2.4), 10, 380);
  const z = lerp(1.5, 1.28, easeOut(prog(u, 0, .4))) + (u >= 2.1 ? .06 * spring(u - 2.1, 2, 5) : 0);
  return { svg: s, cam: { x: 540, y: 1090, z }, shake: 0 };
}

function shotG(t) { // 17.0 - 18.2: the alarm rings again; push back in to the opening frame
  const u = t - 17.0;
  const P = { x: 330, y: 1330, s: 2.0, rot: -6, t, lid: .35, mouth: 'flat', lookX: 0 };
  if (u >= .25 && u < .55) P.lookX = lerp(0, 1, easeOut(prog(u, .25, .35)));
  if (u >= .55) { P.lookX = 0; P.lid = .55; P.lidTilt = -.8; P.mouth = 'wobble'; P.tear = prog(u, .6, 1.0) * .7; }
  const s = bedroom(t, { potato: P, blanketFly: 0, clockRing: true, clockSquash: 0 });
  const k = easeInOut(prog(u, .7, 1.2));
  return { svg: s, cam: { x: lerp(560, 796, k), y: lerp(1090, 1080, k), z: lerp(1.22, 1.9, k) }, shake: 0 };
}

// ---------------------------------------------------------------- edit: cuts, whips and a zoom punch
const CUTS = [[0, shotA], [2.0, shotB], [4.6, shotC], [8.4, shotD], [14.6, shotF], [17.0, shotG]];
function shotAt(t) { let f = CUTS[0][1]; for (const [t0, fn] of CUTS) if (t >= t0) f = fn; return f(t); }
function shotFn(t) { let f = CUTS[0][1]; for (const [t0, fn] of CUTS) if (t >= t0) f = fn; return f; }
const WHIPS = [[2.0, 1], [4.6, -1]]; // +1: camera pans left (frame slides right), -1: pans right
function place(r, t, zp, dx) {
  const c = r.cam, z = c.z * zp;
  c.x = clamp(c.x, 540 / c.z, 1080 - 540 / c.z); c.y = clamp(c.y, 960 / c.z, 1920 - 960 / c.z);
  const sh = r.shake || 0, sx = sh * Math.sin(t * 97), sy = sh * Math.cos(t * 83);
  return `<g transform="translate(${540 + dx + sx},${960 + sy}) scale(${z}) translate(${-c.x},${-c.y})">${r.svg}</g>`;
}
function frame(t) {
  let body = null, flash = 0, zp = 1;
  for (const [T, dir] of WHIPS) {
    if (t >= T - .17 && t < T + .17) {   // whip pan: outgoing and incoming shots side by side, motion blurred
      const k = easeInOut(prog(t, T - .17, T + .17)), off = dir * 1080 * k;
      const blur = 70 * Math.sin(k * Math.PI);
      const prev = shotFn(T - .001)(t), next = shotFn(T)(t);
      body = `<g filter="url(#mb${Math.min(9, Math.round(blur / 8))})">${place(prev, t, 1, off)}${place(next, t, 1, off - dir * 1080)}</g>`;
    }
  }
  if (t >= 14.42 && t < 14.6) { const k = easeIn(prog(t, 14.42, 14.6)); zp = 1 + .7 * k; flash = k; }
  if (t >= 14.6 && t < 14.78) { flash = 1 - prog(t, 14.6, 14.78); }
  if (t >= 8.4 && t < 8.44) flash = .35; // smash cut pop
  if (!body) body = place(shotAt(t), t, zp, 0);
  return `${body}<rect width="1080" height="1920" fill="url(#vig)"/>
    ${flash > 0 ? `<rect width="1080" height="1920" fill="#fff" opacity="${flash}"/>` : ''}`;
}

const DEFS3 = `<defs>${RIG_DEFS}
  <linearGradient id="bedWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3358"/><stop offset="1" stop-color="#3d4a7a"/></linearGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6bc2"/><stop offset=".6" stop-color="#ff9f7a"/><stop offset="1" stop-color="#ffd59e"/></linearGradient>
  <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9fd2ff" stop-opacity=".9"/><stop offset="1" stop-color="#9fd2ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="burstG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d5" stop-opacity=".95"/><stop offset="1" stop-color="#fff6d5" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
  ${[...Array(10)].map((_, i) => `<filter id="mb${i}" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="${i * 8} 0"/></filter>`).join('')}
</defs>`;
const stage = document.getElementById('stage');
window.render = t => { stage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">${DEFS3}${frame(t)}</svg>`; };
const m = /t=([\d.]+)/.exec(location.search); render(m ? +m[1] : 0);
</script></body></html>
