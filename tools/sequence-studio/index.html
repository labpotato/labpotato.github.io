<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab Potato</title>
<meta name="robots" content="noindex"><style>body{font:15px/1.5 system-ui,sans-serif;background:#edf1f6;color:#121925;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#1f66cc}</style>
<script src="../../assets/tools.js"></script>
<script>
/* tools/<tool>/ always opens that tool's newest version, so links between tools never go stale */
(function(){var id=location.pathname.replace(/\/index\.html$/,'').replace(/\/$/,'').split('/').pop();
 var t=(typeof TOOLS!=='undefined'?TOOLS:[]).filter(function(x){return x.id===id})[0];
 if(t){var v=t.versions[t.versions.length-1];location.replace(v.file+location.search+location.hash);}
 else document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p>Tool not found. <a href="../../#tools">All tools</a></p>'});})();
</script></head>
<body><p>Opening the latest version… <a href="../../#tools">All tools</a></p></body></html>
